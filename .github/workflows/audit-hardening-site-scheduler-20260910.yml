          old="async function loadSiteVisibility(){const id=$('scheduleTopic')?.value,box=$('sitePublishStatus'),btn=$('sitePublishBtn');if(!id||!box)return;try{const j=await api('/api/admin/site-visibility/'+id),v=!!j.state?.visible;box.className='status '+(v?'ok':'warn');box.textContent=v?`${id}: стаття видима на сайті й бере участь у Latest.`:`${id}: стаття індексується за прямим URL, але прихована з навігації та Latest.`;if(btn){btn.disabled=v;btn.textContent=v?'На сайті ✓':'Опублікувати на сайт'}}catch(e){box.className='status bad';box.textContent=e.message}}"
          new="async function loadSiteVisibility(){const id=$('scheduleTopic')?.value,box=$('sitePublishStatus'),btn=$('sitePublishBtn'),sbtn=$('siteScheduleBtn'),cbtn=$('siteScheduleCancelBtn');if(!id||!box)return;try{const j=await api('/api/admin/site-visibility/'+id),st=j.state||{},v=!!st.visible,sc=st.schedule||null;box.className='status '+(v?'ok':(sc?.status==='scheduled'?'ok':'warn'));if(v)box.textContent=`${id}: стаття видима на сайті й бере участь у Latest.`;else if(sc?.status==='scheduled')box.textContent=`${id}: сайт заплановано на ${new Date(sc.scheduled_for).toLocaleString('uk-UA')} (${sc.timezone||'Europe/Stockholm'}). До цього часу стаття прихована з навігації та Latest.`;else box.textContent=`${id}: стаття індексується за прямим URL, але прихована з навігації та Latest.`;if(btn){btn.disabled=v;btn.textContent=v?'На сайті ✓':'Опублікувати на сайт зараз'}if(sbtn)sbtn.disabled=v;if(cbtn)cbtn.hidden=!(sc?.status==='scheduled')}catch(e){box.className='status bad';box.textContent=e.message}}"
          assert old in s
          s=s.replace(old,new,1)
          anchor="async function publishSite(){"
          insert="""async function scheduleSite(){const id=$('scheduleTopic')?.value,d=$('siteScheduleDate')?.value,t=$('siteScheduleTime')?.value||'09:00';if(!id||!d)return flash('Вибери дату публікації сайту');const local=new Date(`${d}T${t}:00`);if(!Number.isFinite(local.getTime()))return flash('Некоректна дата/час');const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Stockholm';const ok=await modalConfirm('Запланувати публікацію на сайт?',`${id}: стане видимою ${local.toLocaleString('uk-UA')} (${timezone}). Social posts цією дією НЕ плануються.`);if(!ok)return;const btn=$('siteScheduleBtn');setBusy(btn,true,'Планую…');try{await api('/api/admin/site-visibility/'+id+'/schedule',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scheduled_for:local.toISOString(),timezone})});setBusy(btn,false);markDone(btn,'Заплановано ✓');flash(`${id}: сайт заплановано`);await loadSiteVisibility()}catch(e){setBusy(btn,false);$('sitePublishStatus').className='status bad';$('sitePublishStatus').textContent=e.message}}\nasync function cancelSiteSchedule(){const id=$('scheduleTopic')?.value;if(!id)return;if(!await modalConfirm('Скасувати план сайту?',`${id}: запланована видимість буде скасована. Стаття лишиться прихованою з навігації.`))return;try{await api('/api/admin/site-visibility/'+id+'/cancel-schedule',{method:'POST'});flash(`${id}: план сайту скасовано`);await loadSiteVisibility()}catch(e){$('sitePublishStatus').className='status bad';$('sitePublishStatus').textContent=e.message}}\n"""
          if "async function scheduleSite()" not in s:
