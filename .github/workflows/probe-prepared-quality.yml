name: Probe prepared quality
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-prepared-quality.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe WQ018
        run: |
          set +e
          code=$(curl -L -sS --max-time 30 -X POST 'https://wisequotesworld.com/ops/run/prepared-quality/WQ018' -o /tmp/r.json -w '%{http_code}')
          echo "HTTP=$code"
          cat /tmp/r.json
          echo
          exit 0
