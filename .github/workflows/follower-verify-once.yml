name: Final follower production verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follower-verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for production propagation
        run: sleep 45
      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ips < <(getent ahostsv4 wisequotesworld.com 2>/dev/null | awk '{print $1}' | sort -u || true)
          if [[ "${#ips[@]}" -eq 0 ]]; then
            doh=$(curl -fsS --connect-timeout 10 --max-time 20 --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=wisequotesworld.com&type=A' || true)
            mapfile -t ips < <(printf '%s' "$doh" | jq -r '.Answer[]? | select(.type==1) | .data' 2>/dev/null | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u || true)
          fi
          [[ "${#ips[@]}" -gt 0 ]]
          resolve=(--resolve "wisequotesworld.com:443:${ips[0]}")
          fetch(){ curl "${resolve[@]}" -L -fsS --connect-timeout 10 --max-time 30 --retry 4 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$1"; }
          js=$(cat start/localized.js)
          version=$(grep -oE 'localized\.js\?v=[0-9-]+' uk/start/index.html | head -1 | cut -d= -f2)
          [[ -n "$version" ]]
          start=$(fetch "https://wisequotesworld.com/start/?rb=$(date +%s)")
          for lang in uk ru pl en sv de es fr; do
            token=$(printf '%s' "$js" | grep -oE "${lang}:\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}" | head -1)
            [[ -n "$token" ]]
            mapfile -t vals < <(printf '%s' "$token" | grep -oE ':[0-9]+' | tr -d ':')
            total=0; for v in "${vals[@]}"; do total=$((total+v)); done
            formatted=$(python -c "print(f'{int($total):,}')")
            grep -Fq "data-total=\"$lang\">$formatted</b>" <<<"$start"
            page=$(fetch "https://wisequotesworld.com/$lang/start/?rb=$(date +%s)-$lang")
            for v in "${vals[@]}"; do grep -Fq "<small>${v} " <<<"$page"; done
          done
          livejs=$(fetch "https://wisequotesworld.com/start/localized.js?v=$version&rb=$(date +%s)")
          for lang in uk ru pl en sv de es fr; do
            token=$(printf '%s' "$js" | grep -oE "${lang}:\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}" | head -1)
            grep -Fq "$token" <<<"$livejs"
          done
          echo 'overall=PASS'
      - name: Remove one-shot verifier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/follower-verify-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-shot follower verifier'
          git push
