name: install-site-visibility-route
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-site-visibility-route.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          anchor="const topicAdminResponse=await adminTopicsApi(request,env);if(topicAdminResponse)return topicAdminResponse;"
          insert="const siteVisibilityResponse=await siteVisibilityApi(request,env);if(siteVisibilityResponse){if(siteVisibilityResponse.ok&&isMutation(request,url))scheduleIndexNow(ctx,submitRecentPublished(env,10));return siteVisibilityResponse}"
          if insert not in s:
              if anchor not in s: raise SystemExit('admin topics routing anchor missing')
              s=s.replace(anchor,anchor+insert,1)
          p.write_text(s)
          PY
          node --check _worker.js
          git diff --check
      - name: Commit production patch
        run: |
          git config user.name oshtogryn
          git config user.email alex.shtogryn@gmail.com
          git add _worker.js
          if git diff --cached --quiet; then
            echo 'Already patched.'
            exit 0
          fi
          git commit -m 'Route website visibility Admin API'
          git pull --rebase
          git push
