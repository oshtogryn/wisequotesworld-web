name: Apply WQ020 native social copy fixes 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/apply-wq020-native-copy-fix-20260908.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy
        run: sleep 75
      - name: Apply and capture
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -fsSL --retry 15 --retry-all-errors --retry-delay 4 -X POST \
            -H 'x-wq020-fix: native-copy-20260908' \
            'https://wisequotesworld.com/ops/export/wq020-normalize-7bc3d911' \
            -o ops/readback/wq020-native-copy-fix-20260908.json
          python - <<'PY'
          import json
          p='ops/readback/wq020-native-copy-fix-20260908.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          assert set(d['fixes'])=={'en','de','es','fr'},d
          assert 'arroyo' in d['pack']['es']['outputs']['pinterest_title']
          assert 'cuneta' not in d['pack']['es']['outputs']['pinterest_title']
          for l in ('en','de','fr'): assert '…' not in d['pack'][l]['outputs']['tiktok']
          print('WQ020 native copy normalization OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq020-native-copy-fix-20260908.json
          git commit -m 'Record WQ020 native copy fix readback'
          git push
