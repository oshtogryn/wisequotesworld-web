name: Sync hashtag rule to MASTER_RULES
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-hashtag-rule-master.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hashtag rule if missing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ops/MASTER_RULES.md')
          s=p.read_text(encoding='utf-8')
          rule='- **Hashtags:** максимум 5 хештегів у будь-якому social post/caption. Використовувати лише релевантні; кількість не є самоціллю. `#WiseQuotesWorld` зберігати, коли доречно.\n'
          marker='Platform link routing is mandatory:\n'
          if rule not in s:
              if marker not in s:
                  raise SystemExit('MASTER_RULES marker not found')
              s=s.replace(marker, rule+'\n'+marker, 1)
              s=s.replace('Останнє оновлення: 2026-08-31','Останнє оновлення: 2026-09-03',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit canonical rule update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/MASTER_RULES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Sync five-hashtag rule to MASTER_RULES'
          git push
