name: Newsletter scheduler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-scheduler-production
  cancel-in-progress: false

jobs:
  run:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Run due newsletter batch
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"

          body="$(mktemp)"
          code="$(curl --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
            -sS -o "$body" -w '%{http_code}' \
            -X POST 'https://wisequotesworld.com/api/admin/newsletter/run-scheduled' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json')"

          echo "HTTP $code"
          cat "$body"
          echo

          if [ "$code" != "200" ]; then
            echo "Newsletter scheduler endpoint returned HTTP $code" >&2
            exit 1
          fi
          if grep -Eq '"ok"[[:space:]]*:[[:space:]]*false' "$body"; then
            echo "Newsletter scheduler reported ok=false" >&2
            exit 1
          fi
