          schedule_js = r'''const PROJECT='wisequotesworld';
const DEFAULT_TIMEZONE='Europe/Stockholm';

function nowIso(){return new Date().toISOString()}
function parseIso(v){const d=new Date(String(v||''));return Number.isFinite(d.getTime())?d:null}

export async function ensureWebsiteSchedule(env){
  if(!env?.DB)throw new Error('DB unavailable');
  await env.DB.exec(`CREATE TABLE IF NOT EXISTS website_publication_schedule(
    content_item_id TEXT PRIMARY KEY,
    project_id TEXT NOT NULL,
    scheduled_for TEXT NOT NULL,
    timezone TEXT NOT NULL DEFAULT 'Europe/Stockholm',
    status TEXT NOT NULL DEFAULT 'scheduled' CHECK(status IN ('scheduled','released','cancelled')),
    created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,
    released_at TEXT,
    last_error TEXT
  );
  CREATE INDEX IF NOT EXISTS idx_website_publication_schedule_due
    ON website_publication_schedule(project_id,status,scheduled_for);`);
}

export async function getWebsiteSchedule(env,id){
  await ensureWebsiteSchedule(env);
  return await env.DB.prepare(`SELECT content_item_id,scheduled_for,timezone,status,created_at,updated_at,released_at,last_error FROM website_publication_schedule WHERE project_id=? AND content_item_id=?`).bind(PROJECT,id).first();
}

export async function scheduleWebsitePublication(env,id,scheduledFor,timezone=DEFAULT_TIMEZONE){
  await ensureWebsiteSchedule(env);
  const d=parseIso(scheduledFor);if(!d)throw new Error('invalid scheduled_for');
  if(d.getTime()<=Date.now()+15000)throw new Error('scheduled_for must be in the future');
  const ts=nowIso();
  await env.DB.prepare(`INSERT INTO website_publication_schedule(content_item_id,project_id,scheduled_for,timezone,status,created_at,updated_at,released_at,last_error)
    VALUES(?,?,?,?, 'scheduled',?,?,NULL,NULL)
    ON CONFLICT(content_item_id) DO UPDATE SET scheduled_for=excluded.scheduled_for,timezone=excluded.timezone,status='scheduled',updated_at=excluded.updated_at,released_at=NULL,last_error=NULL`).bind(id,PROJECT,d.toISOString(),String(timezone||DEFAULT_TIMEZONE),ts,ts).run();
  return getWebsiteSchedule(env,id);
}

export async function cancelWebsitePublication(env,id){
  await ensureWebsiteSchedule(env);const ts=nowIso();
  await env.DB.prepare(`UPDATE website_publication_schedule SET status='cancelled',updated_at=?,last_error=NULL WHERE project_id=? AND content_item_id=? AND status='scheduled'`).bind(ts,PROJECT,id).run();
  return getWebsiteSchedule(env,id);
}

export async function markWebsiteScheduleReleased(env,id,ts=nowIso()){
  await ensureWebsiteSchedule(env);
  await env.DB.prepare(`UPDATE website_publication_schedule SET status='released',updated_at=?,released_at=?,last_error=NULL WHERE project_id=? AND content_item_id=?`).bind(ts,ts,PROJECT,id).run();
}

async function approveVisibility(env,id,ts,note){
  const row=await env.DB.prepare(`SELECT id FROM content_approvals WHERE content_item_id=? AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).bind(id).first();
  if(row)await env.DB.prepare(`UPDATE content_approvals SET status='approved',approved_by='scheduler',notes=?,updated_at=? WHERE id=?`).bind(note,ts,row.id).run();
  else await env.DB.prepare(`INSERT INTO content_approvals(project_id,content_item_id,approval_scope,language_code,status,approved_by,notes,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?)`).bind(PROJECT,id,'website_visibility',null,'approved','scheduler',note,ts,ts).run();
}

export async function releaseDueWebsitePublications(env,limit=20){
  if(!env?.DB)return{released:[],blocked:[]};
  await ensureWebsiteSchedule(env);const ts=nowIso();
  const rows=(await env.DB.prepare(`SELECT content_item_id,scheduled_for,timezone FROM website_publication_schedule WHERE project_id=? AND status='scheduled' AND scheduled_for<=? ORDER BY scheduled_for LIMIT ?`).bind(PROJECT,ts,Math.max(1,Math.min(100,Number(limit)||20))).all()).results||[];
  const released=[],blocked=[];
  for(const row of rows){
    const id=row.content_item_id;
    const pages=await env.DB.prepare(`SELECT COUNT(*) n FROM quote_pages WHERE project_id=? AND content_item_id=? AND status='published'`).bind(PROJECT,id).first();
    if(Number(pages?.n||0)<13){
      const err=`website package incomplete: ${Number(pages?.n||0)}/13 published pages`;
      await env.DB.prepare(`UPDATE website_publication_schedule SET last_error=?,updated_at=? WHERE project_id=? AND content_item_id=?`).bind(err,ts,PROJECT,id).run();
      blocked.push({id,error:err});continue;
    }
    await approveVisibility(env,id,ts,`Editorial website visibility automatically released at scheduled time ${row.scheduled_for} (${row.timezone||DEFAULT_TIMEZONE}).`);
    await markWebsiteScheduleReleased(env,id,ts);released.push(id);
  }
  return{released,blocked,checked:rows.length,at:ts};
}
'''
          Path('lib/website_schedule.js').write_text(schedule_js, encoding='utf-8')

          visibility_js = r'''import {requireAdmin} from './admin_auth.js';
import {cancelWebsitePublication,ensureWebsiteSchedule,getWebsiteSchedule,markWebsiteScheduleReleased,releaseDueWebsitePublications,scheduleWebsitePublication} from './website_schedule.js';

const PROJECT='wisequotesworld';
function json(data,status=200){return new Response(JSON.stringify(data),{status,headers:{'content-type':'application/json; charset=utf-8','cache-control':'no-store'}})}
async function body(req){try{return await req.json()}catch{return null}}
async function state(env,id){
 await ensureWebsiteSchedule(env);
 const item=await env.DB.prepare(`SELECT id,sequence_no,status,canonical_title FROM content_items WHERE project_id=? AND id=?`).bind(PROJECT,id).first();
 if(!item)return null;
 const gate=await env.DB.prepare(`SELECT status,updated_at,notes FROM content_approvals WHERE content_item_id=? AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).bind(id).first();
 const legacy=Number(item.sequence_no||String(id).replace(/\D/g,''))<=15;
 const pages=await env.DB.prepare(`SELECT COUNT(*) n FROM quote_pages WHERE project_id=? AND content_item_id=? AND status='published'`).bind(PROJECT,id).first();
 const schedule=await getWebsiteSchedule(env,id);
 return{...item,visible:legacy||gate?.status==='approved',legacy_visible:legacy,website_visibility:gate||{status:'hidden',updated_at:null},published_pages:Number(pages?.n||0),schedule:schedule||null};
}
async function publish(env,id){
 const s=await state(env,id);if(!s)return json({ok:false,error:'topic not found'},404);
 if(s.published_pages<13)return json({ok:false,error:`website package incomplete: ${s.published_pages}/13 published pages`},409);
 if(s.visible&&!s.legacy_visible)return json({ok:true,id,visible:true,already_visible:true,website_visibility:s.website_visibility,schedule:s.schedule});
 const ts=new Date().toISOString(),note='Editorial website visibility approved from Admin. Direct article URLs may exist/index before this gate; navigation/latest becomes visible only after this action.';
 const row=await env.DB.prepare(`SELECT id FROM content_approvals WHERE content_item_id=? AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).bind(id).first();
 if(row)await env.DB.prepare(`UPDATE content_approvals SET status='approved',approved_by='admin',notes=?,updated_at=? WHERE id=?`).bind(note,ts,row.id).run();
 else await env.DB.prepare(`INSERT INTO content_approvals(project_id,content_item_id,approval_scope,language_code,status,approved_by,notes,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?)`).bind(PROJECT,id,'website_visibility',null,'approved','admin',note,ts,ts).run();
 if(s.schedule)await markWebsiteScheduleReleased(env,id,ts);
 return json({ok:true,id,visible:true,published_at:ts,state:await state(env,id)});
}
async function hide(env,id){
 const s=await state(env,id);if(!s)return json({ok:false,error:'topic not found'},404);if(s.legacy_visible)return json({ok:false,error:'legacy WQ001-WQ015 visibility is locked'},409);
 const ts=new Date().toISOString(),note='Editorial website visibility hidden from Admin.';
 const row=await env.DB.prepare(`SELECT id FROM content_approvals WHERE content_item_id=? AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).bind(id).first();
 if(row)await env.DB.prepare(`UPDATE content_approvals SET status='rejected',approved_by='admin',notes=?,updated_at=? WHERE id=?`).bind(note,ts,row.id).run();
 else await env.DB.prepare(`INSERT INTO content_approvals(project_id,content_item_id,approval_scope,language_code,status,approved_by,notes,created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?)`).bind(PROJECT,id,'website_visibility',null,'rejected','admin',note,ts,ts).run();
 await cancelWebsitePublication(env,id);
 return json({ok:true,id,visible:false,state:await state(env,id)});
}
async function schedule(env,id,request){
 const s=await state(env,id);if(!s)return json({ok:false,error:'topic not found'},404);
 if(s.legacy_visible||s.visible)return json({ok:false,error:'topic is already visible on website'},409);
 if(s.published_pages<13)return json({ok:false,error:`website package incomplete: ${s.published_pages}/13 published pages`},409);
 const b=await body(request);if(!b?.scheduled_for)return json({ok:false,error:'scheduled_for required'},400);
 try{const row=await scheduleWebsitePublication(env,id,b.scheduled_for,b.timezone||'Europe/Stockholm');return json({ok:true,id,scheduled:true,schedule:row,state:await state(env,id)})}catch(e){return json({ok:false,error:String(e.message||e)},400)}
}
export async function siteVisibilityApi(request,env){
 const url=new URL(request.url),m=url.pathname.match(/^\/api\/admin\/site-visibility\/([A-Za-z0-9_-]+)(?:\/(publish|hide|schedule|cancel-schedule))?$/);if(!m)return null;
 const denied=await requireAdmin(request,env);if(denied)return denied;if(!env?.DB)return json({ok:false,error:'DB unavailable'},503);
 await releaseDueWebsitePublications(env,20);
 const id=m[1],action=m[2];if(request.method==='GET'&&!action){const s=await state(env,id);return s?json({ok:true,state:s}):json({ok:false,error:'topic not found'},404)}
 if(request.method==='POST'&&action==='publish')return publish(env,id);
 if(request.method==='POST'&&action==='hide')return hide(env,id);
 if(request.method==='POST'&&action==='schedule')return schedule(env,id,request);
 if(request.method==='POST'&&action==='cancel-schedule'){await cancelWebsitePublication(env,id);return json({ok:true,id,state:await state(env,id)})}
 return json({ok:false,error:'method not allowed'},405);
}
'''
