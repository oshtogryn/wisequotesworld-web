<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes — Сайт</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f2ed}*{box-sizing:border-box}body{margin:0}.top{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc}button{cursor:pointer;background:#111;color:#fff}.secondary{background:#fff;color:#111}.status{padding:10px 12px;border-radius:10px;background:#f2f2f2}.ok{background:#e8f7ed}.bad{background:#fdeaea}.muted{color:#666}.langs{display:grid;gap:10px}.row{display:grid;grid-template-columns:70px 1fr 1fr 1fr auto;gap:10px;align-items:center;border:1px solid #e5e5e5;border-radius:14px;padding:12px}.pill{padding:6px 9px;border-radius:999px;background:#eee;text-align:center;font-size:13px}.pill.ok{background:#daf1df}.url{font-size:12px;word-break:break-all}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.row{grid-template-columns:55px 1fr}.row>*:nth-child(n+3){grid-column:2}.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><strong>Wise Quotes — Сайт</strong><a href="/admin/console/">← Operations</a></header><main class="wrap"><section class="card"><div class="grid"><label>Тема<br><select id="topic"></select></label><div class="actions"><button id="load">Оновити</button><button id="publishAll">Опублікувати 8 мов</button></div></div><div id="summary" class="status">Підключення…</div></section><section class="card"><h2>Website flow</h2><p class="muted">Окремо від Metricool. Для кожної мови: Ready → Published → URL verified.</p><div id="langs" class="langs"></div></section></main><script>const LANGS=['uk','ru','pl','en','sv','de','es','fr'];const token=()=>localStorage.getItem('wq_admin_token')||'';async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function latestVersions(vs){const m={};for(const v of(vs||[]))if(!m[v.language_code]||Number(v.version)>Number(m[v.language_code].version))m[v.language_code]=v;return m}async function topics(){if(!token()){summary.className='status bad';summary.textContent='ADMIN_TOKEN відсутній. Спочатку підключись у Operations.';return}const j=await api('/api/admin/content');topic.innerHTML=(j.items||[]).map(x=>`<option value="${x.id}">${x.id} — ${esc(x.canonical_title||'')}</option>`).join('');if(topic.options.length){const q=new URLSearchParams(location.search).get('id');if(q)[...topic.options].some(o=>o.value===q&&(topic.value=q));await loadTopic()}}async function loadTopic(){const id=topic.value;if(!id)return;summary.className='status';summary.textContent=id+': читаю D1…';const [c,p]=await Promise.all([api('/api/admin/content/'+id),api('/api/admin/production/'+id)]);const item=c.item,versions=latestVersions(item.versions),pages={};for(const x of(item.quote_pages||[]))pages[x.language_code]=x;const outs={};for(const o of(p.outputs||[]))outs[o.language_code+':'+o.output_key]=o.output_text||'';let published=0,verified=0,ready=0;langs.innerHTML=LANGS.map(l=>{const v=versions[l],page=pages[l],url=outs[l+':article_url']||((page&&page.canonical_path)?'https://wisequotesworld.com'+page.canonical_path:'');const isReady=!!v&&!!url;const isPublished=page?.status==='published';if(isReady)ready++;if(isPublished)published++;return `<div class="row" data-lang="${l}"><b>${l.toUpperCase()}</b><span class="pill ${isReady?'ok':''}">${isReady?'Ready':'Not ready'}</span><span class="pill ${isPublished?'ok':''}">${isPublished?'Published':'Not published'}</span><span><span class="pill verify">Not verified</span><div class="url">${esc(url||'URL missing')}</div></span><span class="actions"><button onclick="publishLang('${l}')" ${isReady?'':'disabled'}>Publish</button><button class="secondary" onclick="verifyLang('${l}')" ${isPublished&&url?'':'disabled'}>Verify URL</button></span></div>`}).join('');summary.className='status '+(ready===8?'ok':'bad');summary.textContent=`${id}: Ready ${ready}/8 · Published ${published}/8 · URL verified ${verified}/8`;window._state={id,item,versions,pages,outs}}async function publishLang(l){const s=window._state,id=s.id,page=s.pages[l],url=s.outs[l+':article_url']||'',slug=(page?.slug)||((url.match(/\/quotes\/([^/]+)\/?$/)||[])[1]);if(!slug)throw new Error(l.toUpperCase()+': slug missing');const reflection=s.outs[l+':website_reflection']||page?.reflection_body||'';const pinTitle=s.outs[l+':pinterest_title']||s.versions[l]?.adapted_text||'';const fb=s.outs[l+':facebook']||'';await api(`/api/admin/content/${id}/pages/${l}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({slug,status:'published',seo_title:page?.seo_title||pinTitle,meta_description:page?.meta_description||fb.slice(0,155),reflection_title:page?.reflection_title||null,reflection_body:reflection})});await loadTopic();await verifyLang(l)}async function verifyLang(l){const row=document.querySelector(`[data-lang="${l}"]`),pill=row?.querySelector('.verify'),s=window._state,page=s.pages[l],url=s.outs[l+':article_url']||((page?.canonical_path)?'https://wisequotesworld.com'+page.canonical_path:'');if(!url)return;try{const r=await fetch(url,{cache:'no-store'});const t=await r.text();const q=String(s.versions[l]?.adapted_text||'').trim();const ok=r.ok&&(!q||t.includes(q));pill.textContent=ok?'URL verified':'Readback failed';pill.className='pill verify '+(ok?'ok':'bad');pill.dataset.verified=ok?'1':'0'}catch(e){pill.textContent='Readback failed';pill.className='pill verify bad'}const total=[...document.querySelectorAll('.verify')].filter(x=>x.dataset.verified==='1').length;const pub=Object.values(window._state.pages||{}).filter(x=>x.status==='published').length;summary.textContent=`${s.id}: Ready 8/8 · Published ${pub}/8 · URL verified ${total}/8`}async function publishAll(){for(const l of LANGS)await publishLang(l)}load.onclick=loadTopic;topic.onchange=loadTopic;publishAll.onclick=()=>publishAll().catch(e=>{summary.className='status bad';summary.textContent=e.message});topics().catch(e=>{summary.className='status bad';summary.textContent=e.message});</script></body></html>
