name: WQ017 mark scheduled
on:
  push:
    paths:
      - '.github/workflows/wq017-mark-scheduled.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark scheduled in production
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN"
          mkdir -p ops/readback
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{"status":"scheduled","notes":"Metricool WQ017 readback confirmed 64/64 across uk,ru,pl,en,sv,de,es,fr on 2026-09-05"}' \
            https://wisequotesworld.com/api/admin/topics/WQ017/status \
            | tee ops/readback/wq017-scheduled-final.json
          grep -q '"status":"scheduled"' ops/readback/wq017-scheduled-final.json
      - name: Commit readback
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/readback/wq017-scheduled-final.json
          git diff --cached --quiet || git commit -m 'Record WQ017 scheduled status readback'
          git push
