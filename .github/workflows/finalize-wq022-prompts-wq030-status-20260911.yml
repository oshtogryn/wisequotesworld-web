name: Finalize WQ022 prompts and WQ030 readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-wq022-prompts-wq030-status-20260911.yml'
permissions:
  contents: write
concurrency:
  group: finalize-wq022-wq030-20260911
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install one-time focused correction route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route=r'''if(url.pathname==='/__internal_022fix_030ready_20260911_7ce4a2'){if(request.method==='GET')return json({ok:true,marker:'7ce4a2'});if(request.method==='POST'){const names={uk:'Ukrainian',ru:'Russian',pl:'Polish',en:'English',sv:'Swedish',de:'German',es:'Spanish',fr:'French'};const langs=Object.keys(names);const changed=[];for(const lang of langs){const v=await env.DB.prepare("SELECT id,adapted_text,version FROM content_versions WHERE content_id='WQ022' AND language_code=? ORDER BY version DESC LIMIT 1").bind(lang).first();if(!v?.id||!String(v.adapted_text||'').trim())return json({ok:false,error:'missing WQ022 localization',language:lang},500);const q=String(v.adapted_text).trim();const pr=`Create a premium photorealistic vertical 9:16 cinematic video in ${names[lang]}.\n\nA quiet late-1920s theoretical-physics study after dark. No historical person, portrait, face, human figure, bust, sculpture, painting, photograph, or likeness of the quoted author appears anywhere. An empty wooden chair stands beside a desk with closed notebooks and a warm lamp. Chalk equations reach the edge of a blackboard while an open window reveals a vast star field, making imagination the visual bridge beyond established knowledge. Slow restrained camera movement, premium cinematic realism, contemplative intellectual mood.\n\nShow the exact localized quote in one stable, large, elegant text card in the upper-middle safe area:\n${q}\n\nTypography: clean, large, elegant, mobile-readable; complete stable card; no word-by-word or letter-by-letter animation.\n\nAudio: a calm native ${names[lang]} narrator reads the exact quote and attribution naturally and completely, with correct native pronunciation of the author's name. Restrained cinematic music remains below the voice.\n\nNo subtitles. No captions. No emoji. No decorative symbols. No logo. No branding. No watermark. No other readable text.\n\nEnd on the open window and star field, then hold briefly.`;await env.DB.prepare("UPDATE content_versions SET ai_prompt=?,updated_at=? WHERE id=?").bind(pr,new Date().toISOString(),v.id).run();changed.push({language:lang,version:v.version,chars:pr.length});}const c30={};for(const [k,sql] of Object.entries({pages:"SELECT COUNT(*) c FROM quote_pages WHERE project_id='wisequotesworld' AND content_item_id='WQ030' AND status='published'",outputs:"SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id='WQ030' AND TRIM(COALESCE(output_text,''))<>''",qa:"SELECT COUNT(*) c FROM content_versions WHERE content_id='WQ030' AND language_check_status='native_qa_pass'",vp:"SELECT COUNT(*) c FROM content_versions WHERE content_id='WQ030' AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND TRIM(COALESCE(ai_prompt,''))<>''",pp:"SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id='WQ030' AND output_key='pinterest_prompt' AND TRIM(COALESCE(output_text,''))<>''"})){const r=await env.DB.prepare(sql).first();c30[k]=Number(r?.c||0);}const ready30=c30.pages===13&&c30.outputs>=88&&c30.qa>=13&&c30.vp===8&&c30.pp>=8;if(ready30){const ts=new Date().toISOString();await env.DB.prepare("UPDATE content_items SET status='media_pending',notes=?,updated_at=? WHERE project_id='wisequotesworld' AND id='WQ030'").bind('Complete pre-media package verified: 13 published website pages, native QA, social copy, Gemini prompts and Pinterest prompts ready. Awaiting user media upload.',ts).run();await env.DB.prepare("UPDATE content_versions SET status='media_pending',updated_at=? WHERE content_id='WQ030'").bind(ts).run();}const item21=await env.DB.prepare("SELECT id,status,updated_at FROM content_items WHERE project_id='wisequotesworld' AND id='WQ021'").first();const rows=[];for(const id of ['WQ022','WQ023','WQ024','WQ025','WQ026','WQ027','WQ028','WQ029','WQ030']){const item=await env.DB.prepare("SELECT id,status,quote_type,author_name,attribution_status,facts_verified FROM content_items WHERE project_id='wisequotesworld' AND id=?").bind(id).first();const pages=await env.DB.prepare("SELECT COUNT(*) c FROM quote_pages WHERE project_id='wisequotesworld' AND content_item_id=? AND status='published'").bind(id).first();const outs=await env.DB.prepare("SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id=? AND TRIM(COALESCE(output_text,''))<>''").bind(id).first();const qa=await env.DB.prepare("SELECT COUNT(*) c FROM content_versions WHERE content_id=? AND language_check_status='native_qa_pass'").bind(id).first();const vp=await env.DB.prepare("SELECT COUNT(*) c FROM content_versions WHERE content_id=? AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND TRIM(COALESCE(ai_prompt,''))<>''").bind(id).first();const pp=await env.DB.prepare("SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id=? AND output_key='pinterest_prompt' AND TRIM(COALESCE(output_text,''))<>''").bind(id).first();rows.push({...item,published_pages:Number(pages?.c||0),outputs:Number(outs?.c||0),native_qa:Number(qa?.c||0),video_prompts:Number(vp?.c||0),pinterest_prompts:Number(pp?.c||0)});}const prompts=(await env.DB.prepare("SELECT language_code,ai_prompt FROM content_versions WHERE content_id='WQ022' AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND version=(SELECT MAX(v2.version) FROM content_versions v2 WHERE v2.content_id='WQ022' AND v2.language_code=content_versions.language_code) ORDER BY language_code").all()).results||[];const safe=prompts.length===8&&prompts.every(x=>String(x.ai_prompt||'').includes('No historical person, portrait, face, human figure, bust, sculpture, painting, photograph, or likeness of the quoted author appears anywhere.')&&!String(x.ai_prompt||'').includes('Einstein in a quiet'));const ok=item21?.status==='published'&&safe&&rows.length===9&&rows.every(r=>r.status==='media_pending'&&r.published_pages===13&&r.outputs>=88&&r.native_qa>=13&&r.video_prompts===8&&r.pinterest_prompts>=8);return json({ok,wq021:item21,wq022_prompt_safe:safe,wq022_changed:changed,wq030_gate:c30,rows});}return json({ok:false,error:'method not allowed'},405);}'''
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose focused WQ022 WQ030 correction route'
          for i in $(seq 1 12); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 1
      - name: Wait for deployment and apply focused correction
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          URL='https://wisequotesworld-web.pages.dev/__internal_022fix_030ready_20260911_7ce4a2'
          for i in $(seq 1 72); do
            body="$(curl -sS --max-time 15 "$URL" || true)"
            if printf '%s' "$body" | grep -q '7ce4a2'; then break; fi
            sleep 10
          done
          curl -sS --fail-with-body --max-time 60 -X POST "$URL" -H 'Content-Type: application/json' -o ops/readback/wq022-prompts-wq030-final-20260911.json
          cat ops/readback/wq022-prompts-wq030-final-20260911.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq022-prompts-wq030-final-20260911.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('wq021',{}).get('status')=='published',d
          assert d.get('wq022_prompt_safe') is True,d
          assert len(d.get('wq022_changed') or [])==8,d
          rows=d.get('rows') or []
          assert len(rows)==9,rows
          for r in rows:
              assert r['status']=='media_pending',r
              assert r['published_pages']==13,r
              assert r['outputs']>=88,r
              assert r['native_qa']>=13,r
              assert r['video_prompts']==8,r
              assert r['pinterest_prompts']>=8,r
          print('PASS: WQ021 published; WQ022 Gemini prompts replaced 8/8; WQ022-WQ030 media_pending and complete.')
          PY
      - name: Remove one-time route and persist final readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          start="if(url.pathname==='/__internal_022fix_030ready_20260911_7ce4a2'){"
          pos=s.find(anchor+start)
          if pos>=0:
              begin=pos+len(anchor)
              end=s.find('if(env.DB)',begin)
              if end>begin:s=s[:begin]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-wq022-prompts-wq030-status-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js .github/workflows/finalize-wq022-prompts-wq030-status-20260911.yml || true
          if [ -f ops/readback/wq022-prompts-wq030-final-20260911.json ]; then git add ops/readback/wq022-prompts-wq030-final-20260911.json; fi
          git commit -m 'Persist final WQ022-WQ030 readback and remove focused correction route' || true
          for i in $(seq 1 12); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 0
