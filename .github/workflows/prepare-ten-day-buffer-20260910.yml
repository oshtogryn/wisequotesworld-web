name: Prepare WQ022-WQ031 ten-day buffer 2026-09-10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-ten-day-buffer-20260910.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate prepared module and expose authenticated one-time route
        env:
          ROUTE: /internal/wq-buffer-022-031-6f8d4c2a
        run: |
          set -euo pipefail
          node --check lib/prepared_buffer_022_031.js
          python - <<'PY'
          from pathlib import Path
          w=Path('_worker.js')
          s=w.read_text(encoding='utf-8')
          imp="import {prepareOne018026,readBatch018026} from './lib/prepared_batch_018_026.js';"
          add=imp+"\nimport {prepareBuffer022031} from './lib/prepared_buffer_022_031.js';"
          if "prepareBuffer022031" not in s:
              assert imp in s
              s=s.replace(imp,add,1)
          anchor="const newsletterResponse=await newsletterApi(request,env);if(newsletterResponse)return newsletterResponse;"
          route="if(url.pathname==='/internal/wq-buffer-022-031-6f8d4c2a'&&request.method==='POST'){const denied=await requireAdmin(request,env);if(denied)return denied;return json(await prepareBuffer022031(env));}"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          w.write_text(s,encoding='utf-8')

          p=Path('admin/console/app.js')
          a=p.read_text(encoding='utf-8')
          old="const OUTS=['article_url','pinterest_prompt','facebook','instagram','threads','tiktok','youtube_title','youtube_description','pinterest_title','pinterest_description','website_reflection'];"
          new="const OUTS=['article_url','pinterest_prompt','facebook','instagram','threads','tiktok','youtube_title','youtube_description','pinterest_title','pinterest_description','pinterest_video_title','pinterest_video_description','website_reflection'];"
          if old in a:a=a.replace(old,new,1)
          oldl="pinterest_description:'Pinterest description',website_reflection:'Website reflection'"
          newl="pinterest_description:'Pinterest image description',pinterest_video_title:'Pinterest video title',pinterest_video_description:'Pinterest video description',website_reflection:'Website reflection'"
          if oldl in a:a=a.replace(oldl,newl,1)
          p.write_text(a,encoding='utf-8')
          PY
          node --check _worker.js
          node --check admin/console/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js admin/console/app.js
          git commit -m 'Expose authenticated ten-day buffer migration and show Pinterest video copy'
          git push
      - name: Wait for production branch deployment
        run: sleep 85
      - name: Apply prepared content to canonical D1 and verify readback
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || { echo 'ADMIN_TOKEN secret missing'; exit 1; }
          mkdir -p ops/readback
          curl -sS -L --fail-with-body --retry 12 --retry-all-errors --retry-delay 6 \
            -X POST 'https://wisequotesworld-web.pages.dev/internal/wq-buffer-022-031-6f8d4c2a' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            -o ops/readback/prepared-buffer-022-031-20260910.json
          cat ops/readback/prepared-buffer-022-031-20260910.json
          python - <<'PY'
          import json
          p='ops/readback/prepared-buffer-022-031-20260910.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          rb=d.get('readback') or {}
          assert rb.get('ok') is True,rb
          rows=rb.get('rows') or []
          assert len(rows)==10,rows
          for r in rows:
              assert r.get('published_pages')==13,r
              assert r.get('native_qa',0)>=13,r
              assert r.get('video_prompts')==8,r
              assert r.get('pinterest_prompts')==8,r
              assert r.get('outputs',0)>=88,r
              assert r.get('ready_for_user_media') is True,r
          print('PASS: WQ022-WQ031 are canonical D1 pre-media-ready; 13 website pages/topic and 8 social prompts/topic verified.')
          PY
      - name: Remove migration route, persist readback, remove one-off workflow
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase || true
          python - <<'PY'
          from pathlib import Path
          w=Path('_worker.js')
          s=w.read_text(encoding='utf-8')
          s=s.replace("\nimport {prepareBuffer022031} from './lib/prepared_buffer_022_031.js';",'')
          s=s.replace("if(url.pathname==='/internal/wq-buffer-022-031-6f8d4c2a'&&request.method==='POST'){const denied=await requireAdmin(request,env);if(denied)return denied;return json(await prepareBuffer022031(env));}",'')
          w.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/prepare-ten-day-buffer-20260910.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js admin/console/app.js ops/readback/prepared-buffer-022-031-20260910.json .github/workflows/prepare-ten-day-buffer-20260910.yml || true
          git commit -m 'Finalize WQ022-WQ031 prepared buffer readback and remove one-off migration route' || true
          git push || true
