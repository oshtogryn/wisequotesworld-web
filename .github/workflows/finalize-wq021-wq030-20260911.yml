name: Finalize WQ021 WQ022 and verify WQ022-WQ030
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-wq021-wq030-20260911.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent WQ022 concept and expose one-time deterministic route first in router
        run: |
          set -euo pipefail
          node --check lib/wq021_030_final_fix_20260911.js
          python - <<'PY'
          from pathlib import Path
          safe="A quiet late-1920s theoretical-physics study after dark. No historical person, portrait, face, human figure, bust, sculpture, painting, photograph, or likeness of the quoted author appears anywhere. An empty wooden chair stands beside a desk with closed notebooks and a lamp. Chalk equations reach the edge of a blackboard while an open window reveals a vast star field, making imagination the visual bridge beyond established knowledge."
          old="A quiet late-1920s study with no living historical person on screen. A small static bronze museum bust of an early-20th-century theoretical physicist with unruly hair sits on a bookshelf in partial shadow and remains an inanimate sculpture throughout. Chalk equations reach the edge of a blackboard while an open window reveals a vast star field, making imagination the visual bridge beyond established knowledge."
          for fn in ['lib/prepared_batch_018_026.js','lib/prepared_buffer_022_031.js']:
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if old in s:s=s.replace(old,safe,1)
              p.write_text(s,encoding='utf-8')

          w=Path('_worker.js'); s=w.read_text(encoding='utf-8')
          imp="import {adminTopicsApi} from './lib/admin_topics_api.js';"
          add=imp+"\nimport {applyWQ021030FinalFix} from './lib/wq021_030_final_fix_20260911.js';"
          if 'applyWQ021030FinalFix' not in s:
              assert imp in s
              s=s.replace(imp,add,1)
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__wq021030_final_7f31a9c2'&&request.method==='POST')return json(await applyWQ021030FinalFix(env));"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          w.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          node --check lib/prepared_batch_018_026.js
          node --check lib/prepared_buffer_022_031.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js lib/prepared_batch_018_026.js lib/prepared_buffer_022_031.js
          git commit -m 'Use no-likeness WQ022 concept and expose one-time finalizer'
          git push
      - name: Wait for Pages deployment
        run: sleep 80
      - name: Apply canonical D1 correction and assert readback
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -sS -L --fail-with-body --retry 10 --retry-all-errors --retry-delay 5 \
            -X POST 'https://wisequotesworld-web.pages.dev/__wq021030_final_7f31a9c2' \
            -H 'Content-Type: application/json' \
            -o ops/readback/wq021-030-final-20260911.json
          cat ops/readback/wq021-030-final-20260911.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq021-030-final-20260911.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert (d.get('wq021') or {}).get('after',{}).get('status')=='published',d
          p=(d.get('verification') or {}).get('wq022_prompts') or {}
          assert p.get('ok') is True and p.get('count')==8,p
          rows=(d.get('verification') or {}).get('rows') or []
          assert len(rows)==9,rows
          for r in rows:
              assert r.get('published_pages')==13,r
              assert r.get('native_qa',0)>=13,r
              assert r.get('video_prompts')==8,r
              assert r.get('pinterest_prompts')==8,r
              assert r.get('outputs',0)>=88,r
              assert r.get('ready_for_user_media') is True,r
          print('PASS: canonical D1 verified for WQ021 and WQ022-WQ030')
          PY
      - name: Remove one-time route and helper, persist readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase || true
          python - <<'PY'
          from pathlib import Path
          w=Path('_worker.js'); s=w.read_text(encoding='utf-8')
          s=s.replace("\nimport {applyWQ021030FinalFix} from './lib/wq021_030_final_fix_20260911.js';",'')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__wq021030_final_7f31a9c2'&&request.method==='POST')return json(await applyWQ021030FinalFix(env));"
          s=s.replace(anchor+route,anchor)
          w.write_text(s,encoding='utf-8')
          PY
          rm -f lib/wq021_030_final_fix_20260911.js
          rm -f .github/workflows/finalize-wq021-wq030-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js lib/wq021_030_final_fix_20260911.js .github/workflows/finalize-wq021-wq030-20260911.yml || true
          if [ -f ops/readback/wq021-030-final-20260911.json ]; then git add ops/readback/wq021-030-final-20260911.json; fi
          git commit -m 'Persist final WQ021-WQ030 readback and remove one-time finalizer' || true
          git push || true
