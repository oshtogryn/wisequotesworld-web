name: Harden active media upload once 2026-09-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-upload-hardening-once-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-upload-hardening-once-20260916
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden mediaUpload in legacy worker
        shell: bash
        env:
          MEDIA_UPLOAD_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          p=Path('_worker_legacy.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function mediaUpload(request,env){')
          end=s.index('\nasync function generatePinterest(',start)
          new=base64.b64decode(os.environ['MEDIA_UPLOAD_B64']).decode('utf-8')
          old=s[start:end]
          if old==new:
              print('Already hardened')
          else:
              p.write_text(s[:start]+new+s[end:],encoding='utf-8')
              print('mediaUpload hardened')
          PY
          node --check _worker_legacy.js
      - name: Commit patch safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker_legacy.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'media: validate active upload types and sizes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
