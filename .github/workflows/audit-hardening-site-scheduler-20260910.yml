          addition='''### Scheduled website visibility — HARD\n- Prepared quote pages may be technically published/indexable while editorial navigation visibility remains hidden.\n- Admin may either publish website visibility immediately or schedule an exact future activation time.\n- Scheduled website visibility is stored in D1 `website_publication_schedule`; D1 remains canonical.\n- A schedule is allowed only when all 13 quote pages are already published/prepared.\n- At/after the due instant, the first production request atomically releases the `website_visibility` approval before rendering, so Latest/archive/category/author navigation sees the topic immediately on that request.\n- Website scheduling never schedules social posts and never sets social `scheduled`/`published`.\n- Cancelling a website schedule leaves the direct article URLs/indexability unchanged and keeps editorial navigation hidden.\n\n'''
          if '### Scheduled website visibility — HARD' not in s:
              assert marker in s
