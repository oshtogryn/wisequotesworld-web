name: WQ014 normalize copy and rule
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'lib/wq014_site_publish.js'
      - 'lib/canonical_rules.js'
      - '.github/workflows/wq014-normalize.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        run: sleep 25
      - name: Normalize WQ014 and verify rule
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 8 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/normalize/wq014' -o ops/readback/WQ014-normalization.json
          cat ops/readback/WQ014-normalization.json
          curl -L -sS --retry 8 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/ops/readback/wq014-production.json' -o ops/readback/WQ014-production-d1.json
          python - <<'PY'
          import json
          n=json.load(open('ops/readback/WQ014-normalization.json',encoding='utf-8'))
          assert n.get('ok') is True, n
          assert n.get('max_hashtags')==5, n
          assert not n.get('violations'), n
          d=json.load(open('ops/readback/WQ014-production-d1.json',encoding='utf-8'))
          r=d.get('rules',{})
          assert r.get('expected')==15 and r.get('present')==15, r
          assert not r.get('missing'), r
          keys=[x.get('rule_key') for x in r.get('rules',[])]
          assert 'social_hashtag_limit' in keys, keys
          PY
      - name: Commit normalization readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/WQ014-normalization.json ops/readback/WQ014-production-d1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record WQ014 hashtag normalization and rule readback'
          git push
