name: Future preprod
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/future-preprod.yml'
      - 'lib/future_preprod.js'
      - 'lib/future_topics_v1.js'
      - 'lib/wq017_social_payload.js'
      - 'lib/wq017_premedia_apply.js'
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force production Worker deployment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          for old in ['// deploy-marker: future-preprod-provenance-v3','// deploy-marker: future-preprod-provenance-v4']:
              if old in s:
                  s=s.replace(old,'// deploy-marker: future-preprod-wq017-premedia-v1',1)
                  break
          else:
              s='// deploy-marker: future-preprod-wq017-premedia-v1\n'+s
          p.write_text(s)
          PY
          git add _worker.js
          if git diff --cached --quiet; then
            echo 'Worker marker already current'
          else
            git commit -m 'Deploy WQ017 complete pre-media package'
            git push
          fi
      - name: Wait for production deployment
        run: sleep 75
      - name: Prepare and verify D1 preproduction
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -L -sS --retry 2 --retry-all-errors --retry-delay 3 -X POST 'https://wisequotesworld.com/ops/run/future-preprod' -o ops/readback/future-preprod.json -w '%{http_code}' || true)
            echo "Attempt $i HTTP $code"
            cat ops/readback/future-preprod.json || true
            echo
            if [ "$code" = "200" ]; then
              if python - <<'PY'
          import json,sys
          d=json.load(open('ops/readback/future-preprod.json'))
          w=d.get('wq017',{})
          langs=w.get('languages',[])
          ok=(d.get('ok') is True and d.get('stage')=='done' and w.get('ready_for_user_media') is True and w.get('pages_count')==13 and w.get('published_pages')==13 and len(langs)==8 and all(x.get('ready_for_media') is True and x.get('output_count')==11 and x.get('native_qa') is True and x.get('video_prompt') is True for x in langs))
          sys.exit(0 if ok else 1)
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/future-preprod.json'))
          w=d['wq017']
          assert w['item']['status']=='media_pending', w
          assert w['item']['attribution_status']=='verified', w
          assert w['pages_count']==13 and w['published_pages']==13, w
          assert w['outputs_count']>=88, w
          assert len(w['languages'])==8, w
          assert all(x['ready_for_media'] and x['article_published'] and x['output_count']==11 for x in w['languages']), w
          assert d['backlog']['count']==50, d['backlog']
          print('WQ017 COMPLETE PRE-MEDIA: 13/13 live articles; 8/8 prompts+copy+URLs native-QA ready; awaiting user media only')
          PY
      - name: Save verified readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/future-preprod.json
          if git diff --cached --quiet; then
            echo 'Readback unchanged'
          else
            git commit -m 'Save verified WQ017 complete pre-media readback'
            git push
          fi
