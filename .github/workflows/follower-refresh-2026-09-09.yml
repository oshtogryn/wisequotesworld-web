name: One-shot follower refresh 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follower-refresh-2026-09-09.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Run follower refresh 2026-09-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch follower sources and start totals
        shell: python
        run: |
          from pathlib import Path

          old = "uk:{facebook:10,instagram:938,threads:43,tiktok:58,youtube:40},ru:{facebook:8,instagram:44,threads:13,tiktok:93,youtube:104},pl:{facebook:17,instagram:17,threads:6,tiktok:40,youtube:38},en:{facebook:17,instagram:18,threads:10,tiktok:36,youtube:34},sv:{facebook:4,instagram:9,threads:6,tiktok:11,youtube:4},de:{facebook:19,instagram:106,threads:4,tiktok:74,youtube:25},es:{facebook:39,instagram:197,threads:2,tiktok:16,youtube:108},fr:{facebook:2,instagram:0,threads:0,tiktok:9,youtube:32}"
          new = "uk:{facebook:10,instagram:938,threads:43,tiktok:58,youtube:40},ru:{facebook:8,instagram:44,threads:13,tiktok:95,youtube:104},pl:{facebook:17,instagram:17,threads:6,tiktok:42,youtube:38},en:{facebook:17,instagram:18,threads:10,tiktok:39,youtube:34},sv:{facebook:4,instagram:9,threads:6,tiktok:11,youtube:4},de:{facebook:19,instagram:106,threads:4,tiktok:75,youtube:25},es:{facebook:39,instagram:197,threads:2,tiktok:16,youtube:108},fr:{facebook:3,instagram:1,threads:0,tiktok:10,youtube:41}"

          for f in ['start/localized.js','lib/start_unified.js']:
              p=Path(f); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected follower object not found in {f}')
              p.write_text(s.replace(old,new,1))

          p=Path('start/index.html'); s=p.read_text()
          repl={
            'data-total="ru">262<':'data-total="ru">264<',
            'data-total="pl">118<':'data-total="pl">120<',
            'data-total="en">115<':'data-total="en">118<',
            'data-total="de">228<':'data-total="de">229<',
            'data-total="fr">43<':'data-total="fr">55<',
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit(f'missing start total token: {a}')
              s=s.replace(a,b,1)
          p.write_text(s)

          for lang in ['uk','ru','pl','en','sv','de','es','fr']:
              p=Path(lang)/'start'/'index.html'; s=p.read_text()
              if 'localized.js?v=20260909-0306' not in s:
                  raise SystemExit(f'expected cache version missing in {p}')
              p.write_text(s.replace('localized.js?v=20260909-0306','localized.js?v=20260909-2245',1))
      - name: Commit refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add start/localized.js lib/start_unified.js start/index.html uk/start/index.html ru/start/index.html pl/start/index.html en/start/index.html sv/start/index.html de/start/index.html es/start/index.html fr/start/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh follower counts from Metricool 2026-09-09'
          git push
