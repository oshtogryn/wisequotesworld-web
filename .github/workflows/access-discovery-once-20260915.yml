name: Access discovery once 2026-09-15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/access-discovery-once-20260915.yml'
permissions:
  contents: read
jobs:
  discover:
    environment: production
    runs-on: ubuntu-latest
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Discover Access audience from service-auth response
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          h=$(mktemp); b=$(mktemp)
          code=$(curl -sS --connect-timeout 10 --max-time 30 -D "$h" -o "$b" -w '%{http_code}' \
            'https://wisequotesworld.com/api/admin/health' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Accept: application/json')
          echo "health HTTP=$code"
          test "$code" = '200'
          python3 - "$h" <<'PY'
          import sys,re,json,base64
          text=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'(?im)^set-cookie:\s*CF_Authorization=([^;\r\n]+)',text)
          if not m:
              print('NO_CF_AUTHORIZATION_COOKIE')
              raise SystemExit(2)
          token=m.group(1)
          parts=token.split('.')
          if len(parts)!=3: raise SystemExit('invalid JWT cookie')
          raw=parts[1]+'='*((4-len(parts[1])%4)%4)
          d=json.loads(base64.urlsafe_b64decode(raw).decode())
          print('ACCESS_ISSUER='+str(d.get('iss') or ''))
          print('ACCESS_AUD='+str(d.get('aud') or ''))
          print('ACCESS_TYPE='+str(d.get('type') or ''))
          if not d.get('aud'): raise SystemExit('aud missing')
          PY
