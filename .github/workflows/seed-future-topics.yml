name: Seed future topics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-future-topics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy
        run: sleep 35
      - name: Seed and verify WQ016-WQ065
        run: |
          set -euo pipefail
          curl -L -sS --fail --retry 12 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/run/wq015-finalize' -o /tmp/seed.json
          cat /tmp/seed.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/seed.json'))
          b=d.get('backlog') or {}
          rb=b.get('readback') or {}
          assert d.get('ok') is True, d
          assert b.get('total')==50, b
          assert rb.get('count')==50, rb
          assert rb.get('idea_count')==50, rb
          ids=[r.get('id') for r in rb.get('rows',[])]
          assert ids==[f'WQ{i:03d}' for i in range(16,66)], ids
          print('Backlog WQ016-WQ065 verified: 50/50 status=idea')
          PY
