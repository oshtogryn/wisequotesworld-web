name: dynamic-start-sequence-patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch latest lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/start_unified.js')
          s=p.read_text()
          old="const r=await env.DB.prepare(`SELECT canonical_path FROM quote_pages WHERE project_id=? AND language_code=? AND status='published' ORDER BY COALESCE(published_at,updated_at) DESC, COALESCE(updated_at,published_at) DESC LIMIT 1`).bind(PROJECT_ID,l).first();"
          new="const r=await env.DB.prepare(`SELECT qp.slug FROM quote_pages qp JOIN content_items ci ON ci.id=qp.content_item_id WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' ORDER BY COALESCE(ci.sequence_no,CAST(SUBSTR(ci.id,3) AS INTEGER),0) DESC, COALESCE(qp.published_at,qp.updated_at) DESC, qp.updated_at DESC LIMIT 1`).bind(PROJECT_ID,l).first();"
          oldret="return r?.canonical_path||LATEST[l]||`/${l}/`;"
          newret="return r?.slug?`/${l}/quotes/${encodeURIComponent(r.slug)}/`:(LATEST[l]||`/${l}/`);"
          if old in s:
              s=s.replace(old,new,1)
              s=s.replace(oldret,newret,1)
          elif new not in s:
              raise SystemExit('expected latest lookup not found')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q "SELECT qp.slug FROM quote_pages qp JOIN content_items ci" lib/start_unified.js
          grep -q 'href="${latest}"' lib/start_unified.js
          grep -q "startUnified(request,env)" _worker.js
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/start_unified.js
          git commit -m "Use content sequence for latest start article [dynamic-start]"
          git push
