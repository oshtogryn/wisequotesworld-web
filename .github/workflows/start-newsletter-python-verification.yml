name: Verify start pages and newsletter with Python
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-newsletter-python-verification.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 13 live start pages and newsletter API
        run: |
          python - <<'PY'
          import json,time,urllib.request
          langs=['uk','ru','pl','en','sv','de','es','fr','it','pt','id','tr','ar']
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'WQW-production-QA/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','replace')
          for lang in langs:
              url=f'https://wisequotesworld.com/{lang}/start/'
              last=''
              for n in range(12):
                  try:
                      last=get(url)
                      checks={
                        'newsletter-form':'newsletter-form' in last,
                        'mailto':'mailto:wisequotesofworld@gmail.com' in last,
                        'old-contact-form':'contact-name' not in last,
                      }
                      if all(checks.values()):
                          print(lang,'PASS',checks)
                          break
                      print(lang,'WAIT',checks)
                  except Exception as e:
                      print(lang,'RETRY',repr(e))
                  time.sleep(5)
              else:
                  raise AssertionError(f'{lang} failed: newsletter={"newsletter-form" in last}, mailto={"mailto:wisequotesofworld@gmail.com" in last}, old_form={"contact-name" in last}')
          payload=json.dumps({'email':'qa-newsletter@example.invalid','language':'en','company':'qa-bot'}).encode()
          req=urllib.request.Request('https://wisequotesworld.com/api/newsletter/subscribe',data=payload,headers={'Content-Type':'application/json','User-Agent':'WQW-production-QA/1.0'},method='POST')
          for n in range(12):
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  print('newsletter API',data)
                  assert data.get('ok') is True
                  break
              except Exception as e:
                  print('newsletter API retry',repr(e))
                  time.sleep(5)
          else:
              raise AssertionError('newsletter API did not return ok=true')
          PY
      - name: Record verified production state
        run: |
          mkdir -p ops/readback
          cat > ops/readback/start-newsletter-verification.json <<'JSON'
          {"ok":true,"start_pages":13,"contact_style":"compact_mailto","newsletter_signup":"D1_locale_aware","unsubscribe":"implemented","email_delivery":"provider_pending","verified_at":"2026-09-04"}
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/start-newsletter-verification.json
          git diff --cached --quiet || git commit -m 'Record verified 13-locale start and newsletter state'
          git push
