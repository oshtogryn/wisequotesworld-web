name: Publish IT and PT-BR website expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-it-pt-website.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate new locale modules
        run: |
          node --check lib/new_locales_publish.js
          node --check lib/new_locales_site.js
      - name: Enable ten-language routing and temporary publisher
        run: |
          git pull --rebase
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/site_v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const LOCALES=['uk','ru','pl','en','sv','de','es','fr'];","const LOCALES=['uk','ru','pl','en','sv','de','es','fr','it','pt'];",1)
          s=s.replace("const NAMES={uk:'Українська',ru:'Русский',pl:'Polski',en:'English',sv:'Svenska',de:'Deutsch',es:'Español',fr:'Français'};","const NAMES={uk:'Українська',ru:'Русский',pl:'Polski',en:'English',sv:'Svenska',de:'Deutsch',es:'Español',fr:'Français',it:'Italiano',pt:'Português (Brasil)'};",1)
          s=s.replace("const FLAGS={uk:'🇺🇦',ru:'🌐',pl:'🇵🇱',en:'🇬🇧',sv:'🇸🇪',de:'🇩🇪',es:'🇪🇸',fr:'🇫🇷'};","const FLAGS={uk:'🇺🇦',ru:'🌐',pl:'🇵🇱',en:'🇬🇧',sv:'🇸🇪',de:'🇩🇪',es:'🇪🇸',fr:'🇫🇷',it:'🇮🇹',pt:'🇧🇷'};",1)
          s=s.replace('Timeless words · eight languages','Timeless words · ten languages')
          p.write_text(s,encoding='utf-8')

          p=Path('lib/quote_detail_v3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const LOCALES=['uk','ru','pl','en','sv','de','es','fr'];","const LOCALES=['uk','ru','pl','en','sv','de','es','fr','it','pt'];",1)
          s=s.replace("const FLAGS={uk:'🇺🇦',ru:'🌐',pl:'🇵🇱',en:'🇬🇧',sv:'🇸🇪',de:'🇩🇪',es:'🇪🇸',fr:'🇫🇷'};","const FLAGS={uk:'🇺🇦',ru:'🌐',pl:'🇵🇱',en:'🇬🇧',sv:'🇸🇪',de:'🇩🇪',es:'🇪🇸',fr:'🇫🇷',it:'🇮🇹',pt:'🇧🇷'};",1)
          s=s.replace("const NAMES={uk:'Українська',ru:'Русский',pl:'Polski',en:'English',sv:'Svenska',de:'Deutsch',es:'Español',fr:'Français'};","const NAMES={uk:'Українська',ru:'Русский',pl:'Polski',en:'English',sv:'Svenska',de:'Deutsch',es:'Español',fr:'Français',it:'Italiano',pt:'Português (Brasil)'};",1)
          s=s.replace('Timeless words · eight languages','Timeless words · ten languages')
          p.write_text(s,encoding='utf-8')

          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          permanent="import {newLocalesSite} from './lib/new_locales_site.js';\n"
          temp="import {publishNewLocales} from './lib/new_locales_publish.js';\n"
          anchor="import {siteV2} from './lib/site_v2.js';\n"
          if permanent not in s:s=s.replace(anchor,anchor+permanent,1)
          if temp not in s:s=s.replace(permanent,permanent+temp,1)
          s=s.replace("(uk|ru|pl|en|sv|de|es|fr)(?:\\/|$)","(uk|ru|pl|en|sv|de|es|fr|it|pt)(?:\\/|$)",1)
          route="if(url.pathname==='/ops/publish/new-locales'&&request.method==='POST')return json(await publishNewLocales(env));"
          route_anchor="if(url.pathname==='/ops/run/wq015-finalize'&&request.method==='POST')"
          if route not in s:s=s.replace(route_anchor,route+route_anchor,1)
          handler="const newLocaleResponse=await newLocalesSite(request,env);if(newLocaleResponse)return withLocaleTracking(newLocaleResponse,url);"
          handler_anchor="const detailResponse=await quoteDetailV3(request,env);"
          if handler not in s:s=s.replace(handler_anchor,handler+handler_anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          node --check lib/site_v2.js
          node --check lib/quote_detail_v3.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js lib/site_v2.js lib/quote_detail_v3.js
          git commit -m 'Enable Italian and Brazilian Portuguese website routing'
          git push
      - name: Publish D1 localizations and verify live pages
        run: |
          sleep 35
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 12 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/publish/new-locales' -o ops/readback/new-locales-publication.json
          cat ops/readback/new-locales-publication.json
          python - <<'PY'
          import json, subprocess
          d=json.load(open('ops/readback/new-locales-publication.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('published')==14,d
          counts={x['language']:x['count'] for x in d.get('counts',[])}
          assert counts.get('it')==7,counts
          assert counts.get('pt')==7,counts
          urls=['https://wisequotesworld.com/it/','https://wisequotesworld.com/pt/','https://wisequotesworld.com/it/quotes/','https://wisequotesworld.com/pt/quotes/','https://wisequotesworld.com/it/start/','https://wisequotesworld.com/pt/start/']
          urls += ['https://wisequotesworld.com'+x['canonical_path'] for x in d['results']]
          for url in urls:
            code=subprocess.check_output(['curl','-L','-sS','--retry','8','--retry-all-errors','--retry-delay','3','-o','/dev/null','-w','%{http_code}',url],text=True).strip()
            assert code=='200',(url,code)
          sm=subprocess.check_output(['curl','-L','-sS','https://wisequotesworld.com/sitemap.xml'],text=True)
          assert 'https://wisequotesworld.com/it/' in sm
          assert 'https://wisequotesworld.com/pt/' in sm
          for x in d['results']:
            assert 'https://wisequotesworld.com'+x['canonical_path'] in sm,x
          print('IT 7/7 + PT-BR 7/7 live and present in sitemap')
          PY
      - name: Remove temporary publishing endpoint and save readback
        run: |
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {publishNewLocales} from './lib/new_locales_publish.js';\n",'',1)
          s=s.replace("if(url.pathname==='/ops/publish/new-locales'&&request.method==='POST')return json(await publishNewLocales(env));",'',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js ops/readback/new-locales-publication.json
          git commit -m 'Record IT and PT-BR publication and clean temporary endpoint'
          git push
