name: Future preprod
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/future-preprod.yml'
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force production Worker deployment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          old='// deploy-marker: future-preprod-provenance-v2'
          new='// deploy-marker: future-preprod-provenance-v3'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: s=new+'\n'+s
          p.write_text(s)
          PY
          git add _worker.js
          git commit -m 'Deploy future preprod provenance fix'
          git push
      - name: Wait for production deployment
        run: sleep 65
      - name: Prepare and verify D1 preproduction
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          code=$(curl -L -sS --retry 8 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/run/future-preprod' -o ops/readback/future-preprod.json -w '%{http_code}')
          echo "HTTP $code"
          cat ops/readback/future-preprod.json
          echo
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/future-preprod.json'))
          assert d.get('ok') is True, d
          assert d.get('stage')=='done', d
          assert d.get('localizations')==13, d
          assert d['wq016']['status']=='localized', d
          assert d['wq016']['attribution_status']=='verified', d
          assert d['wq016']['facts_verified']==1, d
          assert len(d.get('next',[]))==9, d
          print('WQ016 localized 13/13; WQ017-WQ025 preproduction candidates stored')
          PY
      - name: Save verified readback
        run: |
          git add ops/readback/future-preprod.json
          git commit -m 'Save verified future preproduction readback'
          git push
