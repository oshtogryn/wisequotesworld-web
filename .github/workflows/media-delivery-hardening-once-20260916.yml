name: Harden media delivery once 2026-09-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-delivery-hardening-once-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-delivery-hardening-once-20260916
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PATCH_B64: "
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch media delivery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function serveObject(request,env,key,kind,ext,mime){')
          end=s.index('\nfunction scheduleIndexNow(',start)
          replacement=base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          PY
          node --check _worker.js
          grep -q "normalized_mp4_required" _worker.js
          grep -q "normalized_mp4_not_available" _worker.js
      - name: Commit patch safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'media: require real normalized MP4 for mp4 delivery route'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
