name: Start pages live readback

on:
  push:
    branches: [main]
    paths:
      - 'start/**'
      - 'uk/start/**'
      - 'ru/start/**'
      - 'pl/start/**'
      - 'en/start/**'
      - 'sv/start/**'
      - 'de/start/**'
      - 'es/start/**'
      - 'fr/start/**'
      - '.github/workflows/start-pages-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production propagation
        run: sleep 40
      - name: Verify DNS and start pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          report=ops/readback/start-pages-live.txt
          : > "$report"

          echo 'DNS wisequotesworld.com:' | tee -a "$report"
          if ! getent ahostsv4 wisequotesworld.com | awk '{print $1}' | sort -u | tee -a "$report" | grep -qE '^[0-9]+\.'; then
            echo 'FAIL dns=unresolved wisequotesworld.com' | tee -a "$report"
            exit 1
          fi

          check(){
            url="$1"; shift
            out=$(mktemp)
            code=$(curl -L -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 30 --retry 8 --retry-all-errors --retry-delay 5 "$url" || true)
            ok=1
            [[ "$code" == "200" ]] || ok=0
            for needle in "$@"; do grep -Fq "$needle" "$out" || ok=0; done
            if [[ "$ok" == 1 ]]; then echo "PASS $url" | tee -a "$report"; else echo "FAIL code=$code $url" | tee -a "$report"; cat "$out" | head -c 1600 >> "$report"; echo >> "$report"; return 1; fi
          }
          check 'https://wisequotesworld.com/start/' '1,080' '256' '113' '105' '33' '217' '332' 'Français <b>13</b>'
          for l in uk ru pl en sv de es fr; do
            check "https://wisequotesworld.com/$l/start/" 'localized.js?v=20260902-0300'
          done
          check 'https://wisequotesworld.com/start/localized.js?v=20260902-0300' \
            'uk:{facebook:8,instagram:940,threads:42,tiktok:54,youtube:36}' \
            'ru:{facebook:7,instagram:44,threads:13,tiktok:90,youtube:102}' \
            'pl:{facebook:16,instagram:17,threads:6,tiktok:40,youtube:34}' \
            'en:{facebook:12,instagram:17,threads:10,tiktok:33,youtube:33}' \
            'sv:{facebook:4,instagram:9,threads:6,tiktok:10,youtube:4}' \
            'de:{facebook:19,instagram:106,threads:4,tiktok:64,youtube:24}' \
            'es:{facebook:27,instagram:197,threads:3,tiktok:12,youtube:93}' \
            'fr:{facebook:0,instagram:0,threads:0,tiktok:2,youtube:11}'
          echo "checked_at=$(date -u +%FT%TZ)" | tee -a "$report"
          echo 'overall=PASS' | tee -a "$report"
      - name: Commit readback report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/start-pages-live.txt || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record start pages live readback'
          git push
