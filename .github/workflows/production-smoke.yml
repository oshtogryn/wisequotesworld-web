name: Production smoke

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'lib/**'
      - 'styles.css'
      - 'start/**'
      - '.github/workflows/production-smoke.yml'
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wait for Pages deployment
        if: github.event_name == 'push'
        run: sleep 45

      - name: Verify production routes and security
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"

          headers="$(mktemp)"; body="$(mktemp)"
          code="$(curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' 'https://wisequotesworld.com/en/')"
          echo "public /en/ => HTTP $code"
          test "$code" = "200"
          grep -qi '^x-wqw-revision: p0-runtime-20260915' "$headers"
          grep -qi '^strict-transport-security:' "$headers"
          grep -qi '^content-security-policy:' "$headers"
          grep -q 'Wise Quotes World' "$body"

          for spec in \
            'sv|Varje dag.|Vetenskap' \
            'es|Cada día.|Ciencia' \
            'it|Saggezza da ricordare|Tutte le citazioni' \
            'pt|Sabedoria que vale a pena lembrar|Todas as citações' \
            'id|Kebijaksanaan yang layak diingat|Semua kutipan' \
            'tr|Hatırlamaya değer bilgelik|Tüm alıntılar' \
            'ar|حكمة تستحق أن نتذكرها|جميع الاقتباسات'; do
            IFS='|' read -r locale marker secondary <<< "$spec"
            locale_body="$(mktemp)"
            code="$(curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$locale_body" -w '%{http_code}' "https://wisequotesworld.com/$locale/")"
            echo "localized /$locale/ => HTTP $code"
            test "$code" = '200'
            grep -Fq "$marker" "$locale_body"
            grep -Fq "$secondary" "$locale_body"
          done

          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' 'https://wisequotesworld.com/admin/')"
          echo "anonymous /admin/ => HTTP $code"
          test "$code" = "302"

          headers="$(mktemp)"; body="$(mktemp)"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' \
            'https://wisequotesworld.com/api/admin/health' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")"
          echo "service-auth /api/admin/health => HTTP $code"
          test "$code" = "200"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body"
          grep -Eq '"access"[[:space:]]*:[[:space:]]*true' "$body"

          config_body="$(mktemp)"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$config_body" -w '%{http_code}' \
            'https://wisequotesworld.com/api/admin/newsletter/runtime-config' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Accept: application/json')"
          echo "runtime security config => HTTP $code"
          test "$code" = '200'
          python3 - "$config_body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          print('runtime security config:', data)
          assert data.get('ok') is True
          PY

          newsletter_body="$(mktemp)"
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$newsletter_body" -w '%{http_code}' \
            'https://wisequotesworld.com/api/admin/newsletter' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Accept: application/json')"
          echo "newsletter health => HTTP $code"
          test "$code" = '200'
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$newsletter_body"
          python3 - "$newsletter_body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          settings=data.get('settings') or {}
          subscribers=data.get('subscribers') or {}
          print('newsletter summary:', {
              'enabled': bool(settings.get('enabled')),
              'cadence_days': settings.get('cadence_days'),
              'daily_cap': settings.get('daily_cap'),
              'execution_cap': settings.get('execution_cap'),
              'active_subscribers': subscribers.get('active'),
              'last_run_at': settings.get('last_run_at'),
          })
          PY

          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' \
            -X POST 'https://wisequotesworld.com/api/admin/site-visibility/release-due' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json')"
          echo "release-due scheduler endpoint => HTTP $code"
          test "$code" = "200"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body"

          for path in '/admin/' '/api/admin/health' '/ops/'; do
            code="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://wisequotesworld-web.pages.dev$path")"
            echo "pages.dev anonymous $path => HTTP $code"
            if [ "$code" = '200' ]; then
              echo "FAIL: privileged pages.dev route is anonymously accessible" >&2
              exit 1
            fi
          done

          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' 'https://wisequotesworld.com/prompt-audit-readback-20260914.json')"
          echo "retired prompt audit endpoint => HTTP $code"
          test "$code" = "410"

          code="$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' 'https://wisequotesworld.com/sitemap.xml')"
          echo "sitemap.xml => HTTP $code"
          test "$code" = "200"
          grep -q '<urlset' "$body"
          grep -q 'hreflang="x-default"' "$body"

          {
            echo '## Wise Quotes World production smoke'
            echo
            echo "- Checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo '- Public site: OK'
            echo '- Locale renderers sv/es/it/pt/id/tr/ar: OK'
            echo '- Cloudflare Access gate: OK'
            echo '- Service-auth health endpoint: OK'
            echo '- Protected runtime security configuration readback: OK'
            echo '- Newsletter health/readback endpoint: OK'
            echo '- Application guard on pages.dev privileged routes: OK'
            echo '- Visibility scheduler endpoint: OK'
            echo '- Retired prompt-audit endpoint: OK (410)'
            echo '- Sitemap + x-default hreflang: OK'
            echo '- Security headers: OK'
          } >> "$GITHUB_STEP_SUMMARY"

          echo 'Production smoke passed.'
