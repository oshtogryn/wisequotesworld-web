name: site-visibility-live-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-visibility-live-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 20

      - name: Verify Admin control is live
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 5 --retry-all-errors https://wisequotesworld.com/admin/console/ -o /tmp/admin.html
          grep -q 'sitePublishBtn' /tmp/admin.html
          grep -q 'Опублікувати на сайт' /tmp/admin.html
          echo 'PASS admin: Опублікувати на сайт is live'

      - name: Verify visibility API is protected and live
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/api.json -w '%{http_code}' https://wisequotesworld.com/api/admin/site-visibility/WQ017)
          test "$code" = '401'
          grep -q 'unauthorized' /tmp/api.json
          echo 'PASS API: protected endpoint is live (401 without token)'

      - name: Verify direct WQ017 article is public
        run: |
          set -euo pipefail
          ARTICLE='https://wisequotesworld.com/uk/quotes/avraham-linkoln-pravda-daie-sylu/'
          code=$(curl -sS --retry 8 --retry-delay 5 --retry-all-errors -o /tmp/article.html -w '%{http_code}' "$ARTICLE")
          test "$code" = '200'
          test -s /tmp/article.html
          grep -q 'Вірмо, що правда дає силу' /tmp/article.html
          echo "PASS article: HTTP $code and Lincoln content rendered"

      - name: Verify dynamic D1 sitemap contains WQ017
        run: |
          set -euo pipefail
          SLUG='avraham-linkoln-pravda-daie-sylu'
          found=0
          for i in $(seq 1 12); do
            curl -fsS --retry 8 --retry-delay 5 --retry-all-errors https://wisequotesworld.com/sitemap.xml -o /tmp/sitemap.xml
            if grep -q "$SLUG" /tmp/sitemap.xml; then found=1; break; fi
            echo "Waiting for dynamic sitemap deployment ($i/12)..."
            sleep 5
          done
          test "$found" = '1'
          grep -q 'xmlns:xhtml="http://www.w3.org/1999/xhtml"' /tmp/sitemap.xml
          grep -q 'hreflang="uk"' /tmp/sitemap.xml
          echo 'PASS sitemap: WQ017 is indexable and hreflang sitemap is D1-backed'

      - name: Verify WQ017 is hidden from editorial listings
        run: |
          set -euo pipefail
          SLUG='avraham-linkoln-pravda-daie-sylu'
          for path in uk/start/ uk/ uk/quotes/; do
            curl -fsS --retry 8 --retry-delay 5 --retry-all-errors "https://wisequotesworld.com/$path" -o /tmp/list.html
            if grep -q "$SLUG" /tmp/list.html; then
              echo "WQ017 unexpectedly visible on /$path" >&2
              exit 1
            fi
          done
          echo 'PASS visibility: WQ017 is hidden from start/home/archive until explicit website_visibility approval'
