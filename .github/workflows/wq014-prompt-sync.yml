name: WQ014 prompt sync
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'lib/wq014_prompt_sync.js'
      - '.github/workflows/wq014-prompt-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        run: sleep 25
      - name: Sync WQ014 prompts
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 8 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/sync/wq014-prompts' -o ops/readback/WQ014-prompts.json
          cat ops/readback/WQ014-prompts.json
          curl -L -sS --retry 8 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/ops/readback/wq014-production.json' -o ops/readback/WQ014-production-d1.json
          python - <<'PY'
          import json
          p=json.load(open('ops/readback/WQ014-prompts.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('video_prompt_count')==8 and p.get('pinterest_prompt_count')==8, p
          d=json.load(open('ops/readback/WQ014-production-d1.json',encoding='utf-8'))['production']
          assert d.get('ok') is True, d
          for x in d.get('languages',[]):
              r=x.get('readiness',{})
              assert r.get('video_prompt') is True, x
              assert r.get('pinterest_prompt') is True, x
          PY
      - name: Commit prompt readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/WQ014-prompts.json ops/readback/WQ014-production-d1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record WQ014 prompt D1 readback'
          git push
