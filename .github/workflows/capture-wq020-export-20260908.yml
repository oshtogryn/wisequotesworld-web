name: Capture WQ020 scheduling export 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/capture-wq020-export-20260908.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        run: sleep 75
      - name: Capture export
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -fsSL --retry 15 --retry-all-errors --retry-delay 4 \
            'https://wisequotesworld.com/ops/export/wq020-5a9e31c7' \
            -o ops/readback/wq020-scheduling-export-20260908.json
          python - <<'PY'
          import json
          p='ops/readback/wq020-scheduling-export-20260908.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          assert len(d.get('versions',[]))==13,d.get('versions')
          print('WQ020 export captured',d.get('item'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq020-scheduling-export-20260908.json
          git commit -m 'Record WQ020 scheduling export'
          git push
