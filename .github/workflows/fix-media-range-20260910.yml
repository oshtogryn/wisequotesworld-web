name: Fix approved media byte-range delivery 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/fix-media-range-20260910.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved media delivery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          old="""async function serveObject(request,env,key,kind,ext,mime){if(!env.MEDIA)return json({ok:false,error:'media unavailable'},503);const obj=await env.MEDIA.get(key);if(!obj)return json({ok:false,error:'R2 object missing'},404);const headers=new Headers();obj.writeHttpMetadata(headers);const asMp4=kind==='video'&&ext==='mp4';headers.set('content-type',asMp4?'video/mp4':(mime||headers.get('content-type')||'application/octet-stream'));headers.set('content-length',String(obj.size||0));headers.set('content-disposition',`inline; filename=\"${kind==='video'?(asMp4?'video.mp4':'video.mov'):'pinterest.png'}\"`);headers.set('cache-control','public, max-age=86400, immutable');headers.set('access-control-allow-origin','*');if(request.method==='HEAD')return new Response(null,{headers});return new Response(obj.body,{headers})}"""
          new="""async function serveObject(request,env,key,kind,ext,mime){if(!env.MEDIA)return json({ok:false,error:'media unavailable'},503);const meta=await env.MEDIA.head(key);if(!meta)return json({ok:false,error:'R2 object missing'},404);const size=Number(meta.size||0),rangeHeader=request.headers.get('range');let start=0,end=Math.max(0,size-1),partial=false;if(rangeHeader){const m=rangeHeader.match(/^bytes=(\\d*)-(\\d*)$/);if(m){if(m[1])start=Math.max(0,Number(m[1]));if(m[2])end=Math.min(size-1,Number(m[2]));else end=size-1;if(!m[1]&&m[2]){const suffix=Math.min(size,Number(m[2]));start=Math.max(0,size-suffix);end=size-1}if(start<=end&&start<size)partial=true}}const obj=request.method==='HEAD'?meta:await env.MEDIA.get(key,partial?{range:{offset:start,length:end-start+1}}:undefined);if(!obj)return json({ok:false,error:'R2 object missing'},404);const headers=new Headers();obj.writeHttpMetadata(headers);const asMp4=kind==='video'&&ext==='mp4';headers.set('content-type',asMp4?'video/mp4':(mime||headers.get('content-type')||'application/octet-stream'));headers.set('content-disposition',`inline; filename=\"${kind==='video'?(asMp4?'video.mp4':'video.mov'):'pinterest.png'}\"`);headers.set('cache-control','public, max-age=86400, immutable');headers.set('access-control-allow-origin','*');headers.set('accept-ranges','bytes');if(partial){headers.set('content-range',`bytes ${start}-${end}/${size}`);headers.set('content-length',String(end-start+1))}else headers.set('content-length',String(size));if(request.method==='HEAD')return new Response(null,{status:200,headers});return new Response(obj.body,{status:partial?206:200,headers})}"""
          if old not in s:
              raise SystemExit('target serveObject function not found; refusing unsafe patch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Support byte-range requests for approved media'
          git push
