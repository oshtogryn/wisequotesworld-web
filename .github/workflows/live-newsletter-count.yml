name: Live newsletter count
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-newsletter-count.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read live subscriber count
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          url='https://wisequotesworld.com/ops/readback/newsletter-health.json'
          req=urllib.request.Request(url,headers={'User-Agent':'WQW-live-count/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.loads(r.read().decode())
          out={'ok':True,'active':int(data.get('active',0)),'checked_at':datetime.datetime.utcnow().replace(microsecond=0).isoformat()+'Z'}
          pathlib.Path('ops/readback').mkdir(parents=True,exist_ok=True)
          pathlib.Path('ops/readback/newsletter-live-count.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(out)
          PY
      - name: Commit readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/newsletter-live-count.json
          git commit -m 'Record live newsletter subscriber count' || true
          git push
