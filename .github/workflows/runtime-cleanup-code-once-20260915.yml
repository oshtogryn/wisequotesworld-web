name: Runtime cleanup code once 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-cleanup-code-once-20260915.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch worker runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')

          for token in [
            "import {applyWQ021030Fix} from './lib/wq021_030_prompt_status_fix_20260911.js';\n",
            "import {wq017ScheduleExport} from './lib/wq017_schedule_export.js';\n",
            "import {prepareFuturePreprod} from './lib/future_preprod.js';\n",
          ]:
            s=s.replace(token,'')

          old="if(url.pathname==='/sitemap.xml'&&request.method==='GET'){scheduleIndexNow(ctx,submitAllPublished(env));return dynamicSitemap(env)}"
          new="if(url.pathname==='/sitemap.xml'&&request.method==='GET'){const r=await dynamicSitemap(env);const h=new Headers(r.headers);h.set('x-wqw-sitemap-mode','read-only');return new Response(r.body,{status:r.status,statusText:r.statusText,headers:h})}"
          if old not in s:
            raise SystemExit('sitemap side-effect handler not found')
          s=s.replace(old,new,1)
          s=s.replace("import {submitAllPublished,submitRecentPublished} from './lib/indexnow_runtime.js';","import {submitRecentPublished} from './lib/indexnow_runtime.js';",1)

          stale=[
            "if(url.pathname==='/ops/run/wq021-wq022-correction-20260911'&&request.method==='POST')return json(await applyWQ021030Fix(env));",
            "if(url.pathname==='/ops/run/future-preprod'&&request.method==='POST'){const r=json(await prepareFuturePreprod(env));if(r.ok&&isMutation(request,url))scheduleIndexNow(ctx,submitRecentPublished(env,10));return r}",
            "const wq017ExportResponse=await wq017ScheduleExport(request,env);if(wq017ExportResponse)return wq017ExportResponse;",
          ]
          for token in stale:
            if token not in s:
              raise SystemExit('missing stale route anchor: '+token[:100])
            s=s.replace(token,'',1)

          lines=s.splitlines()
          out=[]; seen=False
          for line in lines:
            if line.strip()=='// deploy-marker: future-preprod-wq017-premedia-v1':
              if seen:
                continue
              seen=True
            out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          node --check _worker.js
          git diff --check

      - name: Commit worker cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: remove stale runtime mutation routes and sitemap side effect'
          git pull --rebase origin main
          git push

      - name: Wait for production deployment
        run: sleep 70

      - name: Production readback
        shell: bash
        run: |
          set -euo pipefail
          h=$(mktemp); b=$(mktemp)
          for i in $(seq 1 12); do
            code=$(curl -sS --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 30 -D "$h" -o "$b" -w '%{http_code}' 'https://wisequotesworld.com/sitemap.xml' || true)
            if [ "$code" = '200' ] && grep -qi '^x-wqw-sitemap-mode: read-only' "$h"; then
              echo "sitemap read-only deployment verified on attempt $i"
              grep -q '<urlset' "$b"
              exit 0
            fi
            sleep 5
          done
          echo 'new sitemap read-only revision was not observed in production' >&2
          cat "$h" >&2 || true
          exit 1
