name: Media inventory once 2026-09-16

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-inventory-once-20260916
  cancel-in-progress: true

jobs:
  inventory:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read current production media state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          report="$RUNNER_TEMP/media-inventory-20260916.json"
          echo '[]' > "$report"
          export CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET tmp
          seq 11 35 | xargs -P 10 -I{} bash -c '
            id="WQ$(printf "%03d" "{}")"
            curl -sS --retry 1 --connect-timeout 5 --max-time 15 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -o "$tmp/$id.json" -w "%{http_code}" \
              "https://wisequotesworld.com/api/admin/production/$id" > "$tmp/$id.code" || true
          '
          python3 - "$tmp" "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob,json,os,sys
          tmp,report,summary=sys.argv[1:]
          rows=[]
          for path in sorted(glob.glob(os.path.join(tmp,'WQ*.json'))):
              id=os.path.basename(path).split('.')[0]
              try:
                  code=open(os.path.join(tmp,id+'.code')).read().strip()
                  if code!='200': continue
                  d=json.load(open(path,encoding='utf-8'))
              except Exception: continue
              if not d.get('ok'): continue
              r=d.get('readiness') or {}; item=r.get('item') or {}; media=d.get('media') or []
              vids=[m for m in media if 'video' in str(m.get('asset_type','')).lower() or str(m.get('mime_type','')).lower().startswith('video/')]
              raw=[m for m in vids if str(m.get('asset_type','')).lower() not in {'video_normalized','video_normalized_mp4','social_video_normalized'}]
              norm=[m for m in vids if str(m.get('asset_type','')).lower() in {'video_normalized','video_normalized_mp4','social_video_normalized'} and str(m.get('mime_type','')).lower()=='video/mp4' and m.get('qa_status')=='approved']
              issues=[]; locale_rows=[]
              for x in r.get('languages') or []:
                  if x.get('social_connected'):
                      lr={'language':x.get('language'),'ready':bool(x.get('ready')),'video':bool(x.get('video')),'video_delivery_ready':bool(x.get('video_delivery_ready')),'media_qa':bool(x.get('media_qa')),'media_issues':x.get('media_issues') or []}
                      locale_rows.append(lr)
                      if lr['media_issues']: issues.append(f"{lr['language']}:{','.join(lr['media_issues'])}")
              rows.append({'id':id,'status':item.get('status'),'ready_for_metricool':bool(r.get('ready_for_metricool')),'raw_videos':len(raw),'normalized_approved':len(norm),'issues':issues,'social_locales':locale_rows})
          with open(report,'w',encoding='utf-8') as f: json.dump(rows,f,ensure_ascii=False,indent=2)
          with open(summary,'a',encoding='utf-8') as f:
              f.write('| Topic | Status | Social-ready | Raw videos | Normalized approved | Media issues |\n|---|---|---:|---:|---:|---|\n')
              for row in rows:
                  f.write(f"| {row['id']} | {row.get('status','')} | {'YES' if row['ready_for_metricool'] else 'NO'} | {row['raw_videos']} | {row['normalized_approved']} | {'; '.join(row['issues'])[:500]} |\n")
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY

          # The audit is intentionally read-only. Production state lives in D1;
          # an observational readback must never race with or mutate main.
          cp "$report" ./media-inventory-readback.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-inventory-20260916
          path: media-inventory-readback.json
          if-no-files-found: error
          retention-days: 14
