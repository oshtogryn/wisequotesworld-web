name: Install centralized GA4 funnel
on:
  push:
    paths:
      - 'ops/GA4_FUNNEL_TRIGGER'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker with assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          imp="import {submitAllPublished,submitRecentPublished} from './lib/indexnow_runtime.js';"
          newimp=imp+"\nimport {analyticsEventsScript} from './lib/analytics_runtime.js';"
          if "import {analyticsEventsScript} from './lib/analytics_runtime.js';" not in s:
              assert imp in s, 'indexnow import anchor missing'
              s=s.replace(imp,newimp,1)
          old="async function withLocaleTracking(response,url){if(!response)return response;const type=response.headers.get('content-type')||'';if(!type.includes('text/html'))return response;const locale=url.pathname.match(/^\\/(uk|ru|pl|en|sv|de|es|fr|it|pt|id|tr|ar)(?:\\/|$)/)?.[1],hash=locale&&METRICOOL_HASHES[locale];const html=await response.text();let injections='';if(!html.includes(GA4_MEASUREMENT_ID))injections+=ga4Script();if(hash&&!html.includes(hash))injections+=metricoolScript(hash);if(!injections)return new Response(html,{status:response.status,statusText:response.statusText,headers:response.headers});const tracked=html.includes('</head>')?html.replace('</head>',`${injections}</head>`):html,headers=new Headers(response.headers);headers.delete('content-length');return new Response(tracked,{status:response.status,statusText:response.statusText,headers})}"
          new="async function withLocaleTracking(response,url){if(!response)return response;const type=response.headers.get('content-type')||'';if(!type.includes('text/html'))return response;const locale=url.pathname.match(/^\\/(uk|ru|pl|en|sv|de|es|fr|it|pt|id|tr|ar)(?:\\/|$)/)?.[1],hash=locale&&METRICOOL_HASHES[locale];const html=await response.text();let injections='';if(!html.includes(GA4_MEASUREMENT_ID))injections+=ga4Script();if(locale&&!html.includes('wqw-analytics-v1'))injections+=analyticsEventsScript(locale);if(hash&&!html.includes(hash))injections+=metricoolScript(hash);if(!injections)return new Response(html,{status:response.status,statusText:response.statusText,headers:response.headers});const tracked=html.includes('</head>')?html.replace('</head>',`${injections}</head>`):html,headers=new Headers(response.headers);headers.delete('content-length');return new Response(tracked,{status:response.status,statusText:response.statusText,headers})}"
          if "analyticsEventsScript(locale)" not in s:
              assert old in s, 'tracking function anchor missing'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax validation
        run: |
          node --check _worker.js
          node --check lib/analytics_runtime.js
          grep -F "import {analyticsEventsScript} from './lib/analytics_runtime.js';" _worker.js
          grep -F "analyticsEventsScript(locale)" _worker.js
      - name: Commit guarded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inject centralized GA4 funnel events'
          git push
