name: Diagnose Cloudflare edge for service token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-edge-20260911.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare Cloudflare edge responses
        shell: bash
        run: |
          set -euo pipefail
          REPORT='ops/cloudflare-edge-diagnostic-20260911.md'
          {
            echo '# Cloudflare edge diagnostic — 2026-09-11'
            echo
            echo 'Same GitHub Actions runner and same CF Access service-token secrets were used for both domains.'
            echo
          } > "$REPORT"

          check() {
            local label="$1"
            local url="$2"
            local mode="$3"
            local headers body code
            headers="$(mktemp)"
            body="$(mktemp)"

            args=(-sS --connect-timeout 10 --max-time 30 --http1.1 -A 'GitHub-Actions-Cloudflare-Diagnostic/1.0' -D "$headers" -o "$body" -w '%{http_code}')
            if [ "$mode" = 'service' ]; then
              args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            fi

            code="$(curl "${args[@]}" "$url" || true)"
            {
              echo "## $label"
              echo
              echo "- URL: \`$url\`"
              echo "- Mode: \`$mode\`"
              echo "- HTTP: \`$code\`"
              echo
              echo 'Relevant response headers:'
              echo '```text'
              awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|server:|cf-ray:|cf-mitigated:|cf-cache-status:|content-type:|location:|cf-chl-out:|x-frame-options:|content-security-policy:|vary:)/ {gsub(/\r$/,""); print}' "$headers"
              echo '```'
              echo
              echo 'Body fingerprint:'
              echo '```text'
              head -c 700 "$body" | tr '\n\r' '  ' | sed -E 's/[[:space:]]+/ /g'
              echo
              echo '```'
              echo
            } >> "$REPORT"
          }

          check 'WQW /admin/ with service token' 'https://wisequotesworld.com/admin/' service
          check 'WQW /api/admin/health with service token' 'https://wisequotesworld.com/api/admin/health' service
          check 'WQW /ops/ with service token' 'https://wisequotesworld.com/ops/' service
          check 'SNS /admin/console/ with service token' 'https://swedennosugar.com/admin/console/' service
          check 'WQW /admin/ anonymous' 'https://wisequotesworld.com/admin/' anonymous
          check 'SNS /admin/console/ anonymous' 'https://swedennosugar.com/admin/console/' anonymous

          echo 'Diagnostic complete.' >> "$REPORT"

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cloudflare-edge-diagnostic-20260911.md
          git commit -m 'record Cloudflare edge diagnostic' || exit 0
          git push
