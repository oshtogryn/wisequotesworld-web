name: probe-site-visibility-route
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-site-visibility-route.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        run: sleep 25
      - name: Verify route is live
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 8 --retry-all-errors --retry-delay 4 -o /tmp/out.json -w '%{http_code}' https://wisequotesworld.com/api/admin/site-visibility/WQ017)
          cat /tmp/out.json
          test "$code" = '401'
          grep -q 'unauthorized' /tmp/out.json
          echo 'PASS: site visibility route is live and protected.'
