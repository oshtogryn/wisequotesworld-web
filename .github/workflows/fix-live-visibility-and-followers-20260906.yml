name: Fix live visibility and follower counters 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-visibility-and-followers-20260906.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch follower counters and IT/PT visibility guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          latest = "const FOLLOWERS={uk:{facebook:10,instagram:938,threads:43,tiktok:58,youtube:38},ru:{facebook:7,instagram:44,threads:13,tiktok:93,youtube:104},pl:{facebook:17,instagram:17,threads:6,tiktok:40,youtube:37},en:{facebook:13,instagram:17,threads:10,tiktok:36,youtube:34},sv:{facebook:4,instagram:9,threads:6,tiktok:11,youtube:4},de:{facebook:19,instagram:105,threads:4,tiktok:70,youtube:24},es:{facebook:28,instagram:195,threads:3,tiktok:16,youtube:100},fr:{facebook:1,instagram:0,threads:0,tiktok:8,youtube:23}};"

          # Runtime /start follower source used in production.
          p=Path('lib/start_unified.js')
          s=p.read_text()
          s,n=re.subn(r"const FOLLOWERS=\{[^\n]+\};", latest, s, count=1)
          if n != 1:
              raise SystemExit('Could not update FOLLOWERS in lib/start_unified.js')
          p.write_text(s)

          # Static fallback source, kept in sync as well.
          p=Path('start/localized.js')
          s=p.read_text()
          static = "const S={\n    uk:{facebook:10,instagram:938,threads:43,tiktok:58,youtube:38},ru:{facebook:7,instagram:44,threads:13,tiktok:93,youtube:104},pl:{facebook:17,instagram:17,threads:6,tiktok:40,youtube:37},en:{facebook:13,instagram:17,threads:10,tiktok:36,youtube:34},sv:{facebook:4,instagram:9,threads:6,tiktok:11,youtube:4},de:{facebook:19,instagram:105,threads:4,tiktok:70,youtube:24},es:{facebook:28,instagram:195,threads:3,tiktok:16,youtube:100},fr:{facebook:1,instagram:0,threads:0,tiktok:8,youtube:23}\n  };"
          s,n=re.subn(r"const S=\{\n\s+uk:\{facebook:[\s\S]*?\n\s+\};", static, s, count=1)
          if n != 1:
              raise SystemExit('Could not update S in start/localized.js')
          p.write_text(s)

          # IT/PT pages previously trusted quote_pages.status='published' alone.
          # Apply the same canonical website_visibility guard already used by the other locale renderer.
          p=Path('lib/new_locales_site.js')
          s=p.read_text()
          guard="(COALESCE(ci.sequence_no,CAST(SUBSTR(ci.id,3) AS INTEGER),0)<=15 OR EXISTS (SELECT 1 FROM content_approvals sva WHERE sva.content_item_id=ci.id AND sva.approval_scope='website_visibility' AND sva.language_code IS NULL AND sva.status='approved'))"

          old="WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published'`;"
          new=f"WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND {guard}`;"
          if old not in s:
              raise SystemExit('rows() visibility anchor not found')
          s=s.replace(old,new,1)

          old="WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' GROUP BY"
          new=f"WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND {guard} GROUP BY"
          if old not in s:
              raise SystemExit('categories() visibility anchor not found')
          s=s.replace(old,new,1)

          old="WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND ci.attribution_status='verified'"
          new=f"WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND {guard} AND ci.attribution_status='verified'"
          if old not in s:
              raise SystemExit('authors() visibility anchor not found')
          s=s.replace(old,new,1)

          old="WHERE qp.project_id=? AND qp.language_code=? AND qp.slug=? AND qp.status='published' LIMIT 1"
          new=f"WHERE qp.project_id=? AND qp.language_code=? AND qp.slug=? AND qp.status='published' AND {guard} LIMIT 1"
          if old not in s:
              raise SystemExit('detail visibility anchor not found')
          s=s.replace(old,new,1)

          old="SELECT language_code,canonical_path FROM quote_pages WHERE project_id=? AND content_item_id=? AND status='published' ORDER BY language_code"
          new=f"SELECT qp.language_code,qp.canonical_path FROM quote_pages qp JOIN content_items ci ON ci.id=qp.content_item_id WHERE qp.project_id=? AND qp.content_item_id=? AND qp.status='published' AND {guard} ORDER BY qp.language_code"
          if old not in s:
              raise SystemExit('equivalents visibility anchor not found')
          s=s.replace(old,new,1)

          old="SELECT language_code,canonical_path,updated_at,published_at FROM quote_pages WHERE project_id=? AND status='published' AND language_code IN ('uk','ru','pl','en','sv','de','es','fr','it','pt','id','tr','ar') ORDER BY language_code,canonical_path"
          new=f"SELECT qp.language_code,qp.canonical_path,qp.updated_at,qp.published_at FROM quote_pages qp JOIN content_items ci ON ci.id=qp.content_item_id WHERE qp.project_id=? AND qp.status='published' AND {guard} AND qp.language_code IN ('uk','ru','pl','en','sv','de','es','fr','it','pt','id','tr','ar') ORDER BY qp.language_code,qp.canonical_path"
          if old not in s:
              raise SystemExit('sitemap visibility anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY

          node --check lib/new_locales_site.js
          node --check lib/start_unified.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/new_locales_site.js lib/start_unified.js start/localized.js
          git diff --cached --quiet || git commit -m 'Fix IT PT hidden article leakage and refresh follower counters'
          git push

      - name: Wait for production deployment
        run: sleep 90

      - name: Verify production
        run: |
          set -euo pipefail
          it=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/it/?v=visibility-fix-20260906')
          pt=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/pt/?v=visibility-fix-20260906')
          if echo "$it" | grep -qi 'Montaigne'; then echo 'IT still leaks Montaigne'; exit 1; fi
          if echo "$pt" | grep -qi 'Montaigne'; then echo 'PT still leaks Montaigne'; exit 1; fi
          en=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/en/start/?v=followers-fix-20260906')
          de=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/de/start/?v=followers-fix-20260906')
          es=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/es/start/?v=followers-fix-20260906')
          fr=$(curl -L -f -sS --retry 15 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/fr/start/?v=followers-fix-20260906')
          echo "$en" | grep -q '36 followers / subscribers'
          echo "$de" | grep -q '70 Follower / Abonnenten'
          echo "$es" | grep -q '16 seguidores / suscriptores'
          echo "$fr" | grep -q '8 abonnés'
          echo 'Live verification passed.'
