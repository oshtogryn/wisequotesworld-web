name: Readback WQ019 production live 2026-09-07
on:
  push:
    paths:
      - '.github/workflows/readback-wq019-production-live-20260907.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current deployment
        run: sleep 20
      - name: Fetch authenticated production readback
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            'https://wisequotesworld.com/api/admin/production/WQ019' \
            -o /tmp/wq019.json
          python - <<'PY'
          import json
          p='/tmp/wq019.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          open('ops/readback/wq019-production-live-20260907.json','w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2))
          r=d['readiness']
          assert r.get('ready_for_metricool') is True,r
          assert r.get('approval',{}).get('status')=='approved',r
          ml=[x for x in r['languages'] if x['language'] in ['uk','ru','pl','en','sv','de','es','fr']]
          assert len(ml)==8 and all(x.get('ready') for x in ml),ml
          print('WQ019 ready_for_metricool=TRUE; 8/8 locales ready')
          PY
      - name: Commit readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq019-production-live-20260907.json
          git commit -m 'Record WQ019 live production readback before scheduling' || true
          git push
