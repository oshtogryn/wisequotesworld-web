name: Finalize WQ022-WQ031 native QA and hidden website
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-wq022-wq031-native-hidden-20260911.yml'
permissions:
  contents: write
concurrency:
  group: wq022-wq031-native-hidden-20260911
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install one-time protected finalizer route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --check lib/finalize_buffer_022_031_native_visibility_20260911.js
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          imp="import {publicationApi} from './lib/publication_api.js';"
          add=imp+"\nimport {finalizeBuffer022031NativeHidden} from './lib/finalize_buffer_022_031_native_visibility_20260911.js';"
          if 'finalizeBuffer022031NativeHidden' not in s:
              assert imp in s
              s=s.replace(imp,add,1)
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__internal_native_hidden_022031_8f741c'&&request.method==='POST'){if(request.headers.get('x-wqw-once')!=='f58d26a7d4a1')return json({ok:false,error:'forbidden'},403);return json(await finalizeBuffer022031NativeHidden(env));}"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose one-time native hidden finalizer for WQ022-WQ031'
          for i in $(seq 1 15); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 1
      - name: Wait for deployment and finalize canonical D1
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          URL='https://wisequotesworld-web.pages.dev/__internal_native_hidden_022031_8f741c'
          for i in $(seq 1 72); do
            code=$(curl -sS --max-time 15 -o /tmp/probe -w '%{http_code}' -X POST "$URL" -H 'x-wqw-once: wrong' || true)
            if [ "$code" = '403' ]; then break; fi
            sleep 10
          done
          curl -sS --fail-with-body --max-time 480 -X POST "$URL" \
            -H 'x-wqw-once: f58d26a7d4a1' \
            -H 'Content-Type: application/json' \
            -o ops/readback/wq022-wq031-native-hidden-final-20260911.json
          cat ops/readback/wq022-wq031-native-hidden-final-20260911.json
          python - <<'PY'
          import json
          p='ops/readback/wq022-wq031-native-hidden-final-20260911.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          rb=d.get('readback') or {}
          assert rb.get('ok') is True,rb
          rows=rb.get('rows') or []
          assert len(rows)==10,rows
          for r in rows:
              assert r.get('published_pages')==13,r
              assert r.get('native_qa',0)>=13,r
              assert r.get('website_visibility')!='approved',r
              assert r.get('scheduled_visibility')==0,r
              assert r.get('ok') is True,r
          print('PASS: WQ022-WQ031 native QA complete; 13/13 pages each published/indexable; editorial visibility hidden; no visibility schedules.')
          PY
      - name: Remove one-time route and persist readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("\nimport {finalizeBuffer022031NativeHidden} from './lib/finalize_buffer_022_031_native_visibility_20260911.js';",'')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__internal_native_hidden_022031_8f741c'&&request.method==='POST'){if(request.headers.get('x-wqw-once')!=='f58d26a7d4a1')return json({ok:false,error:'forbidden'},403);return json(await finalizeBuffer022031NativeHidden(env));}"
          s=s.replace(anchor+route,anchor)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-wq022-wq031-native-hidden-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js .github/workflows/finalize-wq022-wq031-native-hidden-20260911.yml || true
          if [ -f ops/readback/wq022-wq031-native-hidden-final-20260911.json ]; then git add ops/readback/wq022-wq031-native-hidden-final-20260911.json; fi
          git commit -m 'Persist WQ022-WQ031 native hidden readback and remove one-time route' || true
          for i in $(seq 1 15); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 0
