name: Add delivery POST fallback once 2026-09-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-post-fallback-once-20260916.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delivery-post-fallback-once-20260916
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow POST as service-safe delivery upsert verb
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/production_console_api_v2.js')
          s=p.read_text(encoding='utf-8')
          old="if(delivery&&request.method==='PUT')"
          new="if(delivery&&['PUT','POST'].includes(request.method))"
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('delivery endpoint now supports PUT and POST')
          elif new in s:
              print('already patched')
          else:
              raise SystemExit('delivery endpoint signature not found')
          PY
          node --check lib/production_console_api_v2.js
          grep -Fq "['PUT','POST'].includes(request.method)" lib/production_console_api_v2.js
      - name: Commit patch safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/production_console_api_v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: allow POST fallback for delivery ledger'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
