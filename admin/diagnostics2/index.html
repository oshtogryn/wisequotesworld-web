<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes Diagnostics v2</title><style>body{font-family:system-ui;margin:0;background:#f4f4f2;color:#111}.w{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:22px;margin:18px 0}input,button{font:inherit;width:100%;box-sizing:border-box;padding:15px;border-radius:14px;border:1px solid #ccc;margin:8px 0}button{font-weight:700;background:#111;color:#fff}.status{padding:16px;border-radius:14px;background:#eee;font-weight:700;white-space:pre-wrap}.ok{background:#dff7e6}.bad{background:#ffe1e1}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#111;color:#eee;padding:14px;border-radius:14px}</style></head><body><div class="w"><h1>Wise Quotes — Diagnostics v2</h1><div class="card"><label>Preview ADMIN_TOKEN</label><input id="t" type="password" autocomplete="off" placeholder="Token"><button id="schema">1. Connect / schema</button><button id="migrate">2. Apply migrations</button><div id="s" class="status">Waiting for action…</div></div><div class="card"><h2>Raw HTTP response</h2><pre id="o">—</pre></div></div><script>const s=document.getElementById('s'),o=document.getElementById('o'),t=document.getElementById('t');async function go(path,method){if(!t.value){s.className='status bad';s.textContent='TOKEN MISSING';return}s.className='status';s.textContent='Working…';o.textContent='—';try{const opts={method,headers:{'Authorization':'Bearer '+t.value,'Accept':'application/json'}};if(method==='POST'){opts.headers['Content-Type']='application/json';opts.body='{}'}const url=new URL(path,window.location.origin).href;const r=await window.fetch(url,opts);const text=await r.text();o.textContent='HTTP '+r.status+' '+r.statusText+'\nContent-Type: '+(r.headers.get('content-type')||'')+'\n\n'+text;let x=null;try{x=JSON.parse(text)}catch{}if(r.ok){s.className='status ok';s.textContent='SUCCESS HTTP '+r.status+(x?.schema?.ready?' — SCHEMA READY':'')}else{s.className='status bad';s.textContent='ERROR HTTP '+r.status+' — '+(x?.error||text.slice(0,180)||'unknown error')}}catch(e){s.className='status bad';s.textContent='FETCH ERROR — '+e.name+': '+e.message;o.textContent=(e.stack||String(e))}}document.getElementById('schema').onclick=()=>go('/api/admin/schema','GET');document.getElementById('migrate').onclick=()=>go('/api/admin/migrate','POST');</script></body></html>
