name: P0 media hardening 2026-09-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-media-hardening-20260916.yml'

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check _worker.js
          grep -q 'normalized_mp4_required' _worker.js
          grep -q 'videoDeliveryCheck' _worker.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then
            echo 'Worker already hardened.'
            exit 0
          fi
          git commit -m 'media: enforce truthful normalized public delivery'
          git pull --rebase origin main
          git push origin HEAD:main
