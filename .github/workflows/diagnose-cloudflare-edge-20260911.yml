name: Diagnose Cloudflare edge for service token

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-edge-20260911.yml'

permissions:
  contents: read

jobs:
  diagnose:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare Cloudflare edge responses
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/cloudflare-edge-diagnostic-20260915.md"
          {
            echo '# Cloudflare edge diagnostic — 2026-09-15'
            echo
            echo 'Current production probes from the same GitHub Actions runner.'
            echo
            if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              echo '- Access service-token secrets: present'
            else
              echo '- Access service-token secrets: MISSING'
            fi
            echo
          } > "$REPORT"

          check() {
            local label="$1"
            local url="$2"
            local mode="$3"
            local headers body code
            headers="$(mktemp)"
            body="$(mktemp)"

            args=(-sS --connect-timeout 10 --max-time 30 --http1.1 -A 'GitHub-Actions-Cloudflare-Diagnostic/3.0' -D "$headers" -o "$body" -w '%{http_code}')
            if [ "$mode" = 'service' ] && [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            fi

            code="$(curl "${args[@]}" "$url" || true)"
            {
              echo "## $label"
              echo
              echo "- URL: \`$url\`"
              echo "- Mode: \`$mode\`"
              echo "- HTTP: \`$code\`"
              echo
              echo 'Relevant response headers:'
              echo '```text'
              awk 'BEGIN{IGNORECASE=1} /^(HTTP\/|server:|cf-ray:|cf-mitigated:|cf-cache-status:|content-type:|location:|x-wqw-revision:|x-frame-options:|content-security-policy:|vary:)/ {gsub(/\r$/,""); print}' "$headers"
              echo '```'
              echo
              echo 'Body fingerprint:'
              echo '```text'
              head -c 500 "$body" | tr '\n\r' '  ' | sed -E 's/[[:space:]]+/ /g'
              echo
              echo '```'
              echo
            } >> "$REPORT"
          }

          check 'WQW public /en/ anonymous' 'https://wisequotesworld.com/en/' anonymous
          check 'WQW public /en/start/ anonymous' 'https://wisequotesworld.com/en/start/' anonymous
          check 'WQW /admin/ with service token' 'https://wisequotesworld.com/admin/' service
          check 'WQW /api/admin/health with service token' 'https://wisequotesworld.com/api/admin/health' service
          check 'WQW /ops/ with service token' 'https://wisequotesworld.com/ops/' service
          check 'WQW /admin/ anonymous' 'https://wisequotesworld.com/admin/' anonymous

          echo 'Diagnostic complete.' >> "$REPORT"
          cat "$REPORT"
