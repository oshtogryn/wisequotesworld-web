name: Start pages live readback

on:
  push:
    branches: [main]
    paths:
      - 'start/**'
      - 'lib/start_unified.js'
      - 'uk/start/**'
      - 'ru/start/**'
      - 'pl/start/**'
      - 'en/start/**'
      - 'sv/start/**'
      - 'de/start/**'
      - 'es/start/**'
      - 'fr/start/**'
      - '.github/workflows/start-pages-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production propagation
        run: sleep 45
      - name: Verify production start pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          report=ops/readback/start-pages-live.txt
          : > "$report"

          # Local runner DNS is diagnostic only. If it cannot resolve the custom
          # domain, resolve the A record independently through Cloudflare DoH.
          mapfile -t ips < <(getent ahostsv4 wisequotesworld.com 2>/dev/null | awk '{print $1}' | sort -u || true)
          if [[ "${#ips[@]}" -eq 0 ]]; then
            echo 'WARN local_dns=unresolved; trying Cloudflare DoH' | tee -a "$report"
            doh=$(curl -fsS --connect-timeout 10 --max-time 20 \
              --resolve cloudflare-dns.com:443:1.1.1.1 \
              -H 'accept: application/dns-json' \
              'https://cloudflare-dns.com/dns-query?name=wisequotesworld.com&type=A' || true)
            mapfile -t ips < <(printf '%s' "$doh" | jq -r '.Answer[]? | select(.type==1) | .data' 2>/dev/null | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u || true)
          fi
          if [[ "${#ips[@]}" -eq 0 ]]; then
            echo 'FAIL dns=no_A_record_from_local_or_cloudflare_doh' | tee -a "$report"
            exit 1
          fi
          printf 'production_ip=%s\n' "${ips[0]}" | tee -a "$report"
          resolve=(--resolve "wisequotesworld.com:443:${ips[0]}")

          fetch_contains(){
            url="$1"; shift
            attempts=12
            delay=15
            for attempt in $(seq 1 "$attempts"); do
              out=$(mktemp)
              sep='?'; [[ "$url" == *\?* ]] && sep='&'
              code=$(curl "${resolve[@]}" -L -sS -o "$out" -w '%{http_code}' \
                --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "${url}${sep}rb=$(date +%s)-${attempt}" || true)
              ok=1
              [[ "$code" == "200" ]] || ok=0
              for needle in "$@"; do grep -Fq "$needle" "$out" || ok=0; done
              if [[ "$ok" == 1 ]]; then
                echo "PASS $url attempt=$attempt" | tee -a "$report"
                rm -f "$out"
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "WAIT stale_or_unready code=$code $url attempt=$attempt/$attempts" | tee -a "$report"
                rm -f "$out"
                sleep "$delay"
              else
                echo "FAIL code=$code $url attempts=$attempts" | tee -a "$report"
                cat "$out" | head -c 1600 >> "$report"
                echo >> "$report"
                rm -f "$out"
                return 1
              fi
            done
          }

          # /start/ has totals only for the eight connected social locales.
          mapfile -t totals < <(grep -oE '<b data-total="(uk|ru|pl|en|sv|de|es|fr)">[^<]+</b>' start/index.html | sed -E 's#.*>([^<]+)</b>#\1#')
          [[ "${#totals[@]}" -eq 8 ]]
          fetch_contains 'https://wisequotesworld.com/start/' "${totals[@]}"

          # Static locale files must all use the same cache-busted follower source.
          version=$(grep -oE 'localized\.js\?v=[0-9-]+' uk/start/index.html | head -1 | cut -d= -f2)
          [[ -n "$version" ]]
          for l in uk ru pl en sv de es fr; do
            grep -Fq "localized.js?v=$version" "$l/start/index.html"
          done

          # The runtime renders locale /start/ pages from lib/start_unified.js.
          # Verify the five network values there; do not require localized.js markup.
          for l in uk ru pl en sv de es fr; do
            token=$(grep -oE "${l}:\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}" lib/start_unified.js | head -1)
            [[ -n "$token" ]]
            mapfile -t vals < <(printf '%s' "$token" | grep -oE ':[0-9]+' | tr -d ':')
            [[ "${#vals[@]}" -eq 5 ]]
            needles=()
            for v in "${vals[@]}"; do needles+=("<small>${v} "); done
            fetch_contains "https://wisequotesworld.com/$l/start/" "${needles[@]}"
          done

          mapfile -t stat_tokens < <(grep -oE '(uk|ru|pl|en|sv|de|es|fr):\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}' start/localized.js)
          [[ "${#stat_tokens[@]}" -eq 8 ]]
          fetch_contains "https://wisequotesworld.com/start/localized.js?v=$version" "${stat_tokens[@]}"

          echo "cache_version=$version" | tee -a "$report"
          echo "checked_at=$(date -u +%FT%TZ)" | tee -a "$report"
          echo 'overall=PASS' | tee -a "$report"
      - name: Commit readback report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/start-pages-live.txt || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record start pages live readback'
          git pull --rebase origin main || true
          git push
