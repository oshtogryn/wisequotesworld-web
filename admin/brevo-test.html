<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes World — Brevo test</title><style>body{margin:0;background:#0b0d12;color:#f5f2ea;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:40px 18px}.card{background:#151821;border:1px solid #5f5133;border-radius:18px;padding:28px}.brand{font-size:28px;font-weight:700;color:#e4c576;margin-bottom:18px}p{color:#c6c3bb;line-height:1.6}.btn{display:block;width:100%;border:0;border-radius:12px;background:#e4c576;color:#111;font-size:18px;font-weight:700;padding:15px;cursor:pointer}.btn:disabled{opacity:.55}.status{margin-top:18px;padding:14px;border-radius:12px;background:#10131b;color:#d8d5cc}.ok{border:1px solid #3d7954}.bad{border:1px solid #8a4b4b}.back{display:inline-block;margin-top:18px;color:#e4c576}</style></head><body><main class="wrap"><section class="card"><div class="brand">Wise Quotes World</div><h1>Brevo test</h1><p>Надсилає один тестовий лист першому активному підписнику з D1. Запит захищений вашим ADMIN_TOKEN, який уже збережений у браузері після підключення Admin.</p><button id="send" class="btn">Надіслати тестовий лист</button><div id="status" class="status">Очікує запуску.</div><a class="back" href="/admin/console/">← Admin Console</a></section></main><script>(()=>{const b=document.getElementById('send'),s=document.getElementById('status');b.addEventListener('click',async()=>{const token=localStorage.getItem('wq_admin_token')||'';if(!token){s.className='status bad';s.textContent='ADMIN_TOKEN не знайдено. Спочатку відкрийте Admin Console і натисніть «Підключити».';return}b.disabled=true;s.className='status';s.textContent='Надсилаю через Brevo…';try{const r=await fetch('/ops/run/brevo-test',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:'{}'});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));s.className='status ok';s.textContent='Brevo прийняв лист ✓ · мова '+(j.language||'—')+' · HTTP '+(j.status||'—')+(j.messageId?' · messageId отримано':'');}catch(e){s.className='status bad';s.textContent='Помилка: '+e.message}finally{b.disabled=false}})})();</script></body></html>
