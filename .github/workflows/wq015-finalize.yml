name: WQ015 finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq015-finalize.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy
        run: sleep 30
      - name: Mark WQ015 scheduled and verify
        run: |
          set -euo pipefail
          curl -L -sS --fail --retry 10 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/run/wq015-finalize' -o /tmp/finalize.json
          cat /tmp/finalize.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/finalize.json'))
          assert d.get('ok') is True, d
          assert d.get('approved_media')==16, d
          assert d.get('planner_readback')=='64/64', d
          assert d.get('status')=='scheduled', d
          print('WQ015 status=scheduled after Metricool Planner 64/64 verification')
          PY
