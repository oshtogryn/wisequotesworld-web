name: Pinterest description native fix WQ019-WQ026 2026-09-09
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pinterest-description-native-fix-20260909.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose one-time route
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js');s=p.read_text(encoding='utf-8')
          imp="import {unifiedQuoteArticle} from './lib/unified_quote_article.js';"
          s=s.replace(imp,imp+"\nimport {fixPinterestDescriptions019026} from './lib/pinterest_description_native_fix_019_026.js';",1)
          marker="export default {async fetch(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/ops/run/pinterest-description-native-fix-20260909-3c91de'&&request.method==='POST')return json(await fixPinterestDescriptions019026(env));"
          assert marker in s and 'pinterest-description-native-fix-20260909-3c91de' not in s
          s=s.replace(marker,marker+route,1);p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose one-time Pinterest description native fix'
          git push
      - name: Wait for deploy
        run: sleep 75
      - name: Apply and verify D1 descriptions
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 15 --retry-all-errors --retry-delay 6 -X POST \
            'https://wisequotesworld.com/ops/run/pinterest-description-native-fix-20260909-3c91de' \
            -o ops/readback/pinterest-description-native-fix-019-026-20260909.json
          cat ops/readback/pinterest-description-native-fix-019-026-20260909.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/pinterest-description-native-fix-019-026-20260909.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('updated')==104,d
          assert len(d.get('rows') or [])==8,d
          assert all(r.get('complete') for r in d['rows']),d
          print('PASS: 104 native Pinterest descriptions verified')
          PY
      - name: Remove one-time route and persist readback
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js');s=p.read_text(encoding='utf-8')
          s=s.replace("\nimport {fixPinterestDescriptions019026} from './lib/pinterest_description_native_fix_019_026.js';",'')
          s=s.replace("if(url.pathname==='/ops/run/pinterest-description-native-fix-20260909-3c91de'&&request.method==='POST')return json(await fixPinterestDescriptions019026(env));",'')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js ops/readback/pinterest-description-native-fix-019-026-20260909.json || true
          git commit -m 'Finalize Pinterest description native fix readback' || true
          git push
