name: One-shot follower source sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follower-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update follower sources and cache version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          old = "de:{facebook:19,instagram:106,threads:4,tiktok:70,youtube:25}"
          new = "de:{facebook:19,instagram:106,threads:4,tiktok:74,youtube:25}"
          version = "20260907-2310"

          for path in [Path('start/localized.js'), Path('lib/start_unified.js')]:
              s = path.read_text()
              if new not in s:
                  if old not in s:
                      raise SystemExit(f'Expected DE follower block not found in {path}')
                  s = s.replace(old, new, 1)
                  path.write_text(s)

          p = Path('start/index.html')
          s = p.read_text()
          s2, n = re.subn(r'(<b data-total="de">)228(</b>)', r'\g<1>232\g<2>', s, count=1)
          if n == 0 and '<b data-total="de">232</b>' not in s:
              raise SystemExit('Expected DE total not found in start/index.html')
          if s2 != s:
              p.write_text(s2)

          for lang in ['uk','ru','pl','en','sv','de','es','fr']:
              p = Path(lang) / 'start' / 'index.html'
              s = p.read_text()
              s2, n = re.subn(r'/start/localized\.js\?v=\d{8}-\d{4}', f'/start/localized.js?v={version}', s, count=1)
              if n != 1:
                  raise SystemExit(f'localized.js cache reference not found in {p}')
              if s2 != s:
                  p.write_text(s2)
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/follower-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add start/localized.js lib/start_unified.js start/index.html uk/start/index.html ru/start/index.html pl/start/index.html en/start/index.html sv/start/index.html de/start/index.html es/start/index.html fr/start/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Sync follower counters from Metricool'
          git push
