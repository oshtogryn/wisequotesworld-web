name: site-visibility-live-check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-visibility-live-check.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 20

      - name: Verify Admin control is live
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 5 https://wisequotesworld.com/admin/console/ -o /tmp/admin.html
          grep -q 'sitePublishBtn' /tmp/admin.html
          grep -q 'Опублікувати на сайт' /tmp/admin.html

      - name: Verify visibility API is protected and live
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/api.json -w '%{http_code}' https://wisequotesworld.com/api/admin/site-visibility/WQ017)
          test "$code" = '401'
          grep -q 'unauthorized' /tmp/api.json

      - name: Verify direct article remains public and indexed
        run: |
          set -euo pipefail
          ARTICLE='https://wisequotesworld.com/uk/quotes/avraham-linkoln-pravda-daie-sylu/'
          SLUG='avraham-linkoln-pravda-daie-sylu'
          curl -fsS --retry 6 --retry-delay 5 "$ARTICLE" -o /tmp/article.html
          test -s /tmp/article.html
          curl -fsS --retry 6 --retry-delay 5 https://wisequotesworld.com/sitemap.xml -o /tmp/sitemap.xml
          grep -q "$SLUG" /tmp/sitemap.xml

      - name: Verify WQ017 is hidden from Latest/navigation
        run: |
          set -euo pipefail
          SLUG='avraham-linkoln-pravda-daie-sylu'
          curl -fsS --retry 6 --retry-delay 5 https://wisequotesworld.com/uk/start/ -o /tmp/start.html
          if grep -q "$SLUG" /tmp/start.html; then
            echo 'WQ017 unexpectedly visible on /uk/start/' >&2
            exit 1
          fi
          echo 'PASS: WQ017 direct URL+sitemap are live, while /uk/start/ remains hidden until website_visibility approval.'
