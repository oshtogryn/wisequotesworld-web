name: Fix related quote visibility
on:
  push:
    paths:
      - '.github/workflows/fix-related-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch related quote visibility gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/quote_detail_v3.js')
          s=p.read_text()
          old="async function related(env,locale,row){return (await env.DB.prepare(`SELECT qp.slug,cv.adapted_text,ci.author_name,ci.attribution_status,ci.category,ci.category_slug FROM quote_pages qp JOIN content_versions cv ON cv.id=qp.content_version_id JOIN content_items ci ON ci.id=qp.content_item_id WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND qp.content_item_id<>? ORDER BY CASE WHEN COALESCE(ci.category_slug,'')=COALESCE(?, '') THEN 0 ELSE 1 END, COALESCE(ci.sequence_no,CAST(SUBSTR(ci.id,3) AS INTEGER),0) DESC LIMIT 3`).bind(PROJECT_ID,locale,row.content_item_id,row.category_slug||'').all()).results||[]}"
          new="async function related(env,locale,row){return (await env.DB.prepare(`SELECT qp.slug,cv.adapted_text,ci.author_name,ci.attribution_status,ci.category,ci.category_slug FROM quote_pages qp JOIN content_versions cv ON cv.id=qp.content_version_id JOIN content_items ci ON ci.id=qp.content_item_id WHERE qp.project_id=? AND qp.language_code=? AND qp.status='published' AND qp.content_item_id<>? AND (COALESCE(ci.sequence_no,CAST(SUBSTR(ci.id,3) AS INTEGER),0)<=15 OR EXISTS (SELECT 1 FROM content_approvals ca WHERE ca.project_id=qp.project_id AND ca.content_item_id=ci.id AND ca.approval_scope='website_visibility' AND ca.language_code IS NULL AND ca.status='approved')) ORDER BY CASE WHEN COALESCE(ci.category_slug,'')=COALESCE(?, '') THEN 0 ELSE 1 END, COALESCE(ci.sequence_no,CAST(SUBSTR(ci.id,3) AS INTEGER),0) DESC LIMIT 3`).bind(PROJECT_ID,locale,row.content_item_id,row.category_slug||'').all()).results||[]}"
          if old not in s:
              raise SystemExit('target related() function not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check lib/quote_detail_v3.js
          git diff -- lib/quote_detail_v3.js
      - name: Commit patch
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/quote_detail_v3.js
          git commit -m 'Hide unpublished future quotes from related cards'
          git push
