name: Split WQ018-WQ026 premedia
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-018-026-split.yml'
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire per-topic operational endpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/prepared_batch_018_026.js')
          s=p.read_text()
          add="\nexport async function prepareOne018026(env,id){if(!TOPICS[id])return{ok:false,id,error:'unsupported topic'};await ensure(env);return applyTopic(env,id,TOPICS[id])}\n"
          if 'export async function prepareOne018026' not in s:s+=add
          p.write_text(s)
          w=Path('_worker.js')
          x=w.read_text()
          imp="import {prepareOne018026,readBatch018026} from './lib/prepared_batch_018_026.js';"
          if imp not in x:
            anchor="import {prepareFuturePreprod} from './lib/future_preprod.js';"
            assert anchor in x
            x=x.replace(anchor,anchor+'\n'+imp,1)
          route="const prepOne=url.pathname.match(/^\\/ops\\/run\\/prepared-topic\\/(WQ0(?:18|19|20|21|22|23|24|25|26))$/);if(prepOne&&request.method==='POST')return json(await prepareOne018026(env,prepOne[1]));if(url.pathname==='/ops/readback/prepared-batch-018-026.json'&&request.method==='GET')return json(await readBatch018026(env));"
          if route not in x:
            anchor="if(url.pathname==='/ops/run/future-preprod'&&request.method==='POST')"
            assert anchor in x
            x=x.replace(anchor,route+anchor,1)
          marker='// deploy-marker: prepared-batch-split-v1'
          if marker not in x:x=marker+'\n'+x
          w.write_text(x)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/prepared_batch_018_026.js _worker.js
          git commit -m 'Wire per-topic premedia preparation endpoint'
          git push
      - name: Wait for deployment
        run: sleep 75
      - name: Prepare nine topics individually
        run: |
          set -euo pipefail
          for id in WQ018 WQ019 WQ020 WQ021 WQ022 WQ023 WQ024 WQ025 WQ026; do
            ok=0
            for i in $(seq 1 12); do
              code=$(curl -L -sS --retry 2 --retry-all-errors --retry-delay 3 -X POST "https://wisequotesworld.com/ops/run/prepared-topic/$id" -o "/tmp/$id.json" -w '%{http_code}' || true)
              echo "$id attempt $i HTTP $code"
              cat "/tmp/$id.json" || true; echo
              if [ "$code" = "200" ] && python - "$id" <<'PY'
          import json,sys
          d=json.load(open('/tmp/'+sys.argv[1]+'.json'))
          sys.exit(0 if d.get('ok') is True and d.get('status')=='media_pending' and d.get('published') is True else 1)
          PY
              then ok=1; break; fi
              sleep 8
            done
            test "$ok" = "1"
          done
      - name: Verify complete batch readback
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --fail --retry 10 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/ops/readback/prepared-batch-018-026.json' -o ops/readback/prepared-batch-018-026.json
          cat ops/readback/prepared-batch-018-026.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/prepared-batch-018-026.json'))
          assert d['ok'] is True,d
          assert d['count']==9,d
          for x in d['rows']:
            assert x['status']=='media_pending',x
            assert x['published_pages']==13,x
            assert x['outputs']==88,x
            assert x['native_qa']==13,x
            assert x['video_prompts']==8,x
            assert x['ready_for_user_media'] is True,x
          print('9/9 topics fully ready for user media')
          PY
      - name: Save verified readback
        run: |
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/prepared-batch-018-026.json
          git commit -m 'Save verified WQ018-WQ026 premedia readback' || exit 0
          git push
