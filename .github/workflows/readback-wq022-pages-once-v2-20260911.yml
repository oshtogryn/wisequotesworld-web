name: Read WQ022 canonical state once v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/readback-wq022-pages-once-v2-20260911.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install one-time readback route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          assert 'readbackProductionStatus' in s
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__wq022_read_a4e129'&&request.method==='GET'){if(request.headers.get('x-wqw-once')!=='d39a714fc621')return json({ok:false,error:'forbidden'},403);const prod=await readbackProductionStatus(env,'WQ022');const item=await env.DB.prepare(`SELECT id,status,canonical_title,quote_type,author_name,attribution_status FROM content_items WHERE project_id='wisequotesworld' AND id='WQ022'`).first();const pages=await env.DB.prepare(`SELECT COUNT(*) c FROM quote_pages WHERE project_id='wisequotesworld' AND content_item_id='WQ022' AND status='published'`).first();const vis=await env.DB.prepare(`SELECT status,updated_at,notes FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).first();return json({ok:true,item,published_pages:Number(pages?.c||0),website_visibility:vis||{status:'hidden'},production:prod});}"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose one-time WQ022 canonical readback v2'
          git push origin main
      - name: Wait, read and validate
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          URL='https://wisequotesworld-web.pages.dev/__wq022_read_a4e129'
          ready=0
          for i in $(seq 1 72); do
            code=$(curl -sS --max-time 15 -o /tmp/probe -w '%{http_code}' "$URL" -H 'x-wqw-once: wrong' || true)
            if [ "$code" = '403' ]; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = '1' ]
          curl -sS --fail-with-body --max-time 120 "$URL" -H 'x-wqw-once: d39a714fc621' -o ops/readback/wq022-canonical-prepublish-20260911.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq022-canonical-prepublish-20260911.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('published_pages')==13,d
          print(json.dumps(d,ensure_ascii=False))
          PY
      - name: Remove route and persist readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__wq022_read_a4e129'&&request.method==='GET'){if(request.headers.get('x-wqw-once')!=='d39a714fc621')return json({ok:false,error:'forbidden'},403);const prod=await readbackProductionStatus(env,'WQ022');const item=await env.DB.prepare(`SELECT id,status,canonical_title,quote_type,author_name,attribution_status FROM content_items WHERE project_id='wisequotesworld' AND id='WQ022'`).first();const pages=await env.DB.prepare(`SELECT COUNT(*) c FROM quote_pages WHERE project_id='wisequotesworld' AND content_item_id='WQ022' AND status='published'`).first();const vis=await env.DB.prepare(`SELECT status,updated_at,notes FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='website_visibility' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).first();return json({ok:true,item,published_pages:Number(pages?.c||0),website_visibility:vis||{status:'hidden'},production:prod});}"
          s=s.replace(anchor+route,anchor)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/readback-wq022-pages-once-v2-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js .github/workflows/readback-wq022-pages-once-v2-20260911.yml ops/readback/wq022-canonical-prepublish-20260911.json || true
          git commit -m 'Persist WQ022 canonical prepublish readback v2 and remove route' || true
          git pull --rebase origin main || true
          git push origin main || true
