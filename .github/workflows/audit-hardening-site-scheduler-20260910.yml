          new="function canonicalAdminPassed(request){return request.headers.get('x-wqw-canonical-admin')==='1'}\nfunction requireAdmin(request,env){return canonicalAdminPassed(request)?null:json({ok:false,error:'unauthorized'},401)}"
          if old in s:s=s.replace(old,new,1)
          old_health="if(url.pathname==='/api/health')return json({ok:true,project:PROJECT_ID,languages:LANGS,db:!!env.DB,r2:!!env.MEDIA,ai:!!env.AI,admin_secret:!!env.ADMIN_TOKEN,pinterest_model:PIN_MODEL});"
          if old_health in s:s=s.replace(old_health,"if(url.pathname==='/api/health')return json({ok:true});",1)
          p.write_text(s,encoding='utf-8')

          # Admin UI: add website date/time scheduler beside immediate publication.
          p=Path('admin/console/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('/admin/console/app.js?v=23','/admin/console/app.js?v=24')
          old='<div class="actions"><button id="sitePublishBtn" class="success">Опублікувати на сайт</button><button id="scheduleBtn">Перевірити готовність до постів</button></div><div id="sitePublishStatus" class="status">Перевіряю видимість статті…</div>'
          new='<div class="form2"><label>Дата публікації статті<input id="siteScheduleDate" type="date"></label><label>Час публікації статті<input id="siteScheduleTime" type="time" value="09:00"></label></div><div class="actions"><button id="sitePublishBtn" class="success">Опублікувати на сайт зараз</button><button id="siteScheduleBtn">Запланувати сайт</button><button id="siteScheduleCancelBtn" class="secondary" hidden>Скасувати план</button><button id="scheduleBtn">Перевірити готовність до постів</button></div><div id="sitePublishStatus" class="status">Перевіряю видимість статті…</div>'
          if old in s:s=s.replace(old,new,1)
          else: raise SystemExit('admin index scheduling block not found')
