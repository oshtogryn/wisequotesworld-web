name: Newsletter D1 repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-newsletter-python-verification.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch newsletter D1 schema helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/start_unified.js')
          s=p.read_text()
          a=s.index('async function ensureNewsletterTable(env)')
          b=s.index('\n\nexport async function newsletterApi',a)
          repl=Path('ops/newsletter_ensure_snippet.txt').read_text().rstrip()
          p.write_text(s[:a]+repl+s[b:])
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898242+github-actions[bot]@users.noreply.github.com'
          git add lib/start_unified.js
          git diff --cached --quiet || git commit -m 'Use prepared statements for newsletter D1 schema'
          git push
      - name: Verify live signup
        run: |
          sleep 45
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          u='https://wisequotesworld.com/api/newsletter/subscribe'
          for i in range(24):
              body=json.dumps({'email':'qa-newsletter-real-verified@example.invalid','language':'uk','company':''}).encode()
              req=urllib.request.Request(u,data=body,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  print(r.status,data)
                  if r.status==200 and data.get('ok') is True:
                      raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  print(e.code,e.read().decode(errors='replace'))
              time.sleep(5)
          raise SystemExit('newsletter signup verification failed')
          PY
