name: Patch admin and WQ022 source 2026-09-11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-wq022-source-20260911.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/console/app.js')
          s=p.read_text(encoding='utf-8')
          old="function renderTopics(){const q=($('topicSearch')?.value||'').trim().toLowerCase(),f=$('topicFilter')?.value||'';const rows=TOPICS.filter(x=>(!q||(`${x.id} ${x.canonical_title||''} ${x.author_name||''}`.toLowerCase().includes(q)))&&(!f||x.status===f));$('topicList').innerHTML=rows.map(topicCard).join('')||'<p class=\"muted\">Нічого не знайдено.</p>'}"
          new="function renderTopics(){const q=($('topicSearch')?.value||'').trim().toLowerCase(),f=$('topicFilter')?.value||'';const rows=TOPICS.filter(x=>(!q||(`${x.id} ${x.canonical_title||''} ${x.author_name||''}`.toLowerCase().includes(q)))&&(f?x.status===f:!['published','skipped'].includes(x.status)));$('topicList').innerHTML=rows.map(topicCard).join('')||'<p class=\"muted\">Нічого не знайдено.</p>'}"
          assert old in s
          s=s.replace(old,new,1)
          old2="$('contentList').innerHTML=ITEMS.map(x=>`<button class=\"rowbtn\" onclick=\"openItem('${x.id}')\"><b>${x.id}</b><span>${esc(x.canonical_title||'')}</span><span>${statusPill(x.status)}</span><span>${x.approved_at?'✓ approved':esc(x.attribution_status||'')}</span></button>`).join('');"
          new2="$('contentList').innerHTML=ITEMS.filter(x=>!['published','skipped'].includes(x.status)).map(x=>`<button class=\"rowbtn\" onclick=\"openItem('${x.id}')\"><b>${x.id}</b><span>${esc(x.canonical_title||'')}</span><span>${statusPill(x.status)}</span><span>${x.approved_at?'✓ approved':esc(x.attribution_status||'')}</span></button>`).join('');"
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          safe="A quiet late-1920s study with no living historical person on screen. A small static bronze museum bust of an early-20th-century theoretical physicist with unruly hair sits on a bookshelf in partial shadow and remains an inanimate sculpture throughout. Chalk equations reach the edge of a blackboard while an open window reveals a vast star field, making imagination the visual bridge beyond established knowledge."
          p=Path('lib/prepared_batch_018_026.js')
          s=p.read_text(encoding='utf-8')
          candidates=[
            "Einstein in a quiet 1929 study, recognizably rendered in a dignified editorial portrait. Chalk equations stop at the edge of a board while a window opens onto a vast star field, making imagination the bridge beyond known facts.",
            "Einstein in a quiet 1929 study. Chalk equations stop at the edge of a board while a window opens onto a vast star field, making imagination the bridge beyond known facts."
          ]
          old=next((x for x in candidates if x in s),None)
          assert old
          s=s.replace(old,safe,1)
          p.write_text(s,encoding='utf-8')

          p=Path('lib/prepared_buffer_022_031.js')
          s=p.read_text(encoding='utf-8')
          old="Einstein in a quiet 1929 study. Chalk equations end at the edge of a board while an open window reveals a vast star field, making imagination the bridge beyond known facts."
          assert old in s
          s=s.replace(old,safe,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check admin/console/app.js
          node --check lib/prepared_batch_018_026.js
          node --check lib/prepared_buffer_022_031.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/console/app.js lib/prepared_batch_018_026.js lib/prepared_buffer_022_031.js
          git commit -m 'Hide published skipped topics by default and fix WQ022 visual concept'
          git push
      - name: Remove one-off workflow
        if: always()
        run: |
          git pull --rebase || true
          rm -f .github/workflows/patch-admin-wq022-source-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/patch-admin-wq022-source-20260911.yml
          git commit -m 'Remove one-off admin WQ022 patch workflow' || true
          git push || true
