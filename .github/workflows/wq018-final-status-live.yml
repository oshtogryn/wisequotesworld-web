name: wq018-final-status-live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq018-final-status-live.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deploy
        run: sleep 25
      - name: Finalize and verify D1 statuses
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 \
            https://wisequotesworld.com/ops/finalize/wq017-wq018-7f2d9c41 \
            -o ops/readback/wq017-wq018-final-status.json
          cat ops/readback/wq017-wq018-final-status.json
          python3 - <<'PY'
          import json
          p='ops/readback/wq017-wq018-final-status.json'
          j=json.load(open(p))
          assert j.get('ok') is True, j
          rows={x['id']:x['status'] for x in j.get('after',[])}
          assert rows.get('WQ017')=='published', rows
          assert rows.get('WQ018')=='scheduled', rows
          print('VERIFIED', rows)
          PY
      - name: Commit readback
        run: |
          git config user.name oshtogryn
          git config user.email alex.shtogryn@gmail.com
          git add ops/readback/wq017-wq018-final-status.json
          git commit -m 'Read back WQ017 published and WQ018 scheduled' || exit 0
          git pull --rebase
          git push
