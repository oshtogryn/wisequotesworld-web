name: WQ014 export schedule payloads and clean temp routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq014-export-and-clean.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire temporary schedule export and remove finalize route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {finalizeWQ014} from './lib/wq014_finalize.js';\n",'',1)
          s=s.replace("if(url.pathname==='/ops/finalize/wq014'&&request.method==='POST')return json(await finalizeWQ014(env));",'',1)
          imp="import {exportWQ014Schedule} from './lib/wq014_schedule_export.js';\n"
          anchor="import {readbackWQ014Site} from './lib/wq014_site_publish.js';\n"
          route="const wq014Export=url.pathname.match(/^\\/ops\\/readback\\/wq014-schedule-(uk|ru|pl|en|sv|de|es|fr)\\.json$/);if(wq014Export&&request.method==='GET')return json(await exportWQ014Schedule(env,wq014Export[1]));"
          route_anchor="if(url.pathname==='/ops/readback/wq014-site.json'&&request.method==='GET')"
          if imp not in s:s=s.replace(anchor,anchor+imp,1)
          if route not in s:s=s.replace(route_anchor,route+route_anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Wire temporary WQ014 schedule export'
          git push
      - name: Wait for Cloudflare deploy
        run: sleep 30
      - name: Export D1 schedule data and verify approved media
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          for l in uk ru pl en sv de es fr; do
            curl -L -sS --retry 10 --retry-all-errors --retry-delay 5 "https://wisequotesworld.com/ops/readback/wq014-schedule-${l}.json" -o "ops/readback/WQ014-schedule-${l}.json"
            python - "$l" <<'PY'
          import json,sys,subprocess
          l=sys.argv[1]
          d=json.load(open(f'ops/readback/WQ014-schedule-{l}.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('approval')=='approved',d
          assert len(d.get('outputs',{}))==9,d
          for kind,url in d['media'].items():
              code=subprocess.check_output(['curl','-L','-sS','--retry','5','--retry-all-errors','--retry-delay','2','-o','/dev/null','-w','%{http_code}',url],text=True).strip()
              assert code=='200',(kind,url,code)
          print(l,'OK')
          PY
          done
          curl -L -sS --retry 10 --retry-all-errors --retry-delay 5 'https://wisequotesworld.com/ops/readback/wq014-production.json' -o ops/readback/WQ014-production-final.json
          python - <<'PY'
          import json
          p=json.load(open('ops/readback/WQ014-production-final.json',encoding='utf-8'))['production']
          assert p.get('ready_for_metricool') is True,p
          assert p.get('media_count')==16,p
          assert p.get('approval',{}).get('status')=='approved',p
          print('READY_FOR_METRICOOL')
          PY
      - name: Pull latest, remove temporary export route, commit readback
        run: |
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {exportWQ014Schedule} from './lib/wq014_schedule_export.js';\n",'',1)
          route="const wq014Export=url.pathname.match(/^\\/ops\\/readback\\/wq014-schedule-(uk|ru|pl|en|sv|de|es|fr)\\.json$/);if(wq014Export&&request.method==='GET')return json(await exportWQ014Schedule(env,wq014Export[1]));"
          s=s.replace(route,'',1)
          p.write_text(s,encoding='utf-8')
          PY
          git add _worker.js ops/readback/WQ014-schedule-*.json ops/readback/WQ014-production-final.json
          git commit -m 'Record WQ014 final schedule payloads and clean temp routes'
          git push
