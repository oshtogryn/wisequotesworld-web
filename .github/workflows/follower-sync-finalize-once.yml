name: Finalize and verify follower sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/follower-sync-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile static language totals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('start/localized.js').read_text()
          html=Path('start/index.html').read_text()
          langs=['uk','ru','pl','en','sv','de','es','fr']
          for lang in langs:
              m=re.search(rf'(?:^|[,\n\s]){lang}:\{{facebook:(\d+),instagram:(\d+),threads:(\d+),tiktok:(\d+),youtube:(\d+)\}}',js)
              if not m: raise SystemExit(f'Follower block missing for {lang}')
              total=sum(map(int,m.groups()))
              html,n=re.subn(rf'(<b data-total="{lang}">)[^<]+(</b>)',rf'\g<1>{total:,}\g<2>',html,count=1)
              if n!=1: raise SystemExit(f'data-total block missing for {lang}')
          Path('start/index.html').write_text(html)
          PY
      - name: Commit reconciliation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/follower-sync-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add start/index.html
          git commit -m 'Reconcile follower totals on start page'
          git push
      - name: Wait for Cloudflare production
        run: sleep 45
      - name: Verify production follower counters
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ips < <(getent ahostsv4 wisequotesworld.com 2>/dev/null | awk '{print $1}' | sort -u || true)
          if [[ "${#ips[@]}" -eq 0 ]]; then
            doh=$(curl -fsS --connect-timeout 10 --max-time 20 --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' 'https://cloudflare-dns.com/dns-query?name=wisequotesworld.com&type=A' || true)
            mapfile -t ips < <(printf '%s' "$doh" | jq -r '.Answer[]? | select(.type==1) | .data' 2>/dev/null | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u || true)
          fi
          [[ "${#ips[@]}" -gt 0 ]]
          resolve=(--resolve "wisequotesworld.com:443:${ips[0]}")
          fetch(){ curl "${resolve[@]}" -L -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$1"; }

          js=$(cat start/localized.js)
          version=$(grep -oE 'localized\.js\?v=[0-9-]+' uk/start/index.html | head -1 | cut -d= -f2)
          [[ -n "$version" ]]

          start=$(fetch "https://wisequotesworld.com/start/?rb=$(date +%s)")
          for lang in uk ru pl en sv de es fr; do
            m=$(printf '%s' "$js" | grep -oE "${lang}:\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}" | head -1)
            [[ -n "$m" ]]
            mapfile -t vals < <(printf '%s' "$m" | grep -oE ':[0-9]+' | tr -d ':')
            total=0; for v in "${vals[@]}"; do total=$((total+v)); done
            formatted=$(printf "%'d" "$total")
            grep -Fq "data-total=\"$lang\">$formatted</b>" <<<"$start"
            page=$(fetch "https://wisequotesworld.com/$lang/start/?rb=$(date +%s)")
            for v in "${vals[@]}"; do grep -Fq "<small>${v} " <<<"$page"; done
          done

          livejs=$(fetch "https://wisequotesworld.com/start/localized.js?v=$version&rb=$(date +%s)")
          for lang in uk ru pl en sv de es fr; do
            token=$(printf '%s' "$js" | grep -oE "${lang}:\{facebook:[0-9]+,instagram:[0-9]+,threads:[0-9]+,tiktok:[0-9]+,youtube:[0-9]+\}" | head -1)
            grep -Fq "$token" <<<"$livejs"
          done
          echo 'overall=PASS'
