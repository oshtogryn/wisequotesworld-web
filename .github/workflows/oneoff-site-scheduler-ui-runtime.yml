name: One-off site scheduler UI/runtime patch
on:
  push:
    paths:
      - '.github/workflows/oneoff-site-scheduler-ui-runtime.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Any existing approved website-visibility EXISTS gains a second condition:
          # a D1 schedule becomes visible as soon as its UTC due time is reached.
          pat=re.compile(r"EXISTS\s*\(SELECT 1 FROM content_approvals\s+(\w+)\s+WHERE\s+\1\.content_item_id=ci\.id\s+AND\s+\1\.approval_scope='website_visibility'(?:\s+AND\s+\1\.language_code IS NULL)?\s+AND\s+\1\.status='approved'\)")
          for f in ['lib/start_unified.js','lib/site_v2.js','lib/taxonomy_site.js']:
              p=Path(f); s=p.read_text()
              if 'website_publication_schedule ws' not in s:
                  def repl(m):
                      return "("+m.group(0)+" OR EXISTS(SELECT 1 FROM website_publication_schedule ws WHERE ws.content_item_id=ci.id AND ws.project_id='wisequotesworld' AND ws.status='scheduled' AND ws.scheduled_for<=strftime('%Y-%m-%dT%H:%M:%fZ','now')))"
                  s2,n=pat.subn(repl,s)
                  if n<1: raise SystemExit(f'missing visibility predicate in {f}')
                  p.write_text(s2)

          p=Path('admin/console/index.html'); s=p.read_text()
          s=s.replace('/admin/console/app.js?v=23','/admin/console/app.js?v=24')
          old='<div class="actions"><button id="sitePublishBtn" class="success">Опублікувати на сайт</button><button id="scheduleBtn">Перевірити готовність до постів</button></div><div id="sitePublishStatus" class="status">Перевіряю видимість статті…</div>'
          new='<div class="form2"><label>Дата публікації статті<input id="siteScheduleDate" type="date"></label><label>Час публікації статті<input id="siteScheduleTime" type="time" value="09:00"></label></div><div class="actions"><button id="sitePublishBtn" class="success">Опублікувати на сайт зараз</button><button id="siteScheduleBtn">Запланувати сайт</button><button id="siteScheduleCancelBtn" class="secondary" hidden>Скасувати план</button><button id="scheduleBtn">Перевірити готовність до постів</button></div><div id="sitePublishStatus" class="status">Перевіряю видимість статті…</div>'
          if 'siteScheduleBtn' not in s:
              if old not in s: raise SystemExit('missing site controls block')
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('admin/console/app.js'); s=p.read_text()
          if 'async function scheduleSite()' not in s:
              anchor='async function publishSite(){'
              if anchor not in s: raise SystemExit('missing publishSite')
              add="""async function scheduleSite(){const id=$('scheduleTopic')?.value,d=$('siteScheduleDate')?.value,t=$('siteScheduleTime')?.value||'09:00';if(!id||!d)return flash('Вибери дату публікації сайту');const local=new Date(`${d}T${t}:00`);if(!Number.isFinite(local.getTime()))return flash('Некоректна дата/час');const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Stockholm';if(!await modalConfirm('Запланувати публікацію на сайт?',`${id}: стане видимою ${local.toLocaleString('uk-UA')} (${timezone}). Соцмережі ця дія не планує.`))return;const btn=$('siteScheduleBtn');setBusy(btn,true,'Планую…');try{await api('/api/admin/site-visibility/'+id+'/schedule',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scheduled_for:local.toISOString(),timezone})});setBusy(btn,false);markDone(btn,'Заплановано ✓');flash(`${id}: сайт заплановано`);await loadSiteVisibility()}catch(e){setBusy(btn,false);$('sitePublishStatus').className='status bad';$('sitePublishStatus').textContent=e.message}}\nasync function cancelSiteSchedule(){const id=$('scheduleTopic')?.value;if(!id)return;if(!await modalConfirm('Скасувати план сайту?',`${id}: запланована видимість буде скасована.`))return;try{await api('/api/admin/site-visibility/'+id+'/cancel-schedule',{method:'POST'});flash(`${id}: план сайту скасовано`);await loadSiteVisibility()}catch(e){$('sitePublishStatus').className='status bad';$('sitePublishStatus').textContent=e.message}}\n"""
              s=s.replace(anchor,add+anchor)
          old="$('sitePublishBtn').onclick=publishSite;$('scheduleBtn').onclick=checkSchedule;"
          new="$('sitePublishBtn').onclick=publishSite;$('siteScheduleBtn').onclick=scheduleSite;$('siteScheduleCancelBtn').onclick=cancelSiteSchedule;$('scheduleBtn').onclick=checkSchedule;"
          if "$('siteScheduleBtn').onclick" not in s:
              if old not in s: raise SystemExit('missing handler block')
              s=s.replace(old,new)
          marker="const j=await api('/api/admin/site-visibility/'+id),v=!!j.state?.visible;"
          if 'const sc=j.state?.schedule' not in s:
              if marker not in s: raise SystemExit('missing loadSiteVisibility fetch')
              s=s.replace(marker,marker+"const sc=j.state?.schedule;")
              oldstatus="box.textContent=v?`${id}: стаття видима на сайті й бере участь у Latest.`:`${id}: стаття індексується за прямим URL, але прихована з навігації та Latest.`;"
              newstatus="box.textContent=v?`${id}: стаття видима на сайті й бере участь у Latest.`:(sc?.status==='scheduled'?`${id}: сайт заплановано на ${new Date(sc.scheduled_for).toLocaleString('uk-UA')} (${sc.timezone||'Europe/Stockholm'}).`:`${id}: стаття індексується за прямим URL, але прихована з навігації та Latest.`);if($('siteScheduleCancelBtn'))$('siteScheduleCancelBtn').hidden=!(sc?.status==='scheduled');"
              if oldstatus in s:s=s.replace(oldstatus,newstatus)
          p.write_text(s)
          PY
          node --check admin/console/app.js
          node --check lib/start_unified.js
          node --check lib/site_v2.js
          node --check lib/taxonomy_site.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/start_unified.js lib/site_v2.js lib/taxonomy_site.js admin/console/index.html admin/console/app.js
          git commit -m 'Wire website schedule into navigation and admin UI'
          git push
