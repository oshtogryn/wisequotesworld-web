name: Sync start runtime followers

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-start-runtime-followers.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update runtime follower counters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('lib/start_unified.js')
          s=p.read_text()
          new="const FOLLOWERS={uk:{facebook:10,instagram:938,threads:43,tiktok:58,youtube:38},ru:{facebook:7,instagram:44,threads:13,tiktok:93,youtube:104},pl:{facebook:17,instagram:17,threads:6,tiktok:40,youtube:37},en:{facebook:13,instagram:17,threads:10,tiktok:34,youtube:34},sv:{facebook:4,instagram:9,threads:6,tiktok:11,youtube:4},de:{facebook:19,instagram:105,threads:4,tiktok:68,youtube:24},es:{facebook:28,instagram:195,threads:3,tiktok:14,youtube:100},fr:{facebook:1,instagram:0,threads:0,tiktok:7,youtube:23}};"
          s,n=re.subn(r"const FOLLOWERS=\{[^\n]+\};",new,s,count=1)
          if n != 1:
              raise SystemExit('FOLLOWERS token not found exactly once')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/start_unified.js
          if git diff --cached --quiet; then
            echo 'Runtime followers already current.'
            exit 0
          fi
          git commit -m 'Sync production start follower counters'
          git push
