<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes — Website Publication</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f2ed}*{box-sizing:border-box}body{margin:0}.top{background:#111;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #ccc}select{width:100%}button{cursor:pointer;background:#111;color:#fff}.secondary{background:#fff;color:#111}.status{padding:10px 12px;border-radius:10px;background:#f2f2f2;margin-top:12px}.ok{background:#e8f7ed}.bad{background:#fdeaea}.warn{background:#fff4d8}.muted{color:#666}.langs{display:grid;gap:10px}.row{display:grid;grid-template-columns:70px 110px 1fr 110px;gap:10px;align-items:center;border:1px solid #e5e5e5;border-radius:14px;padding:12px}.pill{padding:6px 9px;border-radius:999px;background:#eee;text-align:center;font-size:13px}.pill.ok{background:#daf1df}.pill.bad{background:#fdeaea}.issues{font-size:12px;color:#666;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:760px){.row{grid-template-columns:55px 1fr}.row>*:nth-child(n+3){grid-column:2}.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><strong>Wise Quotes — Website Publication</strong><a href="/admin/console/">← Production Admin</a></header><main class="wrap"><section class="card"><div class="grid"><label>Тема<br><select id="topic"></select></label><div class="actions"><button id="load" class="secondary">Оновити</button><button id="publishAll">Опублікувати 13 мов</button></div></div><div id="summary" class="status">Підключення через Cloudflare Access…</div></section><section class="card"><h2>13-locale website gate</h2><p class="muted">Публікація йде тільки через canonical publication engine. Усі 13 локалізацій мають пройти native QA, SEO/slug та article reflection gate. Social scheduling цим не запускається.</p><div id="langs" class="langs"></div></section></main><script>const LANGS=['uk','ru','pl','en','sv','de','es','fr','it','pt','id','tr','ar'];async function api(path,opt={}){opt.credentials='same-origin';const r=await fetch(path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function topics(){const j=await api('/api/admin/content');topic.innerHTML=(j.items||[]).map(x=>`<option value="${x.id}">${x.id} — ${esc(x.canonical_title||'')}</option>`).join('');const q=new URLSearchParams(location.search).get('id');if(q&&[...topic.options].some(o=>o.value===q))topic.value=q;if(topic.options.length)await loadTopic()}async function loadTopic(){const id=topic.value;if(!id)return;summary.className='status';summary.textContent=id+': перевіряю 13-locale readiness…';const r=await api(`/api/admin/publication/${id}/website/readiness`);window._ready=r;publishAll.disabled=!r.ready;langs.innerHTML=(r.languages||[]).map(x=>`<div class="row"><b>${x.language.toUpperCase()}</b><span class="pill ${x.ready?'ok':'bad'}">${x.ready?'READY':'BLOCKED'}</span><span class="issues">${x.issues?.length?esc(x.issues.join(', ')):'усі перевірки пройдено'}${x.reflection_words!=null?` · ${x.reflection_words} words`:''}</span><span>${esc(x.page_status||'—')}</span></div>`).join('');summary.className='status '+(r.ready?'ok':'bad');summary.textContent=r.ready?`${id}: READY 13/13. Можна публікувати на сайт.`:`${id}: BLOCKED. ${r.source_ok?'Source ✓':'Source ✗'} · Ready ${(r.languages||[]).filter(x=>x.ready).length}/13`;}async function publishWebsite(){const id=topic.value;if(!id||!window._ready?.ready)return;publishAll.disabled=true;publishAll.textContent='Публікую…';try{const r=await api(`/api/admin/publication/${id}/website`,{method:'POST'});if(!r.published)throw new Error('Publication gate rejected');let verified=0;for(const u of r.article_urls||[]){try{const x=await fetch(u,{cache:'no-store'});if(x.ok)verified++}catch{}}summary.className='status '+(verified===13?'ok':'warn');summary.textContent=`${id}: Published 13/13 · URL readback ${verified}/13`;publishAll.textContent='Опубліковано ✓';setTimeout(()=>{publishAll.textContent='Опублікувати 13 мов';loadTopic()},1500)}catch(e){summary.className='status bad';summary.textContent=e.message;publishAll.textContent='Опублікувати 13 мов';publishAll.disabled=false}}load.onclick=loadTopic;topic.onchange=loadTopic;publishAll.onclick=publishWebsite;topics().catch(e=>{summary.className='status bad';summary.textContent=e.message});</script></body></html>
