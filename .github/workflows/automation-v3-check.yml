name: production-check

on:
  push:
    branches: [main, automation-v3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: |
          node --check _worker.js
          node --check _worker_legacy.js
          node --check lib/publication_core.js
          node --check lib/production_console_api.js
          node --check lib/site_v2.js
          node --check lib/sitemap_runtime.js
          node --check lib/canonical_rules.js
          node --check admin/console/app.js
      - name: Run D1 migration and guardrail smoke tests
        run: python3 tests/db_smoke.py
      - name: Live WQ020 scheduled D1 readback
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            body=$(curl -fsSL --max-time 20 -A 'Mozilla/5.0' 'https://wisequotesworld.com/ops/readback/wq014-prompts.json' || true)
            echo "$body" > /tmp/wq020-live.json
            if python3 - <<'PY'
import json,sys
try:
 d=json.load(open('/tmp/wq020-live.json',encoding='utf-8'))
 ok=d.get('wq020',{}).get('status')=='scheduled' and d.get('latest_history',{}).get('to_status')=='scheduled'
 print('wq020=',d.get('wq020'),'history=',d.get('latest_history'))
 sys.exit(0 if ok else 1)
except Exception as e:
 print(e);sys.exit(1)
PY
            then
              echo 'WQ020 LIVE D1 scheduled readback VERIFIED'
              exit 0
            fi
            sleep 10
          done
          echo 'WQ020 scheduled readback did not verify in time'
          cat /tmp/wq020-live.json || true
          exit 1
