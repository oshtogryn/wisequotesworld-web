name: Mark WQ020 scheduled 2026-09-08
on:
  push:
    paths:
      - '.github/workflows/mark-wq020-scheduled-20260908.yml'
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark WQ020 scheduled and verify D1
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"status":"scheduled","notes":"Metricool Planner readback confirmed 64/64 scheduled for 2026-09-08; minimum 15-minute cross-locale spacing per platform verified."}' \
            'https://wisequotesworld.com/api/admin/topics/WQ020/status' \
            -o /tmp/mark.json
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            'https://wisequotesworld.com/api/admin/topics' \
            -o /tmp/topics.json
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            'https://wisequotesworld.com/api/admin/topics/WQ020/history' \
            -o /tmp/history.json
          python - <<'PY'
          import json
          mark=json.load(open('/tmp/mark.json',encoding='utf-8'))
          topics=json.load(open('/tmp/topics.json',encoding='utf-8'))
          history=json.load(open('/tmp/history.json',encoding='utf-8'))
          assert mark.get('ok') is True, mark
          assert mark.get('status')=='scheduled', mark
          item=next(x for x in topics.get('items',[]) if x.get('id')=='WQ020')
          assert item.get('status')=='scheduled', item
          assert history.get('history') and history['history'][0].get('to_status')=='scheduled', history
          out={'mark':mark,'item':item,'latest_history':history['history'][0]}
          open('ops/readback/wq020-scheduled-state-20260908.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print('WQ020 D1 status=scheduled verified')
          PY
      - name: Commit D1 scheduled readback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq020-scheduled-state-20260908.json
          git commit -m 'Record WQ020 scheduled D1 readback' || true
          git push
