name: Install taxonomy SEO renderer
on:
  push:
    paths:
      - 'ops/TAXONOMY_SITE_TRIGGER'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker with assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          imp="import {locale13Site} from './lib/locale13_site.js';"
          newimp=imp+"\nimport {taxonomySite} from './lib/taxonomy_site.js';"
          if "import {taxonomySite} from './lib/taxonomy_site.js';" not in s:
              assert imp in s, 'locale13 import anchor missing'
              s=s.replace(imp,newimp,1)
          anchor="const startResponse=await startUnified(request,env);if(startResponse)return withLocaleTracking(startResponse,url);const locale13Response=await locale13Site(request,env);"
          replacement="const startResponse=await startUnified(request,env);if(startResponse)return withLocaleTracking(startResponse,url);const taxonomyResponse=await taxonomySite(request,env);if(taxonomyResponse)return withLocaleTracking(taxonomyResponse,url);const locale13Response=await locale13Site(request,env);"
          if "const taxonomyResponse=await taxonomySite(request,env);" not in s:
              assert anchor in s, 'runtime route anchor missing'
              s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Syntax validation
        run: |
          node --check _worker.js
          node --check lib/taxonomy_site.js
          node --check lib/taxonomy_seo.js
          grep -F "import {taxonomySite} from './lib/taxonomy_site.js';" _worker.js
          grep -F "const taxonomyResponse=await taxonomySite(request,env);" _worker.js
      - name: Commit guarded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route taxonomy pages through unified SEO renderer'
          git push
