name: WQ followers refresh once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq-followers-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update follower sources and start totals
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Europe/Stockholm
          version=$(date +%Y%m%d-%H%M)
          export WQ_VERSION="$version"
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          followers={
            'uk':{'facebook':10,'instagram':938,'threads':43,'tiktok':58,'youtube':40},
            'ru':{'facebook':8,'instagram':44,'threads':13,'tiktok':93,'youtube':104},
            'pl':{'facebook':17,'instagram':17,'threads':6,'tiktok':40,'youtube':38},
            'en':{'facebook':17,'instagram':18,'threads':10,'tiktok':36,'youtube':34},
            'sv':{'facebook':4,'instagram':9,'threads':6,'tiktok':11,'youtube':4},
            'de':{'facebook':19,'instagram':106,'threads':4,'tiktok':74,'youtube':25},
            'es':{'facebook':39,'instagram':197,'threads':2,'tiktok':16,'youtube':108},
            'fr':{'facebook':2,'instagram':0,'threads':0,'tiktok':9,'youtube':32},
          }
          langs=list(followers)
          compact=','.join(f"{l}:{{facebook:{followers[l]['facebook']},instagram:{followers[l]['instagram']},threads:{followers[l]['threads']},tiktok:{followers[l]['tiktok']},youtube:{followers[l]['youtube']}}}" for l in langs)

          p=Path('start/localized.js')
          s=p.read_text()
          new_block="  const S={\n    "+compact+"\n  };"
          s2,n=re.subn(r"  const S=\{.*?\n  \};",new_block,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not replace start/localized.js follower object')
          p.write_text(s2)

          p=Path('lib/start_unified.js')
          s=p.read_text()
          new_followers="const FOLLOWERS={"+compact+"};"
          s2,n=re.subn(r"const FOLLOWERS=\{.*?\};",new_followers,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Could not replace lib/start_unified.js FOLLOWERS')
          p.write_text(s2)

          totals={l:sum(followers[l].values()) for l in langs}
          p=Path('start/index.html')
          s=p.read_text()
          for l,total in totals.items():
            repl=f'<b data-total="{l}">{total:,}</b>'
            s,n=re.subn(rf'<b data-total="{l}">[^<]*</b>',repl,s,count=1)
            if n!=1: raise SystemExit(f'Could not update /start total for {l}')
          p.write_text(s)

          version=os.environ['WQ_VERSION']
          for l in langs:
            p=Path(l)/'start'/'index.html'
            s=p.read_text()
            s2,n=re.subn(r'/start/localized\.js\?v=[0-9-]+',f'/start/localized.js?v={version}',s,count=1)
            if n!=1: raise SystemExit(f'Could not bump cache version for {l}')
            p.write_text(s2)
          PY
          rm -f .github/workflows/wq-followers-refresh-once.yml
      - name: Commit follower refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add start/localized.js lib/start_unified.js start/index.html \
            uk/start/index.html ru/start/index.html pl/start/index.html en/start/index.html \
            sv/start/index.html de/start/index.html es/start/index.html fr/start/index.html \
            .github/workflows/wq-followers-refresh-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Wise Quotes follower counts'
          git push
