          new_gate="if(isAdminPath(url.pathname)){const cleanHeaders=new Headers(request.headers);cleanHeaders.delete('x-wqw-canonical-admin');request=new Request(request,{headers:cleanHeaders});const denied=await requireAdmin(request,env);if(denied)return denied;const headers=new Headers(request.headers);headers.set('x-wqw-canonical-admin','1');request=new Request(request,{headers})}if(url.pathname==='/api/admin/health'&&request.method==='GET')return json({ok:true,project:'wisequotesworld',db:!!env.DB,r2:!!env.MEDIA,ai:!!env.AI,access:true});if(request.method==='GET'&&!isAdminPath(url.pathname)){try{const wr=await releaseDueWebsitePublications(env,20);if(wr.released?.length)scheduleIndexNow(ctx,submitRecentPublished(env,25))}catch{}}"
