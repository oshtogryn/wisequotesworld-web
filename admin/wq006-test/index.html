<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WQ006 Preview Test</title><style>body{font-family:system-ui;margin:0;background:#f4f4f2;color:#111}.w{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:24px;padding:22px;margin:18px 0}input,button{font:inherit;width:100%;box-sizing:border-box;padding:15px;border-radius:14px;border:1px solid #ccc;margin:8px 0}button{font-weight:700;background:#111;color:#fff}.secondary{background:#333}.status{padding:16px;border-radius:14px;background:#eee;font-weight:700;white-space:pre-wrap}.ok{background:#dff7e6}.bad{background:#ffe1e1}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#111;color:#eee;padding:14px;border-radius:14px}small{color:#666}</style></head><body><div class="w"><h1>Wise Quotes — WQ006 Preview Test</h1><div class="card"><label>Preview ADMIN_TOKEN</label><input id="t" type="password" autocomplete="off" placeholder="Token"><button id="seed">1. Seed WQ006 — 8 languages</button><button id="pin" class="secondary">2. Generate first Pinterest EN image</button><div id="s" class="status">Waiting for action…</div><small>Nothing is published. Step 1 writes only Preview D1. Step 2 uses Workers AI and stores the generated image in Preview R2 with QA pending.</small></div><div class="card"><h2>Raw response</h2><pre id="o">—</pre></div></div><script>const s=document.getElementById('s'),o=document.getElementById('o'),t=document.getElementById('t');async function go(path){if(!t.value){s.className='status bad';s.textContent='TOKEN MISSING';return}s.className='status';s.textContent='Working…';o.textContent='—';try{const r=await fetch(new URL(path,location.origin).href,{method:'POST',headers:{Authorization:'Bearer '+t.value,Accept:'application/json','Content-Type':'application/json'},body:'{}'});const text=await r.text();o.textContent='HTTP '+r.status+' '+r.statusText+'\n\n'+text;let x=null;try{x=JSON.parse(text)}catch{}if(r.ok){s.className='status ok';if(path.includes('/seed'))s.textContent='SUCCESS — WQ006 SEEDED\nVersions: '+(x?.version_count??'?')+'/8\nQuote pages: '+(x?.page_count??'?')+'/8\nReady for Pinterest test: '+(x?.ready_for_first_pinterest_test?'YES':'NO');else s.textContent='SUCCESS — FIRST PINTEREST GENERATION REQUEST COMPLETED\nQA remains pending.'}else{s.className='status bad';s.textContent='ERROR HTTP '+r.status+' — '+(x?.error||text.slice(0,180)||'unknown error')}}catch(e){s.className='status bad';s.textContent='FETCH ERROR — '+e.name+': '+e.message;o.textContent=e.stack||String(e)}}document.getElementById('seed').onclick=()=>go('/api/admin/test/wq006/seed');document.getElementById('pin').onclick=()=>go('/api/admin/content/WQ006/pinterest/en/generate');</script></body></html>
