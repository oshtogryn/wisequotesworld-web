name: Install generic publication API
on:
  push:
    paths:
      - 'ops/GENERIC_PUBLICATION_TRIGGER'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker with assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          imp="import {analyticsEventsScript} from './lib/analytics_runtime.js';"
          newimp=imp+"\nimport {publicationApi} from './lib/publication_api.js';"
          if "import {publicationApi} from './lib/publication_api.js';" not in s:
              assert imp in s, 'analytics import anchor missing'
              s=s.replace(imp,newimp,1)
          anchor="const productionResponse=await productionConsoleApi(request,env);if(productionResponse){if(productionResponse.ok&&isMutation(request,url))scheduleIndexNow(ctx,submitRecentPublished(env,10));return productionResponse}"
          replacement="const publicationResponse=await publicationApi(request,env);if(publicationResponse){if(publicationResponse.ok&&isMutation(request,url))scheduleIndexNow(ctx,submitRecentPublished(env,10));return publicationResponse}"+anchor
          if "const publicationResponse=await publicationApi(request,env);" not in s:
              assert anchor in s, 'production API anchor missing'
              s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Syntax validation
        run: |
          node --check _worker.js
          node --check lib/publication_engine.js
          node --check lib/publication_api.js
          grep -F "import {publicationApi} from './lib/publication_api.js';" _worker.js
          grep -F "const publicationResponse=await publicationApi(request,env);" _worker.js
      - name: Commit guarded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Route generic website publication API'
          git push
