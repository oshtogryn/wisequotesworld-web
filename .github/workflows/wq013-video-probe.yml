name: WQ013 video probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe videos
        run: |
          set -x
          for l in uk ru pl en sv de es fr; do
            echo "=== $l ==="
            curl -sSIL --max-time 20 -A 'Mozilla/5.0' "https://wisequotesworld.com/media/approved/WQ013/$l/video.mp4" | sed -n '1,12p' || true
          done
