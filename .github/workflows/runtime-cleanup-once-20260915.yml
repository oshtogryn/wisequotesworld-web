name: Runtime cleanup once 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-cleanup-once-20260915.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale runtime mutation routes and sitemap side effects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')

          removals=[
            "import {applyWQ021030Fix} from './lib/wq021_030_prompt_status_fix_20260911.js';\n",
            "import {wq017ScheduleExport} from './lib/wq017_schedule_export.js';\n",
            "import {prepareFuturePreprod} from './lib/future_preprod.js';\n",
          ]
          for token in removals:
            s=s.replace(token,'')

          old="if(url.pathname==='/sitemap.xml'&&request.method==='GET'){scheduleIndexNow(ctx,submitAllPublished(env));return dynamicSitemap(env)}"
          new="if(url.pathname==='/sitemap.xml'&&request.method==='GET')return dynamicSitemap(env)"
          if old not in s:
            raise SystemExit('sitemap bulk-submit handler not found; refusing blind patch')
          s=s.replace(old,new,1)
          s=s.replace("import {submitAllPublished,submitRecentPublished} from './lib/indexnow_runtime.js';","import {submitRecentPublished} from './lib/indexnow_runtime.js';",1)

          stale_routes=[
            "if(url.pathname==='/ops/run/wq021-wq022-correction-20260911'&&request.method==='POST')return json(await applyWQ021030Fix(env));",
            "if(url.pathname==='/ops/run/future-preprod'&&request.method==='POST'){const r=json(await prepareFuturePreprod(env));if(r.ok&&isMutation(request,url))scheduleIndexNow(ctx,submitRecentPublished(env,10));return r}",
            "const wq017ExportResponse=await wq017ScheduleExport(request,env);if(wq017ExportResponse)return wq017ExportResponse;",
          ]
          missing=[]
          for token in stale_routes:
            if token not in s:
              missing.append(token[:80])
            s=s.replace(token,'',1)
          if missing:
            raise SystemExit('stale route anchor(s) missing: '+repr(missing))

          # Collapse obsolete repeated deploy markers while retaining one current marker.
          lines=s.splitlines()
          seen_future=False
          out=[]
          for line in lines:
            if line.strip()=='// deploy-marker: future-preprod-wq017-premedia-v1':
              if seen_future:
                continue
              seen_future=True
            out.append(line)
          s='\n'.join(out)+'\n'
          p.write_text(s,encoding='utf-8')

          p=Path('lib/security_headers.js')
          h=p.read_text(encoding='utf-8')
          old="headers.set('x-wqw-revision','p0-runtime-20260915');"
          new="headers.set('x-wqw-revision','p0-runtime-cleanup-20260915');"
          if old not in h:
            raise SystemExit('security revision anchor missing')
          p.write_text(h.replace(old,new,1),encoding='utf-8')

          p=Path('.github/workflows/production-smoke.yml')
          q=p.read_text(encoding='utf-8')
          old="grep -qi '^x-wqw-revision: p0-runtime-20260915' \"$headers\""
          new="grep -qi '^x-wqw-revision: p0-runtime-cleanup-20260915' \"$headers\""
          if old not in q:
            raise SystemExit('production smoke revision anchor missing')
          p.write_text(q.replace(old,new,1),encoding='utf-8')
          PY

          node --check _worker.js
          node --check lib/security_headers.js
          git diff --check

      - name: Commit runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js lib/security_headers.js .github/workflows/production-smoke.yml
          git commit -m 'fix: remove stale runtime mutation routes and sitemap side effect'
          git pull --rebase origin main
          git push

      - name: Wait for production deployment
        run: sleep 70

      - name: Production readback
        shell: bash
        run: |
          set -euo pipefail
          h=$(mktemp); b=$(mktemp)
          code=$(curl -sS --retry 4 --retry-all-errors --retry-delay 4 --connect-timeout 10 --max-time 30 -D "$h" -o "$b" -w '%{http_code}' 'https://wisequotesworld.com/en/')
          echo "public /en/ => $code"
          test "$code" = '200'
          grep -qi '^x-wqw-revision: p0-runtime-cleanup-20260915' "$h"

          code=$(curl -sS --retry 4 --retry-all-errors --retry-delay 4 --connect-timeout 10 --max-time 30 -o "$b" -w '%{http_code}' 'https://wisequotesworld.com/sitemap.xml')
          echo "sitemap => $code"
          test "$code" = '200'
          grep -q '<urlset' "$b"

          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' 'https://wisequotesworld.com/admin/')
          echo "anonymous admin => $code"
          test "$code" = '302'

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          rm -f .github/workflows/runtime-cleanup-once-20260915.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/runtime-cleanup-once-20260915.yml
          git commit -m 'chore: remove completed runtime cleanup workflow' || exit 0
          git push
