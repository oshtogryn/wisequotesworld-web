name: Finalize 13-locale Admin article rollout 2026-09-07
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-unify-admin-articles-20260907.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save D1 readback
        run: |
          mkdir -p ops/readback
          curl -L -sS --retry 12 --retry-all-errors --retry-delay 5 -X POST 'https://wisequotesworld.com/ops/run/unify-20260907' -o ops/readback/unify-admin-articles-nativeqa-20260907.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/unify-admin-articles-nativeqa-20260907.json',encoding='utf-8'))
          assert d.get('ok') is True
          assert len(d.get('settings',[]))==13
          assert d.get('qa_count')==130
          assert len(d.get('topics',[]))==10
          print('readback ok; 13 locale settings, 130 QA rows, 10 topics')
          PY
      - name: Verify live unified renderer
        run: |
          python - <<'PY'
          import urllib.request,time
          urls=[
            'https://wisequotesworld.com/it/quotes/nietzsche-why-to-live/',
          ]
          for url in urls:
            last=None
            for _ in range(12):
              try:
                with urllib.request.urlopen(url,timeout=20) as r:
                  html=r.read().decode('utf-8','replace')
                assert 'quote-card' in html and 'article-grid' in html
                assert '— Friedrich Nietzsche— Friedrich Nietzsche' not in html
                assert html.find('quote-card') < html.find('article-grid')
                print('verified',url)
                break
              except Exception as e:
                last=e; time.sleep(5)
            else:
              raise last
          PY
      - name: Remove temporary D1 write route
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          s=s.replace("\nimport {runUnify20260907} from './lib/unify_20260907.js';",'')
          s=s.replace("if(url.pathname==='/ops/run/unify-20260907'&&request.method==='POST')return json(await runUnify20260907(env));",'')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js ops/readback/unify-admin-articles-nativeqa-20260907.json
          git commit -m 'Finalize 13-locale rollout with D1 readback'
          git push
