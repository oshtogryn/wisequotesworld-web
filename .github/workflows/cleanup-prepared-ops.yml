name: Cleanup prepared ops
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-prepared-ops.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secure ops endpoints and remove one-time workflows
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js'); s=p.read_text()
          anchor="const newsletterResponse=await newsletterApi(request,env);if(newsletterResponse)return newsletterResponse;"
          guard="const sensitiveOps=url.pathname.startsWith('/ops/run/')||url.pathname.startsWith('/ops/readback/prepared')||url.pathname==='/ops/readback/editorial-status.json';if(sensitiveOps&&(!env.ADMIN_TOKEN||(request.headers.get('authorization')||'')!==`Bearer ${env.ADMIN_TOKEN}`))return json({ok:false,error:'unauthorized'},401);"
          assert anchor in s
          if guard not in s:s=s.replace(anchor,anchor+guard,1)
          marker='// deploy-marker: secure-prepared-ops-v1'
          if marker not in s:s=marker+'\n'+s
          p.write_text(s)
          PY
          rm -f .github/workflows/batch-018-026-prep.yml
          rm -f .github/workflows/batch-018-026-split.yml
          rm -f .github/workflows/prepared-quality-admin-verify.yml
          rm -f .github/workflows/prepared-quality-split-verify.yml
          rm -f .github/workflows/prepared-final-verify.yml
          rm -f .github/workflows/prepared-editorial-final.yml
          rm -f .github/workflows/probe-prepared-quality.yml
          rm -f .github/workflows/admin-topics-deploy.yml
          rm -f .github/workflows/cleanup-prepared-ops.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Secure prepared ops and remove one-time workflows'
          git push
