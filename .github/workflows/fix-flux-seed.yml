name: fix-flux-seed-once
on:
  push:
    branches: [automation-v3]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[flux-seed-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v3
      - name: Remove unsupported seed property from FLUX Schnell request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker_legacy.js')
          s=p.read_text()
          old="env.AI.run(PIN_MODEL,{prompt,seed:Math.floor(Math.random()*1000000)})"
          new="env.AI.run(PIN_MODEL,{prompt})"
          if old not in s:
              print('Already fixed or call shape changed.')
          else:
              p.write_text(s.replace(old,new))
              print('Removed unsupported seed property.')
          PY
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker_legacy.js
          git commit -m "fix: Workers AI FLUX request schema [flux-seed-fixed]"
          git push origin HEAD:automation-v3
