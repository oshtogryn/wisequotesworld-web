name: wq019-readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq019-readback.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deploy
        run: sleep 25
      - name: Probe schema
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 https://wisequotesworld.com/ops/schema/wq019-5bb7e2c1 -o /tmp/schema.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/schema.json'))
          assert j.get('ok') is True, j
          with open('ops/readback/wq019-schema.json','w') as f: json.dump(j,f,ensure_ascii=False,indent=2)
          PY
      - name: Commit schema
        run: |
          git config user.name oshtogryn
          git config user.email alex.shtogryn@gmail.com
          git add ops/readback/wq019-schema.json
          git commit -m 'Read WQ019 D1 schema' || exit 0
          git pull --rebase
          git push
