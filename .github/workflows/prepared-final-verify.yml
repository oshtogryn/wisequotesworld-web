name: Prepared final verify
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepared-final-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add temporary minimal status readback and deploy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js'); s=p.read_text()
          route="if(url.pathname==='/ops/readback/editorial-status.json'&&request.method==='GET'){const rows=(await env.DB.prepare(\"SELECT id,status,canonical_title FROM content_items WHERE project_id='wisequotesworld' AND CAST(SUBSTR(id,3) AS INTEGER) BETWEEN 15 AND 26 ORDER BY CAST(SUBSTR(id,3) AS INTEGER)\").all()).results||[];return json({ok:true,items:rows})}"
          anchor="if(url.pathname==='/ops/readback/prepared-quality.json'&&request.method==='GET')"
          assert anchor in s
          if route not in s:s=s.replace(anchor,route+anchor,1)
          marker='// deploy-marker: prepared-final-verify-v1'
          if marker not in s:s=marker+'\n'+s
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Add temporary editorial status readback'
          git push
      - name: Wait for deployment
        run: sleep 85
      - name: Reapply quality for edge-length topics
        run: |
          set -euo pipefail
          for id in WQ023 WQ025; do
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -L -sS --max-time 30 --retry 2 --retry-all-errors --retry-delay 2 -X POST "https://wisequotesworld.com/ops/run/prepared-quality/$id" -o /tmp/$id.json -w '%{http_code}' || true)
              cat /tmp/$id.json || true; echo
              if [ "$code" = "200" ] && ID="$id" python - <<'PY'
          import json,os
          d=json.load(open('/tmp/'+os.environ['ID']+'.json'))
          raise SystemExit(0 if d.get('ok') is True and d.get('readback',{}).get('ok') is True else 1)
          PY
              then ok=1; break; fi
              sleep 6
            done
            [ "$ok" = 1 ] || exit 1
          done
      - name: Final quality and status readback
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --max-time 30 --fail --retry 10 --retry-all-errors --retry-delay 4 'https://wisequotesworld.com/ops/readback/prepared-quality.json' -o ops/readback/prepared-quality-final.json
          curl -L -sS --max-time 30 --fail --retry 10 --retry-all-errors --retry-delay 4 'https://wisequotesworld.com/ops/readback/editorial-status.json' -o ops/readback/editorial-status-015-026.json
          python - <<'PY'
          import json
          q=json.load(open('ops/readback/prepared-quality-final.json'))
          assert q.get('ok') is True,q
          assert q.get('count')==9,q
          assert all(x.get('ok') for x in q['rows']),q
          s=json.load(open('ops/readback/editorial-status-015-026.json'))
          assert s.get('ok') is True,s
          rows={x['id']:x for x in s['items']}
          expected={'WQ015':'scheduled','WQ016':'skipped','WQ017':'media_pending',**{f'WQ{n:03d}':'media_pending' for n in range(18,27)}}
          for k,v in expected.items(): assert rows[k]['status']==v,(k,rows[k])
          print('FINAL QUALITY 9/9 PASS')
          print('EDITORIAL STATUS PASS')
          PY
          cat ops/readback/prepared-quality-final.json
          cat ops/readback/editorial-status-015-026.json
      - name: Save readbacks
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/prepared-quality-final.json ops/readback/editorial-status-015-026.json
          git commit -m 'Save final prepared topic and editorial status readbacks' || exit 0
          git push
