name: Accessibility hardening once 2026-09-15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/accessibility-hardening-once-20260915.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add skip links and ARIA menu state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Shared skip-link styling.
          p=Path('styles.css'); s=p.read_text(encoding='utf-8')
          anchor='a{color:inherit}'
          insert="a{color:inherit}.skip-link{position:fixed;left:12px;top:12px;z-index:9999;padding:10px 14px;border-radius:10px;background:var(--gold2);color:#111;text-decoration:none;font-weight:900;transform:translateY(-160%)}.skip-link:focus{transform:translateY(0)}"
          if '.skip-link{' not in s:
              if anchor not in s: raise SystemExit('styles anchor missing')
              s=s.replace(anchor,insert,1)
          p.write_text(s,encoding='utf-8')

          # site_v2: menu + language buttons and main target.
          p=Path('lib/site_v2.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('<body><header class="header">','<body><a class="skip-link" href="#main-content">Skip to content</a><header class="header">',1)
          s=s.replace('<button class="menu" aria-label="${esc(u.menuLabel)}">☰</button><nav class="navlinks">','<button class="menu" aria-label="${esc(u.menuLabel)}" aria-expanded="false" aria-controls="primary-nav">☰</button><nav class="navlinks" id="primary-nav">',1)
          s=s.replace('<div class="lang"><button aria-label="${esc(u.languageLabel)}">${FLAGS[locale]}</button><div class="langmenu">','<div class="lang"><button aria-label="${esc(u.languageLabel)}" aria-expanded="false" aria-controls="language-menu">${FLAGS[locale]}</button><div class="langmenu" id="language-menu">',1)
          s=s.replace("lb&&lb.addEventListener('click',()=>lm.classList.toggle('show'));const mb=document.querySelector('.menu'),nl=document.querySelector('.navlinks');mb&&mb.addEventListener('click',()=>nl.classList.toggle('open'));", "lb&&lb.addEventListener('click',()=>{const o=lm.classList.toggle('show');lb.setAttribute('aria-expanded',String(o))});const mb=document.querySelector('.menu'),nl=document.querySelector('.navlinks');mb&&mb.addEventListener('click',()=>{const o=nl.classList.toggle('open');mb.setAttribute('aria-expanded',String(o))});",1)
          s=s.replace('<main><section class="hero">','<main id="main-content"><section class="hero">')
          s=s.replace('<main><section class="section">','<main id="main-content"><section class="section">')
          p.write_text(s,encoding='utf-8')

          # it/pt renderer.
          p=Path('lib/new_locales_site.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('<body><header class="header">','<body><a class="skip-link" href="#main-content">Skip to content</a><header class="header">',1)
          s=s.replace('<button class="menu" aria-label="${esc(u.menuLabel)}">☰</button><nav class="navlinks">','<button class="menu" aria-label="${esc(u.menuLabel)}" aria-expanded="false" aria-controls="primary-nav">☰</button><nav class="navlinks" id="primary-nav">',1)
          s=s.replace('<div class="lang"><button aria-label="${esc(u.languageLabel)}">${FLAGS[locale]}</button><div class="langmenu">','<div class="lang"><button aria-label="${esc(u.languageLabel)}" aria-expanded="false" aria-controls="language-menu">${FLAGS[locale]}</button><div class="langmenu" id="language-menu">',1)
          s=s.replace("lb&&lb.addEventListener('click',()=>lm.classList.toggle('show'));const mb=document.querySelector('.menu'),nl=document.querySelector('.navlinks');mb&&mb.addEventListener('click',()=>nl.classList.toggle('open'));", "lb&&lb.addEventListener('click',()=>{const o=lm.classList.toggle('show');lb.setAttribute('aria-expanded',String(o))});const mb=document.querySelector('.menu'),nl=document.querySelector('.navlinks');mb&&mb.addEventListener('click',()=>{const o=nl.classList.toggle('open');mb.setAttribute('aria-expanded',String(o))});",1)
          s=s.replace('<main><section class="hero">','<main id="main-content"><section class="hero">')
          s=s.replace('<main><section class="section">','<main id="main-content"><section class="section">')
          s=s.replace('<main class="article-wrap">','<main id="main-content" class="article-wrap">')
          p.write_text(s,encoding='utf-8')

          # id/tr/ar renderer.
          p=Path('lib/locale13_site.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('</head><body>`','</head><body><a class="skip-link" href="#main-content">Skip to content</a>`',1)
          s=s.replace('<div class="lang"><button aria-label="Language">${FLAGS[lang]}</button><div class="langmenu">','<div class="lang"><button aria-label="Language" aria-expanded="false" aria-controls="language-menu">${FLAGS[lang]}</button><div class="langmenu" id="language-menu">',1)
          s=s.replace("lb&&lb.addEventListener('click',()=>lm.classList.toggle('show'));", "lb&&lb.addEventListener('click',()=>{const o=lm.classList.toggle('show');lb.setAttribute('aria-expanded',String(o))});",1)
          s=s.replace('<main class="locale13">','<main id="main-content" class="locale13">')
          p.write_text(s,encoding='utf-8')
          PY
          node --check lib/site_v2.js
          node --check lib/new_locales_site.js
          node --check lib/locale13_site.js
          git diff --check
      - name: Commit accessibility hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css lib/site_v2.js lib/new_locales_site.js lib/locale13_site.js
          git commit -m 'a11y: add skip navigation and menu state semantics'
          git pull --rebase origin main
          git push
      - name: Wait for production
        run: sleep 70
      - name: Verify accessibility markup live
        shell: bash
        run: |
          set -euo pipefail
          for locale in en it id ar; do
            body=$(mktemp)
            code=$(curl -sS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "https://wisequotesworld.com/$locale/")
            echo "$locale => $code"
            test "$code" = '200'
            grep -q 'class="skip-link" href="#main-content"' "$body"
            grep -q 'id="main-content"' "$body"
            grep -q 'aria-expanded="false"' "$body"
          done
