name: Security hardening once 2026-09-15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-hardening-once-20260915.yml'
permissions:
  contents: write
jobs:
  harden:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin Access audience and block pages.dev exposure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/admin_auth.js')
          s=p.read_text(encoding='utf-8')
          old="const DEFAULT_ACCESS_ISSUER='https://empty-flower-5659.cloudflareaccess.com';\n"
          new=old+"const DEFAULT_ACCESS_AUD='bc49d59f968b1e43fb58ad16f7a44e920e2494cf8df3fe75029c80b77d2b5f29';\n"
          if 'DEFAULT_ACCESS_AUD' not in s:
              if old not in s: raise SystemExit('issuer anchor missing')
              s=s.replace(old,new,1)
          old2="const expectedAud=String(env?.CF_ACCESS_AUD||env?.ACCESS_AUD||'').trim();\n  if(expectedAud){const aud=Array.isArray(payload.aud)?payload.aud:[payload.aud];if(!aud.includes(expectedAud))return null;}"
          new2="const expectedAud=String(env?.CF_ACCESS_AUD||env?.ACCESS_AUD||DEFAULT_ACCESS_AUD).trim();\n  if(!expectedAud)return null;\n  const aud=Array.isArray(payload.aud)?payload.aud:[payload.aud];if(!aud.includes(expectedAud))return null;"
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('audience validation anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          old="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);if(isAdminPath(url.pathname))"
          new="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);if(url.hostname.endsWith('.pages.dev'))return json({ok:false,error:'not_found'},404);if(isAdminPath(url.pathname))"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('worker host-guard anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
          node --check lib/admin_auth.js
          node --check _worker.js
          git diff --check
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/admin_auth.js _worker.js
          git commit -m 'security: pin Access audience and close pages.dev surface'
          git pull --rebase origin main
          git push
      - name: Wait for production
        run: sleep 70
      - name: Verify hardened production
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          code=$(curl -sS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' 'https://wisequotesworld.com/en/')
          echo "custom domain /en/ => $code"
          test "$code" = '200'
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' 'https://wisequotesworld.com/admin/')
          echo "anonymous admin => $code"
          test "$code" = '302'
          body=$(mktemp)
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' 'https://wisequotesworld.com/api/admin/health' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          echo "service admin health => $code"
          test "$code" = '200'
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body"
          for path in '/en/' '/admin/' '/api/admin/health' '/ops/'; do
            code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "https://wisequotesworld-web.pages.dev$path")
            echo "pages.dev $path => $code"
            test "$code" = '404'
          done
