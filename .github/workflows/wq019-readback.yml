name: wq019-readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq019-readback.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production deploy
        run: sleep 25
      - name: Apply WQ019 package and verify
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 -X POST https://wisequotesworld.com/ops/prepare/wq019-8a31df74 -o /tmp/apply.json
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 https://wisequotesworld.com/ops/export/wq019-31f6c8aa -o /tmp/readback.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/readback.json'))
          assert j.get('ok') is True and j.get('item',{}).get('id')=='WQ019', j
          langs=['uk','ru','pl','en','sv','de','es','fr','it']
          expected=['article_url','facebook','instagram','pinterest_description','pinterest_prompt','pinterest_title','threads','tiktok','website_reflection','youtube_description','youtube_title']
          summary={'ok':True,'item':j['item'],'languages':{}}
          for lang in langs:
            p=j['pack'][lang]
            keys=sorted(p.get('outputs',{}).keys())
            assert p.get('localized_quote'), (lang,'quote')
            assert p.get('video_prompt'), (lang,'video_prompt')
            assert p.get('outputs',{}).get('pinterest_prompt'), (lang,'pinterest_prompt')
            if lang=='it':
              assert keys==sorted(expected), keys
            summary['languages'][lang]={'quote':p['localized_quote'],'video_prompt':True,'pinterest_prompt':True,'output_keys':keys}
          with open('ops/readback/wq019-nine-language-ready.json','w') as f: json.dump(summary,f,ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit verification
        run: |
          git config user.name oshtogryn
          git config user.email alex.shtogryn@gmail.com
          git add ops/readback/wq019-nine-language-ready.json
          git commit -m 'Verify WQ019 nine-language package' || exit 0
          git pull --rebase
          git push
