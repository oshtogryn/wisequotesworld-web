name: Verify follower production once

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-follower-production-verify.txt'

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify production follower counters
        shell: bash
        env:
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_ID"
          test -n "$ACCESS_SECRET"
          fetch(){ curl -L -f -sS --connect-timeout 10 --max-time 30 --retry 12 --retry-all-errors --retry-delay 5 -H 'Cache-Control: no-cache' -H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET" "$1"; }
          stamp=$(date +%s)

          python - <<'PY' > /tmp/expected.tsv
          from pathlib import Path
          import re, ast
          s=Path('lib/start_unified.js').read_text()
          m=re.search(r"const FOLLOWERS=(\{[^\n]+\});",s)
          if not m: raise SystemExit('FOLLOWERS not found')
          raw=m.group(1)
          py=re.sub(r'([,{])([a-z]+):',r"\1'\2':",raw)
          d=ast.literal_eval(py)
          for lang,v in d.items():
              print(lang, v['facebook'], v['instagram'], v['threads'], v['tiktok'], v['youtube'], sep='\t')
          PY

          while IFS=$'\t' read -r lang fb ig th tt yt; do
            page=$(fetch "https://wisequotesworld.com/$lang/start/?follower-check=$stamp")
            grep -Fq "Facebook<small>$fb " <<<"$page"
            grep -Fq "Instagram<small>$ig " <<<"$page"
            grep -Fq "Threads<small>$th " <<<"$page"
            grep -Fq "TikTok<small>$tt " <<<"$page"
            grep -Fq "YouTube<small>$yt " <<<"$page"
          done < /tmp/expected.tsv

          js=$(fetch "https://wisequotesworld.com/start/localized.js?follower-check=$stamp")
          python - <<'PY' > /tmp/s-token
          from pathlib import Path
          import re
          s=Path('start/localized.js').read_text()
          m=re.search(r"const S=(\{.*?\n  \});",s,re.S)
          if not m: raise SystemExit('S not found')
          print(re.sub(r'\s+','',m.group(1)))
          PY
          expected=$(cat /tmp/s-token)
          live=$(printf '%s' "$js" | python -c "import sys,re; s=sys.stdin.read(); m=re.search(r'const S=(\\{.*?\\n  \\});',s,re.S); print(re.sub(r'\\s+','',m.group(1)) if m else '')")
          test -n "$live"
          test "$live" = "$expected"
          echo 'Follower production verification PASS'
