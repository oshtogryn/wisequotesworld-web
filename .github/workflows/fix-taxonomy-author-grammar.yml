name: Fix taxonomy author grammar
on:
  push:
    paths:
      - 'ops/TAXONOMY_GRAMMAR_TRIGGER'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch three inflected-language templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/taxonomy_seo.js')
          s=p.read_text()
          reps={
            "uk:{aq:n=>`Цитати ${n}`,ad:(n,c)=>`Добірка перевірених цитат ${n}: ${c} публікацій із поясненнями, контекстом і роздумами.`,ai:n=>`Зібрані в одному місці цитати ${n} з поясненнями, контекстом і посиланнями на повні роздуми.`":"uk:{aq:n=>`${n} — цитати`,ad:(n,c)=>`${n}: ${c} перевірених цитат із поясненнями, контекстом і роздумами.`,ai:n=>`${n}: добірка цитат із поясненнями, контекстом і посиланнями на повні роздуми.`",
            "ru:{aq:n=>`Цитаты ${n}`,ad:(n,c)=>`Подборка проверенных цитат ${n}: ${c} публикаций с объяснениями, контекстом и размышлениями.`,ai:n=>`Цитаты ${n}, собранные в одном месте, с объяснениями, контекстом и ссылками на полные материалы.`":"ru:{aq:n=>`${n} — цитаты`,ad:(n,c)=>`${n}: ${c} проверенных цитат с объяснениями, контекстом и размышлениями.`,ai:n=>`${n}: подборка цитат с объяснениями, контекстом и ссылками на полные материалы.`",
            "pl:{aq:n=>`Cytaty ${n}`,ad:(n,c)=>`Zbiór zweryfikowanych cytatów ${n}: ${c} publikacji z objaśnieniami, kontekstem i refleksjami.`,ai:n=>`Cytaty ${n} w jednym miejscu — z objaśnieniami, kontekstem i odnośnikami do pełnych refleksji.`":"pl:{aq:n=>`${n} — cytaty`,ad:(n,c)=>`${n}: ${c} zweryfikowanych cytatów z objaśnieniami, kontekstem i refleksjami.`,ai:n=>`${n}: cytaty w jednym miejscu — z objaśnieniami, kontekstem i odnośnikami do pełnych refleksji.`"
          }
          for old,new in reps.items():
              assert old in s, f'anchor missing: {old[:20]}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check lib/taxonomy_seo.js
          node --check lib/taxonomy_site.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/taxonomy_seo.js
          git commit -m 'Use natural author SEO phrasing for uk ru pl'
          git push
