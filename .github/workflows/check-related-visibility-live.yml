name: Check related visibility live
on:
  push:
    paths:
      - '.github/workflows/check-related-visibility-live.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait deploy
        run: sleep 15
      - name: Verify Lincoln related cards hide future topics
        run: |
          set -euo pipefail
          URL='https://wisequotesworld.com/uk/quotes/avraham-linkoln-pravda-daie-sylu/'
          HTML=$(curl --retry 5 --retry-all-errors --fail-with-body -sS "$URL")
          echo "$HTML" | grep -q 'Abraham Lincoln'
          ! echo "$HTML" | grep -q 'John F. Kennedy'
          ! echo "$HTML" | grep -q 'Michel de Montaigne'
          ! echo "$HTML" | grep -q 'Джон Ф. Кеннеді'
          ! echo "$HTML" | grep -q 'Мішель де Монтень'
          echo 'live related visibility OK'
