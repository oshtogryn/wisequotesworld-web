name: WQ013 live readback
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'lib/wq013_site_publish.js'
      - '.github/workflows/wq013-readback.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deployment
        run: sleep 50
      - name: Verify WQ013 D1 and 8 pages
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          code=$(curl --retry 3 --retry-delay 5 --max-time 30 -sS -w '%{http_code}' 'https://wisequotesworld.com/ops/readback/wq013-site.json' -o ops/readback/WQ013-site-d1.json || true)
          echo "HTTP=$code"
          cat ops/readback/WQ013-site-d1.json || true
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/WQ013-site-d1.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          item=d['item']
          assert item['id']=='WQ013'
          assert item['status']=='media_pending', item
          assert item['quote_type']=='verbatim', item
          assert item['author_name']=='Epictetus', item
          assert item['attribution_status']=='verified', item
          pages=d['pages']; assert len(pages)==8, pages
          assert all(x['status']=='published' for x in pages), pages
          prior=d['prior']; assert all(x['status']=='published' for x in prior), prior
          open('/tmp/wq013_paths','w').write('\n'.join(x['canonical_path'] for x in pages))
          PY
          while IFS= read -r path; do
            code=$(curl -A 'Mozilla/5.0' -L --retry 3 --retry-delay 3 --max-time 30 -sS -o /dev/null -w '%{http_code}' "https://wisequotesworld.com${path}" || true)
            echo "$path -> $code"
            test "$code" = "200"
          done < /tmp/wq013_paths
          echo 'PASS WQ013: item media_pending, 8/8 site pages published/live, prior topics published'
      - name: Commit readback
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/readback/WQ013-site-d1.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record WQ013 live readback'
          git push