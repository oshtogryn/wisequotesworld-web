name: Verify WQ021-WQ030 canonical readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wq021-wq030-readback-20260911.yml'
permissions:
  contents: write
concurrency:
  group: verify-wq021-wq030-readback-20260911
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install temporary read-only D1 route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__verify_21_30_20260911_a4c971'&&request.method==='GET'){const ids=['WQ022','WQ023','WQ024','WQ025','WQ026','WQ027','WQ028','WQ029','WQ030'];const item21=await env.DB.prepare(\"SELECT id,status,updated_at FROM content_items WHERE project_id='wisequotesworld' AND id='WQ021'\").first();const rows=[];for(const id of ids){const item=await env.DB.prepare(\"SELECT id,status,quote_type,author_name,attribution_status,facts_verified FROM content_items WHERE project_id='wisequotesworld' AND id=?\").bind(id).first();const pages=await env.DB.prepare(\"SELECT COUNT(*) c FROM quote_pages WHERE project_id='wisequotesworld' AND content_item_id=? AND status='published'\").bind(id).first();const outs=await env.DB.prepare(\"SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id=? AND TRIM(COALESCE(output_text,''))<>''\").bind(id).first();const qa=await env.DB.prepare(\"SELECT COUNT(*) c FROM content_versions WHERE content_id=? AND language_check_status='native_qa_pass'\").bind(id).first();const vp=await env.DB.prepare(\"SELECT COUNT(*) c FROM content_versions WHERE content_id=? AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND TRIM(COALESCE(ai_prompt,''))<>''\").bind(id).first();const pp=await env.DB.prepare(\"SELECT COUNT(*) c FROM content_outputs WHERE project_id='wisequotesworld' AND content_item_id=? AND output_key='pinterest_prompt' AND TRIM(COALESCE(output_text,''))<>''\").bind(id).first();rows.push({...item,published_pages:Number(pages?.c||0),outputs:Number(outs?.c||0),native_qa:Number(qa?.c||0),video_prompts:Number(vp?.c||0),pinterest_prompts:Number(pp?.c||0)});}const prompts=(await env.DB.prepare(\"SELECT language_code,ai_prompt FROM content_versions WHERE content_id='WQ022' AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND version=(SELECT MAX(v2.version) FROM content_versions v2 WHERE v2.content_id='WQ022' AND v2.language_code=content_versions.language_code) ORDER BY language_code\").all()).results||[];const safe=prompts.length===8&&prompts.every(x=>String(x.ai_prompt||'').includes('No historical person, portrait, face, human figure, bust, sculpture, painting, photograph, or likeness of the quoted author appears anywhere.')&&!String(x.ai_prompt||'').includes('Einstein in a quiet'));return json({ok:item21?.status==='published'&&rows.length===9&&rows.every(r=>r.published_pages===13&&r.outputs>=88&&r.native_qa>=13&&r.video_prompts===8&&r.pinterest_prompts===8)&&safe,wq021:item21,rows,wq022_prompt_safe:safe,wq022_prompt_languages:prompts.map(x=>x.language_code),wq022_prompt_samples:prompts.map(x=>({language:x.language_code,sample:String(x.ai_prompt||'').slice(0,180)}))});}"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose temporary WQ021-WQ030 readback route'
          for i in $(seq 1 12); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 1
      - name: Wait for exact deployment marker and capture readback
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          URL='https://wisequotesworld-web.pages.dev/__verify_21_30_20260911_a4c971'
          for i in $(seq 1 72); do
            code=$(curl -sS --max-time 20 -o ops/readback/wq021-wq030-verify-20260911.json -w '%{http_code}' "$URL" || true)
            if [ "$code" = '200' ] && grep -q '"wq021"' ops/readback/wq021-wq030-verify-20260911.json; then break; fi
            sleep 10
          done
          cat ops/readback/wq021-wq030-verify-20260911.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq021-wq030-verify-20260911.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('wq021',{}).get('status')=='published',d
          assert d.get('wq022_prompt_safe') is True,d
          rows=d.get('rows') or []
          assert len(rows)==9,rows
          for r in rows:
              assert r['published_pages']==13,r
              assert r['outputs']>=88,r
              assert r['native_qa']>=13,r
              assert r['video_prompts']==8,r
              assert r['pinterest_prompts']==8,r
          print('PASS canonical D1 readback WQ021-WQ030')
          PY
      - name: Remove read-only route and persist report
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          start="if(url.pathname==='/__verify_21_30_20260911_a4c971'&&request.method==='GET'){"
          pos=s.find(anchor+start)
          if pos>=0:
              begin=pos+len(anchor)
              end=s.find('if(env.DB)',begin)
              if end>begin:s=s[:begin]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/verify-wq021-wq030-readback-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js .github/workflows/verify-wq021-wq030-readback-20260911.yml || true
          if [ -f ops/readback/wq021-wq030-verify-20260911.json ]; then git add ops/readback/wq021-wq030-verify-20260911.json; fi
          git commit -m 'Persist WQ021-WQ030 verification and remove temporary readback route' || true
          for i in $(seq 1 12); do git pull --rebase origin main || true; git push origin main && exit 0; sleep 3; done
          exit 0
