name: Reapply safe WQ022-WQ031 buffer and publish WQ021
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reapply-buffer-wq021-status-20260911.yml'
permissions:
  contents: write
concurrency:
  group: wq021-wq031-canonical-fix-20260911
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deploy marker and authenticated canonical mutation route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          w=Path('_worker.js')
          s=w.read_text(encoding='utf-8')
          imp="import {prepareOne018026,readBatch018026} from './lib/prepared_batch_018_026.js';"
          add=imp+"\nimport {prepareBuffer022031} from './lib/prepared_buffer_022_031.js';"
          if 'prepareBuffer022031' not in s:
              assert imp in s
              s=s.replace(imp,add,1)
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          route="if(url.pathname==='/__wq021031_fix_83c64ea1'){if(request.method==='GET')return json({ok:true,marker:'wq021031-fix-83c64ea1'});if(request.method==='POST'){const denied=await requireAdmin(request,env);if(denied)return denied;const ts=new Date().toISOString();const before=await env.DB.prepare(\"SELECT status FROM content_items WHERE project_id='wisequotesworld' AND id='WQ021'\").first();await env.DB.prepare(\"UPDATE content_items SET status='published',notes=COALESCE(notes,'')||?,updated_at=? WHERE project_id='wisequotesworld' AND id='WQ021'\").bind(' User-confirmed actual publication on 2026-09-10.',ts).run();await env.DB.prepare(\"UPDATE content_versions SET status='published',updated_at=? WHERE content_id='WQ021'\").bind(ts).run();const buffer=await prepareBuffer022031(env);const after=await env.DB.prepare(\"SELECT id,status,updated_at FROM content_items WHERE project_id='wisequotesworld' AND id='WQ021'\").first();const prompts=(await env.DB.prepare(\"SELECT language_code,ai_prompt FROM content_versions WHERE content_id='WQ022' AND language_code IN ('uk','ru','pl','en','sv','de','es','fr') AND version=(SELECT MAX(v2.version) FROM content_versions v2 WHERE v2.content_id='WQ022' AND v2.language_code=content_versions.language_code) ORDER BY language_code\").all()).results||[];const prompt_safe=prompts.length===8&&prompts.every(x=>String(x.ai_prompt||'').includes('No historical person, portrait, face, human figure, bust, sculpture, painting, photograph, or likeness')&&!String(x.ai_prompt||'').includes('Einstein in a quiet'));return json({ok:after?.status==='published'&&buffer?.ok===true&&prompt_safe,wq021:{before:before?.status,after},buffer,wq022_prompt_safe:prompt_safe,wq022_prompt_languages:prompts.map(x=>x.language_code)});}return json({ok:false,error:'method not allowed'},405);}"
          if route not in s:
              assert anchor in s
              s=s.replace(anchor,anchor+route,1)
          w.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose authenticated WQ021-WQ031 canonical correction'
          for i in $(seq 1 10); do
            git pull --rebase origin main || true
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Wait for exact worker marker deployment
        run: |
          set -euo pipefail
          URL='https://wisequotesworld-web.pages.dev/__wq021031_fix_83c64ea1'
          for i in $(seq 1 72); do
            body="$(curl -sS --max-time 15 "$URL" || true)"
            echo "probe $i: ${body:0:120}"
            if printf '%s' "$body" | grep -q 'wq021031-fix-83c64ea1'; then exit 0; fi
            sleep 10
          done
          echo 'Exact deployment marker did not become live'
          exit 1
      - name: Apply canonical D1 mutation and verify readback
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}" || { echo 'ADMIN_TOKEN missing'; exit 1; }
          mkdir -p ops/readback
          curl -sS --fail-with-body --max-time 120 \
            -X POST 'https://wisequotesworld-web.pages.dev/__wq021031_fix_83c64ea1' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            -o ops/readback/wq021-wq030-final-20260911.json
          cat ops/readback/wq021-wq030-final-20260911.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq021-wq030-final-20260911.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert (d.get('wq021') or {}).get('after',{}).get('status')=='published',d
          assert d.get('wq022_prompt_safe') is True,d
          assert set(d.get('wq022_prompt_languages') or [])=={'uk','ru','pl','en','sv','de','es','fr'},d
          rb=(d.get('buffer') or {}).get('readback') or {}
          assert rb.get('ok') is True,rb
          rows=[r for r in (rb.get('rows') or []) if 22<=int(r['id'][2:])<=30]
          assert len(rows)==9,rows
          for r in rows:
              assert r.get('published_pages')==13,r
              assert r.get('native_qa',0)>=13,r
              assert r.get('video_prompts')==8,r
              assert r.get('pinterest_prompts')==8,r
              assert r.get('outputs',0)>=88,r
              assert r.get('ready_for_user_media') is True,r
          print('PASS: WQ021 published; WQ022 prompts safe 8/8; WQ022-WQ030 canonical readiness verified')
          PY
      - name: Remove one-time route and persist readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          w=Path('_worker.js')
          s=w.read_text(encoding='utf-8')
          s=s.replace("\nimport {prepareBuffer022031} from './lib/prepared_buffer_022_031.js';",'')
          anchor="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          start="if(url.pathname==='/__wq021031_fix_83c64ea1'){"
          pos=s.find(anchor+start)
          if pos>=0:
              begin=pos+len(anchor)
              # Route is a single minified statement ending immediately before the normal first `if(env.DB)`.
              end=s.find('if(env.DB)',begin)
              if end>begin:s=s[:begin]+s[end:]
          w.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/reapply-buffer-wq021-status-20260911.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A _worker.js .github/workflows/reapply-buffer-wq021-status-20260911.yml || true
          if [ -f ops/readback/wq021-wq030-final-20260911.json ]; then git add ops/readback/wq021-wq030-final-20260911.json; fi
          git commit -m 'Persist WQ021-WQ030 canonical readback and remove one-time correction route' || true
          for i in $(seq 1 10); do
            git pull --rebase origin main || true
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 0
