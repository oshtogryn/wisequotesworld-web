name: add-wq006-media-review-once
on:
  push:
    branches: [automation-v3]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[media-review-added]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-v3
      - name: Add secure R2 media review route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          if 'function wq006MediaReviewHtml()' in s:
              print('Media review already present.')
          else:
              marker="\nexport default{async fetch(request,env,ctx){"
              if marker not in s:
                  raise SystemExit('export marker not found')
              helper=r'''
function wq006MediaReviewHtml(){return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WQ006 Media Review</title><style>body{font-family:system-ui;margin:0;background:#f5f5f3;color:#171717}.wrap{max-width:760px;margin:auto;padding:22px}section{background:#fff;border-radius:22px;padding:22px;margin:18px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:15px;margin:8px 0;border-radius:14px}button{background:#111;color:#fff;font-weight:700}img{display:block;width:100%;height:auto;border-radius:18px;margin-top:18px;background:#eee}.ok{background:#dcfce7;padding:15px;border-radius:14px;font-weight:700}.err{background:#fee2e2;padding:15px;border-radius:14px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div class="wrap"><h1>Wise Quotes — WQ006 Media Review</h1><section><label>Preview ADMIN_TOKEN</label><input id="token" type="password" autocomplete="current-password"><button onclick="loadImage()">Load latest WQ006 EN Pinterest image</button><div id="state"></div><img id="pic" hidden><pre id="meta"></pre></section></div><script>async function loadImage(){state.className='';state.textContent='Loading from private R2…';pic.hidden=true;meta.textContent='';try{const r=await fetch('/api/admin/test/wq006/latest-image',{headers:{authorization:'Bearer '+token.value}});if(!r.ok){let t=await r.text();throw new Error('HTTP '+r.status+' — '+t)}const b=await r.blob();pic.src=URL.createObjectURL(b);pic.hidden=false;state.className='ok';state.textContent='SUCCESS — image loaded from R2. QA is still pending.';meta.textContent='media_id: '+(r.headers.get('x-media-id')||'')+'\nr2_key: '+(r.headers.get('x-r2-key')||'')+'\ncontent-type: '+b.type+'\nsize: '+b.size+' bytes';}catch(e){state.className='err';state.textContent='ERROR — '+e.message}}</script></body></html>`}

async function latestWQ006Image(request,env){
 if(!authorized(request,env))return json({ok:false,error:'unauthorized'},401);
 if(!env.DB)return json({ok:false,error:'DB binding unavailable'},503);
 if(!env.MEDIA)return json({ok:false,error:'R2 MEDIA binding unavailable'},503);
 const row=await env.DB.prepare(`SELECT id,r2_key,mime_type,size_bytes,created_at FROM media_inbox WHERE project_id=? AND content_item_id='WQ006' AND language_code='en' AND asset_type='pinterest' ORDER BY created_at DESC LIMIT 1`).bind(PROJECT_ID).first();
 if(!row)return json({ok:false,error:'WQ006 EN Pinterest media not found'},404);
 const obj=await env.MEDIA.get(row.r2_key);
 if(!obj)return json({ok:false,error:'R2 object missing',media_id:row.id,r2_key:row.r2_key},404);
 const h=new Headers();h.set('content-type',row.mime_type||obj.httpMetadata?.contentType||'image/jpeg');h.set('cache-control','no-store');h.set('x-media-id',row.id);h.set('x-r2-key',row.r2_key);h.set('x-content-created-at',row.created_at||'');
 return new Response(obj.body,{status:200,headers:h});
}
'''
              s=s.replace(marker,'\n'+helper+marker)
              route_marker="  if(url.pathname==='/api/admin/test/wq006/seed'&&request.method==='POST'){"
              if route_marker not in s:
                  raise SystemExit('WQ006 api marker not found')
              page_route="  if(url.pathname==='/admin/wq006-media'||url.pathname==='/admin/wq006-media/')return new Response(wq006MediaReviewHtml(),{headers:{'content-type':'text/html; charset=utf-8','cache-control':'no-store','x-robots-tag':'noindex,nofollow'}});\n  if(url.pathname==='/api/admin/test/wq006/latest-image'&&request.method==='GET')return latestWQ006Image(request,env);\n"
              s=s.replace(route_marker,page_route+route_marker)
              p.write_text(s)
              print('Added secure WQ006 media review.')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git commit -m "feat: add secure WQ006 R2 media review [media-review-added]"
          git push origin HEAD:automation-v3
