name: Mark WQ019 scheduled after 64 Planner readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-wq019-scheduled-64-20260907.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for deploy
        run: sleep 75
      - name: Apply scheduled status and verify
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 15 --retry-all-errors --retry-delay 5 -X POST \
            -H 'x-wq019-schedule: wq019-64-confirmed-20260907' \
            'https://wisequotesworld.com/ops/export/wq019-scheduled-64-20260907-5f9c1b7d' \
            -o ops/readback/wq019-scheduled-64-20260907.json
          cat ops/readback/wq019-scheduled-64-20260907.json
          python - <<'PY'
          import json
          p='ops/readback/wq019-scheduled-64-20260907.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('after',{}).get('status')=='scheduled',d
          assert int(d.get('approved_media',0))>=16,d
          print('WQ019 scheduled D1 readback OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq019-scheduled-64-20260907.json
          git commit -m 'Persist WQ019 scheduled status readback'
          git push
