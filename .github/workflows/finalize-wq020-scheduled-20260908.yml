name: Finalize WQ020 scheduled 2026-09-08
# trigger: 2026-09-08
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-wq020-scheduled-20260908.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire temporary WQ020 D1 route
        run: |
          set -euo pipefail
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          imp="import {markWQ020ScheduledOnce} from './lib/wq020_mark_scheduled_once.js';\n"
          anchor="import {adminTopicsApi} from './lib/admin_topics_api.js';\n"
          route="if(url.pathname==='/ops/run/wq020-scheduled-finalize-20260908'&&request.method==='POST')return json(await markWQ020ScheduledOnce(env));"
          route_anchor="const sensitiveOps=url.pathname.startsWith('/ops/run/')"
          if imp not in s:s=s.replace(anchor,anchor+imp,1)
          if route not in s:s=s.replace(route_anchor,route+route_anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Temporarily wire WQ020 scheduled finalize route'
          git push
      - name: Wait for deployment
        run: sleep 40
      - name: Mark scheduled and verify D1
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 \
            -X POST 'https://wisequotesworld.com/ops/run/wq020-scheduled-finalize-20260908' \
            -o ops/readback/wq020-scheduled-state-20260908.json
          cat ops/readback/wq020-scheduled-state-20260908.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq020-scheduled-state-20260908.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('item',{}).get('status')=='scheduled',d
          vs=d.get('versions',[])
          assert vs and all(x.get('status') in ('scheduled','published') for x in vs),vs
          h=d.get('history',[])
          assert h and h[0].get('to_status')=='scheduled',h
          print('WQ020 D1 scheduled readback VERIFIED')
          PY
      - name: Remove temporary route and commit readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {markWQ020ScheduledOnce} from './lib/wq020_mark_scheduled_once.js';\n",'',1)
          s=s.replace("if(url.pathname==='/ops/run/wq020-scheduled-finalize-20260908'&&request.method==='POST')return json(await markWQ020ScheduledOnce(env));",'',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if [ -f ops/readback/wq020-scheduled-state-20260908.json ]; then git add ops/readback/wq020-scheduled-state-20260908.json; fi
          git commit -m 'Record WQ020 scheduled state and remove temporary route' || true
          git push
