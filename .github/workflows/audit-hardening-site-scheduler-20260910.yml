          s=s.replace('Status: IN PROGRESS — code hardening and Cloudflare edge hardening complete; final production readback remains','Status: IN PROGRESS — edge/code hardening complete; final authenticated-browser readback remains')
          if 'Legacy ADMIN_TOKEN injection bridge retired' not in s:
              s += '''\n## 2026-09-10 follow-up hardening\n\n- Legacy ADMIN_TOKEN injection bridge retired. The top-level canonical admin gate strips any client-supplied internal marker, authenticates the request, then sets a server-only `x-wqw-canonical-admin` marker for legacy handlers.\n- Public `/api/health` metadata minimized to `{ok:true}`; binding/security details moved to protected `/api/admin/health`.\n- Website publication scheduling added in D1 without coupling website visibility to social scheduling.\n- Remaining P0 evidence is operational, not code: one authenticated browser pass through Admin Console plus an anonymous/private-window denial check.\n'''
          p.write_text(s,encoding='utf-8')
          PY

          node --check _worker.js
