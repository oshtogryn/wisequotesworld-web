name: Cleanup completed IT PT-BR expansion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-it-ptbr.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical rules and remove one-time expansion plumbing
        run: |
          set -euo pipefail
          git pull --rebase
          python - <<'PY'
          from pathlib import Path
          p=Path('ops/MASTER_RULES.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Останнє оновлення: 2026-09-03','Останнє оновлення: 2026-09-04',1)
          s=s.replace('Версія: database-first v4.6','Версія: database-first v4.7',1)
          s=s.replace('uk, ru, pl, en, sv, de, es, fr.','uk, ru, pl, en, sv, de, es, fr, it, pt (pt-BR).',1)
          old='Усі 8 мов активні для website, Pinterest, Facebook, Instagram, Threads, TikTok і YouTube. Для повної production readiness французька проходить ті самі social/media gates, що й інші 7 мов.'
          new='Усі 10 мов активні для website: uk, ru, pl, en, sv, de, es, fr, it, pt-BR. Італійська та бразильська португальська вже мають повні website-локалізації та індексовані URL; їхні social-канали поки в статусі prepared/inactive до створення й підключення акаунтів. Після підключення it і pt-BR переходять на ті самі social/media/scheduling gates, що й інші активні social locales.'
          s=s.replace(old,new,1)
          s=s.replace('Одна думка = один content_id, 8 localizations.','Одна думка = один content_id, 10 website localizations.',1)
          s=s.replace('D1 database-first. New approved content should not require manual deploy. 8 locales, archive, quote/category/verified-author pages, sitemap/hreflang/canonical/internal links.','D1 database-first. New approved content should not require manual deploy. 10 website locales, archive, quote/category/verified-author pages, sitemap/hreflang/canonical/internal links. Social readiness is evaluated only for connected social locales.',1)
          s=s.replace('Create/edit topic, 8 localizations, prompts, copy, article/URL, media upload/QA, approval/reject, workflow/status/errors, planning/readback, analytics. Media batch upload must support video and Pinterest creative for all 8 locales, including FR.','Create/edit topic, 10 website localizations, prompts, copy, article/URL, media upload/QA, approval/reject, workflow/status/errors, planning/readback, analytics. Social/media requirements apply to connected social locales; it and pt-BR join those gates once their accounts are connected.',1)
          s=s.replace('Required Pinterest coverage is 8/8 locales: uk, ru, pl, en, sv, de, es, fr.','Required Pinterest coverage follows connected active social locales. The current established social set remains mandatory; target becomes 10/10 after it and pt-BR boards/accounts are connected.',1)
          s=s.replace('Social coverage is 8/8 locales for Facebook, Instagram, Threads, TikTok and YouTube where connected.','Social coverage is mandatory for every connected locale. it and pt-BR remain prepared/inactive until their accounts are created and connected.',1)
          p.write_text(s,encoding='utf-8')
          PY
          git rm -f .github/workflows/cleanup-it-ptbr.yml .github/workflows/finalize-it-ptbr.yml .github/workflows/expand-it-ptbr.yml .github/workflows/publish-it-pt-website.yml .github/workflows/new-locales-catalog-readback.yml 2>/dev/null || true
          git rm -f lib/expand_it_ptbr.js lib/new_locales_catalog_readback.js lib/prepare_new_locales.js 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/MASTER_RULES.md
          git commit -m 'Finalize clean ten-language Wise Quotes website state'
          git push
