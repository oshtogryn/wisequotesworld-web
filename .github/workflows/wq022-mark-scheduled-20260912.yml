name: Mark WQ022 scheduled after 72-of-72 Planner readback
on:
  push:
    paths:
      - '.github/workflows/wq022-mark-scheduled-20260912.yml'
permissions:
  contents: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire one-time D1 mutation route
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          a="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          r="if(url.pathname==='/__wq022_mark_scheduled_20260912'&&request.method==='POST'){const ts=new Date().toISOString();await env.DB.prepare(`UPDATE content_approvals SET status='approved',notes='User approved publication; Metricool Planner readback confirmed 72/72 on 2026-09-12',updated_at=? WHERE id=(SELECT id FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='content' AND language_code IS NULL ORDER BY id DESC LIMIT 1)`).bind(ts).run();await env.DB.prepare(`UPDATE content_items SET status='scheduled',updated_at=? WHERE project_id='wisequotesworld' AND id='WQ022'`).bind(ts).run();await env.DB.prepare(`UPDATE content_versions SET status='scheduled' WHERE content_id='WQ022'`).run();const item=await env.DB.prepare(`SELECT id,status,updated_at FROM content_items WHERE project_id='wisequotesworld' AND id='WQ022'`).first();const approval=await env.DB.prepare(`SELECT status,notes,updated_at FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='content' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).first();const versions=(await env.DB.prepare(`SELECT language_code,status FROM content_versions WHERE content_id='WQ022' ORDER BY language_code`).all()).results||[];return json({ok:true,item,approval,versions,planner_readback:'72/72'});}"
          assert a in s
          if r not in s:s=s.replace(a,a+r,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check _worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'Expose one-time WQ022 scheduled mutation'
          git push origin main
      - name: Wait for deploy, mutate and verify
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          URL='https://wisequotesworld-web.pages.dev/__wq022_mark_scheduled_20260912'
          ready=0
          for i in $(seq 1 72); do
            code=$(curl -sS --max-time 15 -o /tmp/probe -w '%{http_code}' "$URL" || true)
            if [ "$code" = '405' ] || [ "$code" = '200' ]; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = '1' ]
          curl -sS --fail-with-body -X POST "$URL" -o ops/readback/wq022-scheduled-20260912.json
          cat ops/readback/wq022-scheduled-20260912.json
          python - <<'PY'
          import json
          d=json.load(open('ops/readback/wq022-scheduled-20260912.json',encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('planner_readback')=='72/72',d
          assert d.get('item',{}).get('status')=='scheduled',d
          assert d.get('approval',{}).get('status')=='approved',d
          assert len(d.get('versions',[]))>=13,d
          assert all(x.get('status')=='scheduled' for x in d['versions']),d
          print('WQ022 D1 status=scheduled; approval=approved; Planner=72/72')
          PY
      - name: Remove one-time route and persist readback
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text(encoding='utf-8')
          a="async function handleRequest(request,env,ctx){try{const url=new URL(request.url);"
          r="if(url.pathname==='/__wq022_mark_scheduled_20260912'&&request.method==='POST'){const ts=new Date().toISOString();await env.DB.prepare(`UPDATE content_approvals SET status='approved',notes='User approved publication; Metricool Planner readback confirmed 72/72 on 2026-09-12',updated_at=? WHERE id=(SELECT id FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='content' AND language_code IS NULL ORDER BY id DESC LIMIT 1)`).bind(ts).run();await env.DB.prepare(`UPDATE content_items SET status='scheduled',updated_at=? WHERE project_id='wisequotesworld' AND id='WQ022'`).bind(ts).run();await env.DB.prepare(`UPDATE content_versions SET status='scheduled' WHERE content_id='WQ022'`).run();const item=await env.DB.prepare(`SELECT id,status,updated_at FROM content_items WHERE project_id='wisequotesworld' AND id='WQ022'`).first();const approval=await env.DB.prepare(`SELECT status,notes,updated_at FROM content_approvals WHERE content_item_id='WQ022' AND approval_scope='content' AND language_code IS NULL ORDER BY id DESC LIMIT 1`).first();const versions=(await env.DB.prepare(`SELECT language_code,status FROM content_versions WHERE content_id='WQ022' ORDER BY language_code`).all()).results||[];return json({ok:true,item,approval,versions,planner_readback:'72/72'});}"
          s=s.replace(a+r,a)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/wq022-mark-scheduled-20260912.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record WQ022 scheduled state and clean one-time route' || true
          git pull --rebase origin main || true
          git push origin main || true
