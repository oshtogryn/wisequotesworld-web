<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes World — Brevo test</title><style>body{margin:0;background:#0b0d12;color:#f5f2ea;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:40px 18px}.card{background:#151821;border:1px solid #5f5133;border-radius:18px;padding:28px}.brand{font-size:28px;font-weight:700;color:#e4c576;margin-bottom:18px}p{color:#c6c3bb;line-height:1.6}.btn{display:block;width:100%;border:0;border-radius:12px;background:#e4c576;color:#111;font-size:18px;font-weight:700;padding:15px;cursor:pointer;margin-top:12px}.btn.secondary{background:#242938;color:#f5f2ea;border:1px solid #555}.btn:disabled{opacity:.55}.status{margin-top:18px;padding:14px;border-radius:12px;background:#10131b;color:#d8d5cc;white-space:pre-wrap}.ok{border:1px solid #3d7954}.bad{border:1px solid #8a4b4b}.back{display:inline-block;margin-top:18px;color:#e4c576}</style></head><body><main class="wrap"><section class="card"><div class="brand">Wise Quotes World</div><h1>Brevo test</h1><p>Надсилає один тестовий лист першому реальному активному підписнику з D1. Службові адреси example.* і .invalid ігноруються. Запит захищений вашим ADMIN_TOKEN.</p><button id="send" class="btn">Надіслати тестовий лист</button><button id="check" class="btn secondary">Перевірити статус доставки</button><div id="status" class="status">Очікує запуску.</div><a class="back" href="/admin/console/">← Admin Console</a></section></main><script>(()=>{const send=document.getElementById('send'),check=document.getElementById('check'),s=document.getElementById('status');function token(){return localStorage.getItem('wq_admin_token')||''}function noToken(){s.className='status bad';s.textContent='ADMIN_TOKEN не знайдено. Спочатку відкрийте Admin Console і натисніть «Підключити».'}send.addEventListener('click',async()=>{const t=token();if(!t)return noToken();send.disabled=true;s.className='status';s.textContent='Надсилаю через Brevo…';try{const r=await fetch('/ops/run/brevo-test',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+t},body:'{}'});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));s.className='status ok';s.textContent='Brevo прийняв лист ✓\nОдержувач: '+(j.recipient_masked||'—')+'\nМова: '+(j.language||'—')+'\nHTTP '+(j.status||'—')+(j.messageId?' · messageId отримано':'')+'\n\nЧерез 10–20 секунд натисніть «Перевірити статус доставки».';}catch(e){s.className='status bad';s.textContent='Помилка: '+e.message}finally{send.disabled=false}});check.addEventListener('click',async()=>{const t=token();if(!t)return noToken();check.disabled=true;s.className='status';s.textContent='Перевіряю Brevo delivery events…';try{const r=await fetch('/ops/readback/brevo-test-status',{headers:{Authorization:'Bearer '+t}});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));if(!j.events?.length){s.className='status';s.textContent='Одержувач: '+(j.recipient_masked||'—')+'\nBrevo поки не повернув жодної події. Спробуйте ще раз через 20–30 секунд.';return}const lines=j.events.map((e,i)=>`${i+1}. ${e.event||'—'} · ${e.date||'—'}${e.reason?'\n   Причина: '+e.reason:''}`);const delivered=j.events.some(e=>e.event==='delivered'),bad=j.events.some(e=>['blocked','hardBounce','softBounce','softBounces','invalid','error'].includes(e.event));s.className='status '+(delivered?'ok':bad?'bad':'');s.textContent='Одержувач: '+(j.recipient_masked||'—')+'\n\n'+lines.join('\n\n');}catch(e){s.className='status bad';s.textContent='Помилка перевірки: '+e.message}finally{check.disabled=false}})})();</script></body></html>
