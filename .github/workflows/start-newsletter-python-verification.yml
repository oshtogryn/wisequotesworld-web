name: Verify start pages and newsletter with Python
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-newsletter-python-verification.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose production newsletter API
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error
          health='https://wisequotesworld.com/ops/readback/newsletter-health.json'
          try:
              with urllib.request.urlopen(health,timeout=20) as r:
                  print('HEALTH STATUS',r.status)
                  print('HEALTH BODY',r.read().decode())
          except urllib.error.HTTPError as e:
              print('HEALTH HTTP',e.code,e.read().decode(errors='replace'))
          except Exception as e:
              print('HEALTH ERROR',repr(e))

          payload=json.dumps({'email':'qa-newsletter-diagnostic@example.invalid','language':'uk','company':''}).encode()
          req=urllib.request.Request('https://wisequotesworld.com/api/newsletter/subscribe',data=payload,headers={'Content-Type':'application/json','User-Agent':'WQW-production-QA/3.0'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read().decode()
                  print('WRITE STATUS',r.status)
                  print('WRITE BODY',body)
                  out=json.loads(body)
                  assert out.get('ok') is True
          except urllib.error.HTTPError as e:
              body=e.read().decode(errors='replace')
              print('WRITE HTTP',e.code)
              print('WRITE ERROR BODY',body)
              raise
          PY
