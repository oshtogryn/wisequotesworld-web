name: wq019-readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wq019-readback.yml'
permissions:
  contents: write
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract WQ019 locale summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          src='ops/readback/wq019-production.json'; dst='ops/readback/wq019-locales-summary.json'
          j=json.load(open(src))
          out={}
          for lang,p in j['pack'].items():
              out[lang]={
                  'quote':p.get('localized_quote'),
                  'article_url':p.get('outputs',{}).get('article_url'),
                  'has_video_prompt':bool(p.get('video_prompt')),
                  'output_keys':sorted(p.get('outputs',{}).keys())
              }
          with open(dst,'w') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit summary
        run: |
          git config user.name oshtogryn
          git config user.email alex.shtogryn@gmail.com
          git add ops/readback/wq019-locales-summary.json
          git commit -m 'Summarize WQ019 locale readiness' || exit 0
          git pull --rebase
          git push
