<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Wise Quotes World — Brevo test</title><style>body{margin:0;background:#0b0d12;color:#f5f2ea;font-family:Arial,sans-serif}.wrap{max-width:680px;margin:0 auto;padding:40px 18px}.card{background:#151821;border:1px solid #5f5133;border-radius:18px;padding:28px}.brand{font-size:28px;font-weight:700;color:#e4c576;margin-bottom:18px}p{color:#c6c3bb;line-height:1.6}.label{display:block;margin:18px 0 8px;color:#e4c576;font-weight:700}.select{width:100%;box-sizing:border-box;background:#10131b;color:#f5f2ea;border:1px solid #555;border-radius:12px;padding:14px;font-size:16px}.meta{margin-top:8px;color:#9d998f;font-size:13px}.btn{display:block;width:100%;border:0;border-radius:12px;background:#e4c576;color:#111;font-size:18px;font-weight:700;padding:15px;cursor:pointer;margin-top:12px}.btn.secondary{background:#242938;color:#f5f2ea;border:1px solid #555}.btn.digest{background:#d7b961}.btn:disabled{opacity:.55}.status{margin-top:18px;padding:14px;border-radius:12px;background:#10131b;color:#d8d5cc;white-space:pre-wrap}.ok{border:1px solid #3d7954}.bad{border:1px solid #8a4b4b}.back{display:inline-block;margin-top:18px;color:#e4c576}</style></head><body><main class="wrap"><section class="card"><div class="brand">Wise Quotes World</div><h1>Brevo test</h1><p>Тестовий режим. Оберіть конкретного активного підписника з D1. На сторінці показуються лише замасковані адреси. Автоматичний scheduler розсилки вимкнений.</p><label class="label" for="subscriber">Одержувач</label><select id="subscriber" class="select"><option value="">Завантажую підписників…</option></select><div id="submeta" class="meta"></div><button id="digest" class="btn digest">Надіслати production digest test</button><button id="send" class="btn">Надіслати технічний тест</button><button id="check" class="btn secondary">Перевірити статус доставки</button><button id="reload" class="btn secondary">Оновити список підписників</button><div id="status" class="status">Очікує запуску.</div><a class="back" href="/admin/console/">← Admin Console</a></section></main><script>(()=>{const send=document.getElementById('send'),digest=document.getElementById('digest'),check=document.getElementById('check'),reload=document.getElementById('reload'),sel=document.getElementById('subscriber'),meta=document.getElementById('submeta'),s=document.getElementById('status');function token(){return localStorage.getItem('wq_admin_token')||''}function noToken(){s.className='status bad';s.textContent='ADMIN_TOKEN не знайдено. Спочатку відкрийте Admin Console і натисніть «Підключити».'}function selectedId(){return Number(sel.value)||null}function selectedText(){return sel.options[sel.selectedIndex]?.text||'—'}async function loadSubscribers(){const t=token();if(!t)return noToken();reload.disabled=true;sel.disabled=true;meta.textContent='';try{const r=await fetch('/ops/readback/brevo-test-subscribers',{headers:{Authorization:'Bearer '+t}});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));sel.innerHTML='';if(!j.subscribers?.length){sel.innerHTML='<option value="">Немає активних реальних підписників</option>';meta.textContent='Активних підписників: 0';return}for(const x of j.subscribers){const o=document.createElement('option');o.value=String(x.subscriber_id);o.textContent=(x.email_masked||'***')+' · '+(x.language||'—');sel.appendChild(o)}meta.textContent='Активних підписників: '+j.count+'. Обрано: '+selectedText();}catch(e){sel.innerHTML='<option value="">Помилка завантаження</option>';s.className='status bad';s.textContent='Не вдалося завантажити підписників: '+e.message}finally{reload.disabled=false;sel.disabled=false}}async function post(path,label){const t=token();if(!t)return noToken();const id=selectedId();if(!id)throw new Error('Оберіть підписника');s.className='status';s.textContent=label;const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({subscriber_id:id})});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));return j}sel.addEventListener('change',()=>{meta.textContent='Обрано: '+selectedText()});digest.addEventListener('click',async()=>{digest.disabled=true;try{const j=await post('/ops/run/brevo-digest-test','Готую реальний локалізований digest з D1 і надсилаю вибраному підписнику через Brevo…');s.className='status ok';s.textContent='Production digest прийнято Brevo ✓\nОдержувач: '+(j.recipient_masked||'—')+'\nМова: '+(j.language||'—')+'\nСтатей: '+(j.article_count||'—')+'\nТема: '+(j.subject||'—')+'\nHTTP '+(j.status||'—')+'\nScheduler: OFF\n\nЧерез 10–20 секунд перевірте статус доставки.';}catch(e){s.className='status bad';s.textContent='Помилка digest: '+e.message}finally{digest.disabled=false}});send.addEventListener('click',async()=>{send.disabled=true;try{const j=await post('/ops/run/brevo-test','Надсилаю технічний тест вибраному підписнику через Brevo…');s.className='status ok';s.textContent='Brevo прийняв лист ✓\nОдержувач: '+(j.recipient_masked||'—')+'\nМова: '+(j.language||'—')+'\nHTTP '+(j.status||'—')+(j.messageId?' · messageId отримано':'')+'\n\nЧерез 10–20 секунд натисніть «Перевірити статус доставки».';}catch(e){s.className='status bad';s.textContent='Помилка: '+e.message}finally{send.disabled=false}});check.addEventListener('click',async()=>{const t=token();if(!t)return noToken();const id=selectedId();if(!id){s.className='status bad';s.textContent='Оберіть підписника.';return}check.disabled=true;s.className='status';s.textContent='Перевіряю Brevo delivery events для вибраного підписника…';try{const r=await fetch('/ops/readback/brevo-test-status?subscriber_id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+t}});let j={};try{j=await r.json()}catch{}if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));if(!j.events?.length){s.className='status';s.textContent='Одержувач: '+(j.recipient_masked||'—')+'\nBrevo поки не повернув жодної події. Спробуйте ще раз через 20–30 секунд.';return}const lines=j.events.map((e,i)=>`${i+1}. ${e.event||'—'} · ${e.date||'—'}${e.reason?'\n   Причина: '+e.reason:''}`);const delivered=j.events.some(e=>e.event==='delivered'),bad=j.events.some(e=>['blocked','hardBounce','softBounce','softBounces','invalid','error'].includes(e.event));s.className='status '+(delivered?'ok':bad?'bad':'');s.textContent='Одержувач: '+(j.recipient_masked||'—')+'\n\n'+lines.join('\n\n');}catch(e){s.className='status bad';s.textContent='Помилка перевірки: '+e.message}finally{check.disabled=false}});reload.addEventListener('click',loadSubscribers);loadSubscribers()})();</script></body></html>
