name: Build plain Wise DB payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-plain-db-payload.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert validated gzip payload to plain JSON chunks
        run: |
          python - <<'PY'
          import base64,gzip,json,pathlib,shutil
          files=sorted(pathlib.Path('db/migration').glob('payload.*'))
          s=''.join(p.read_text().strip() for p in files)
          obj=json.loads(gzip.decompress(base64.b64decode(s,validate=True)))
          out=pathlib.Path('db/plain_migration')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          for i in range(0,len(obj),25):
              (out/f'part_{i//25:02d}.json').write_text(json.dumps(obj[i:i+25],ensure_ascii=False,separators=(',',':')))
          (out/'manifest.json').write_text(json.dumps({'parts':(len(obj)+24)//25,'statements':len(obj)}))
          print('statements',len(obj),'parts',(len(obj)+24)//25)
          PY
      - name: Commit plain payload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/plain_migration
          git commit -m 'Build plain Wise D1 migration payload' || exit 0
          git push
