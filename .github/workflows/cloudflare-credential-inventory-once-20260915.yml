name: Cloudflare credential inventory once 2026-09-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-credential-inventory-once-20260915.yml'

permissions:
  contents: read

jobs:
  inventory:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Report non-secret credential presence
        shell: bash
        run: |
          set -euo pipefail
          for name in CF_API_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -n "${!name:-}" ]; then
              echo "$name=EXISTS"
            else
              echo "$name=MISSING"
            fi
          done
