name: Start pages live readback

on:
  push:
    branches: [main]
    paths:
      - 'start/**'
      - 'uk/start/**'
      - 'ru/start/**'
      - 'pl/start/**'
      - 'en/start/**'
      - 'sv/start/**'
      - 'de/start/**'
      - 'es/start/**'
      - 'fr/start/**'
      - '.github/workflows/start-pages-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for production propagation
        run: sleep 45
      - name: Verify DNS and start pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          report=ops/readback/start-pages-live.txt
          : > "$report"

          echo 'DNS wisequotesworld.com:' | tee -a "$report"
          if ! getent ahostsv4 wisequotesworld.com | awk '{print $1}' | sort -u | tee -a "$report" | grep -qE '^[0-9]+\.'; then
            echo 'FAIL dns=unresolved wisequotesworld.com' | tee -a "$report"
            exit 1
          fi

          fetch_match(){
            url="$1"
            expected_file="$2"
            attempts=12
            delay=15
            for attempt in $(seq 1 "$attempts"); do
              out=$(mktemp)
              sep='?'; [[ "$url" == *\?* ]] && sep='&'
              code=$(curl -L -sS -o "$out" -w '%{http_code}' --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${url}${sep}rb=$(date +%s)-${attempt}" || true)
              if [[ "$code" == "200" ]] && cmp -s "$out" "$expected_file"; then
                echo "PASS $url attempt=$attempt" | tee -a "$report"
                rm -f "$out"
                return 0
              fi
              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "WAIT stale_or_unready code=$code $url attempt=$attempt/$attempts" | tee -a "$report"
                rm -f "$out"
                sleep "$delay"
              else
                echo "FAIL code=$code $url attempts=$attempts" | tee -a "$report"
                echo "expected_sha256=$(sha256sum "$expected_file" | awk '{print $1}')" | tee -a "$report"
                echo "actual_sha256=$(sha256sum "$out" | awk '{print $1}')" | tee -a "$report"
                rm -f "$out"
                return 1
              fi
            done
          }

          fetch_match 'https://wisequotesworld.com/start/' 'start/index.html'
          for l in uk ru pl en sv de es fr; do
            fetch_match "https://wisequotesworld.com/$l/start/" "$l/start/index.html"
          done

          version=$(grep -oE 'localized\.js\?v=[0-9-]+' uk/start/index.html | head -1 | cut -d= -f2)
          [[ -n "$version" ]]
          for l in ru pl en sv de es fr; do
            grep -Fq "localized.js?v=$version" "$l/start/index.html"
          done
          fetch_match "https://wisequotesworld.com/start/localized.js?v=$version" 'start/localized.js'

          echo "cache_version=$version" | tee -a "$report"
          echo "checked_at=$(date -u +%FT%TZ)" | tee -a "$report"
          echo 'overall=PASS' | tee -a "$report"
      - name: Commit readback report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/start-pages-live.txt || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record start pages live readback'
          git push
