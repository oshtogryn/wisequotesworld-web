name: Export WQ019 schedule pack 2026-09-07
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-wq019-schedule-pack-20260907.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for site deploy
        run: sleep 75
      - name: Fetch WQ019 schedule pack and persist readback
        run: |
          set -euo pipefail
          mkdir -p ops/readback
          curl -L -sS --retry 15 --retry-all-errors --retry-delay 5 \
            'https://wisequotesworld.com/ops/export/wq019-7f1d2c6b' \
            -o ops/readback/wq019-schedule-pack-20260907.json
          python - <<'PY'
          import json
          p='ops/readback/wq019-schedule-pack-20260907.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          assert d.get('item',{}).get('id')=='WQ019',d
          assert len(d.get('pack') or {})==8,d
          print('WQ019 schedule export OK')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq019-schedule-pack-20260907.json
          git commit -m 'Persist WQ019 schedule pack readback'
          git push
