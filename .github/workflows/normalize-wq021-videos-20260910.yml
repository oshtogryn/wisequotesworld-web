name: Normalize WQ021 videos for Metricool 2026-09-10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-wq021-videos-20260910.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Wait for current production deploy
        run: sleep 75
      - name: Download, normalize, upload, approve, and verify WQ021 videos
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp/wq021 ops/readback
          : > ops/readback/wq021-video-normalization-20260910.txt
          for lang in uk ru pl en sv de es fr; do
            src="https://wisequotesworld.com/media/approved/WQ021/${lang}/video.mov"
            in="tmp/wq021/${lang}.mov"
            out="tmp/wq021/${lang}.mp4"
            echo "=== ${lang} ===" | tee -a ops/readback/wq021-video-normalization-20260910.txt
            curl -L --fail --retry 12 --retry-all-errors --retry-delay 5 \
              -A 'Mozilla/5.0 (compatible; WQW-Media-Normalizer/1.0)' \
              "$src" -o "$in"
            ffprobe -v error -show_entries format=format_name,duration,size:stream=index,codec_name,codec_type,width,height,pix_fmt,r_frame_rate,sample_rate,channels -of compact "$in" \
              | tee -a ops/readback/wq021-video-normalization-20260910.txt
            ffmpeg -y -i "$in" \
              -map 0:v:0 -map 0:a? \
              -c:v libx264 -profile:v high -pix_fmt yuv420p -preset medium -crf 20 \
              -movflags +faststart -r 30 -g 60 -keyint_min 60 -sc_threshold 0 \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              "$out"
            ffprobe -v error -show_entries format=format_name,duration,size:stream=index,codec_name,codec_type,width,height,pix_fmt,r_frame_rate,sample_rate,channels -of compact "$out" \
              | tee -a ops/readback/wq021-video-normalization-20260910.txt
            resp=$(curl -L --fail --retry 12 --retry-all-errors --retry-delay 5 \
              -A 'Mozilla/5.0 (compatible; WQW-Media-Normalizer/1.0)' \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -F "file=@${out};type=video/mp4;filename=WQ021_${lang}_metricool.mp4" \
              -F "content_id=WQ021" -F "language_code=${lang}" -F "kind=video" \
              'https://wisequotesworld.com/api/admin/media/manual-upload')
            echo "$resp" | tee -a ops/readback/wq021-video-normalization-20260910.txt
            media_id=$(python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True,d; print(d["media_id"])' <<< "$resp")
            qa=$(curl -L --fail --retry 12 --retry-all-errors --retry-delay 5 \
              -A 'Mozilla/5.0 (compatible; WQW-Media-Normalizer/1.0)' \
              -H "Authorization: Bearer $ADMIN_TOKEN" -H 'Content-Type: application/json' \
              --data '{"status":"approved","notes":"Transcoded to H.264/AAC MP4, yuv420p, 30fps, faststart for Metricool compatibility; visual/audio content unchanged."}' \
              "https://wisequotesworld.com/api/admin/production/media/${media_id}/qa")
            echo "$qa" | tee -a ops/readback/wq021-video-normalization-20260910.txt
            python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("qa_status")=="approved",d' <<< "$qa"
          done
          rb=$(curl -L --fail --retry 12 --retry-all-errors --retry-delay 5 \
            -A 'Mozilla/5.0 (compatible; WQW-Media-Normalizer/1.0)' \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            'https://wisequotesworld.com/api/admin/production/WQ021')
          printf '%s\n' "$rb" > ops/readback/wq021-production-after-video-normalization-20260910.json
          python - <<'PY'
          import json
          p='ops/readback/wq021-production-after-video-normalization-20260910.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('ok') is True,d
          med=d.get('media') or []
          for lang in ('uk','ru','pl','en','sv','de','es','fr'):
              rows=[m for m in med if m.get('language_code')==lang and (str(m.get('asset_type','')).lower()=='video' or str(m.get('mime_type','')).startswith('video/'))]
              assert rows,lang
              latest=rows[0]
              assert latest.get('mime_type')=='video/mp4',(lang,latest)
              assert latest.get('qa_status')=='approved',(lang,latest)
          print('WQ021 normalized MP4 videos are latest approved video assets for all 8 connected locales')
          PY
      - name: Save normalization readback
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/readback/wq021-video-normalization-20260910.txt ops/readback/wq021-production-after-video-normalization-20260910.json 2>/dev/null || true
          git commit -m 'Record WQ021 Metricool video normalization readback' || true
          git push || true
