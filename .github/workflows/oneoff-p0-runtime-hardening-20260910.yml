name: One-off P0 runtime hardening 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/oneoff-p0-runtime-hardening-20260910.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden admin bridge and initialize scheduler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('_worker.js'); s=p.read_text()
          # Scheduler table must exist before any public SQL refers to it.
          imp="import {siteVisibilityApi} from './lib/site_visibility_api.js';"
          if "ensureWebsiteSchedule" not in s:
              if imp not in s: raise SystemExit('siteVisibilityApi import not found')
              s=s.replace(imp,imp+"\nimport {ensureWebsiteSchedule} from './lib/website_schedule.js';",1)

          old="if(isAdminPath(url.pathname)){const denied=await requireAdmin(request,env);if(denied)return denied;if(env.ADMIN_TOKEN){const headers=new Headers(request.headers);headers.set('authorization',`Bearer ${env.ADMIN_TOKEN}`);request=new Request(request,{headers})}}"
          new="if(isAdminPath(url.pathname)){const cleanHeaders=new Headers(request.headers);cleanHeaders.delete('x-wqw-canonical-admin');request=new Request(request,{headers:cleanHeaders});const denied=await requireAdmin(request,env);if(denied)return denied;const headers=new Headers(request.headers);headers.set('x-wqw-canonical-admin','1');request=new Request(request,{headers})}if(url.pathname==='/api/admin/health'&&request.method==='GET')return json({ok:true,project:'wisequotesworld',db:!!env.DB,r2:!!env.MEDIA,ai:!!env.AI,access:true});"
          if old in s:s=s.replace(old,new,1)
          elif 'x-wqw-canonical-admin' not in s: raise SystemExit('canonical gate pattern not found')

          # Initialize D1 scheduler table once before website public route modules can query it.
          marker="const url=new URL(request.url);"
          if "await ensureWebsiteSchedule(env)" not in s:
              if marker not in s: raise SystemExit('URL marker missing')
              s=s.replace(marker,marker+"if(env.DB){try{await ensureWebsiteSchedule(env)}catch{}}",1)
          p.write_text(s)

          p=Path('_worker_legacy.js'); s=p.read_text()
          old="function authorized(request,env){return !!env.ADMIN_TOKEN&&(request.headers.get('authorization')||'')===`Bearer ${env.ADMIN_TOKEN}`}\nfunction requireAdmin(request,env){return authorized(request,env)?null:json({ok:false,error:'unauthorized'},401)}"
          new="function canonicalAdminPassed(request){return request.headers.get('x-wqw-canonical-admin')==='1'}\nfunction requireAdmin(request,env){return canonicalAdminPassed(request)?null:json({ok:false,error:'unauthorized'},401)}"
          if old in s:s=s.replace(old,new,1)
          elif 'canonicalAdminPassed' not in s: raise SystemExit('legacy auth helper pattern missing')
          oldhealth="if(url.pathname==='/api/health')return json({ok:true,project:PROJECT_ID,languages:LANGS,db:!!env.DB,r2:!!env.MEDIA,ai:!!env.AI,admin_secret:!!env.ADMIN_TOKEN,pinterest_model:PIN_MODEL});"
          if oldhealth in s:s=s.replace(oldhealth,"if(url.pathname==='/api/health')return json({ok:true});",1)
          p.write_text(s)

          p=Path('admin/console/app.js'); s=p.read_text()
          old="const h=await fetch('/api/health',{credentials:'same-origin'}).then(r=>r.json());"
          if old in s:s=s.replace(old,"const h=await api('/api/admin/health');",1)
          p.write_text(s)

          # Record website scheduling contract in canonical rules.
          p=Path('ops/MASTER_RULES.md'); s=p.read_text()
          if '### Scheduled website visibility — HARD' not in s:
              block="""\n### Scheduled website visibility — HARD\n- Prepared quote pages may be technically published/indexable while editorial navigation visibility remains hidden.\n- Admin may publish website visibility immediately or schedule an exact future activation time.\n- Website schedules are stored canonically in D1 `website_publication_schedule`.\n- Scheduling is allowed only when all 13 quote pages are already prepared with `status='published'`.\n- At and after `scheduled_for`, public Latest/archive/category/author queries treat the topic as visible even before the schedule row is housekeeping-marked `released`.\n- Website scheduling never schedules social posts and never sets social `scheduled` or `published`.\n- Cancelling a website schedule leaves direct article URLs/indexability unchanged and keeps editorial navigation hidden.\n\n"""
              anchor='## 13. Media'
              if anchor not in s: raise SystemExit('MASTER_RULES insertion anchor missing')
              s=s.replace(anchor,block+anchor,1)
          p.write_text(s)

          p=Path('ops/P0_SECURITY_AUDIT.md'); s=p.read_text()
          if 'Legacy ADMIN_TOKEN injection bridge retired' not in s:
              s += """\n## 2026-09-10 follow-up hardening\n\n- Legacy ADMIN_TOKEN injection bridge retired. The top-level canonical admin gate strips any client-supplied internal marker, authenticates the request, then adds a server-only `x-wqw-canonical-admin` marker for legacy handlers.\n- Public `/api/health` metadata minimized to `{\"ok\":true}`; binding diagnostics moved to protected `/api/admin/health`.\n- D1 website publication scheduling added independently of social scheduling.\n- Remaining P0 evidence is operational: authenticated Admin Console browser readback, anonymous/private-window denial readback, and production security-header readback.\n"""
          p.write_text(s)
          PY
          node --check _worker.js
          node --check _worker_legacy.js
          node --check admin/console/app.js
          node --check lib/website_schedule.js
          node --check lib/site_visibility_api.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js _worker_legacy.js admin/console/app.js ops/MASTER_RULES.md ops/P0_SECURITY_AUDIT.md
          git commit -m 'Harden admin bridge and initialize website scheduler'
          git push
