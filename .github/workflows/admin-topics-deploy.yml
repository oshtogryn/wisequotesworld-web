name: Admin topics deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-topics-deploy.yml'
      - 'lib/admin_topics_api.js'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire API into production worker
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('_worker.js')
          s=p.read_text()
          imp="import {adminTopicsApi} from './lib/admin_topics_api.js';"
          if imp not in s:
              anchor="import {productionConsoleApi,readbackProductionStatus} from './lib/production_console_api.js';"
              assert anchor in s
              s=s.replace(anchor,anchor+'\n'+imp,1)
          call="const topicAdminResponse=await adminTopicsApi(request,env);if(topicAdminResponse)return topicAdminResponse;"
          if call not in s:
              anchor="const productionResponse=await productionConsoleApi(request,env);"
              assert anchor in s
              s=s.replace(anchor,call+anchor,1)
          if '// deploy-marker: admin-topics-v1' not in s:
              s='// deploy-marker: admin-topics-v1\n'+s
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          if git diff --cached --quiet; then echo 'Already wired'; else git commit -m 'Wire Admin editorial topic API'; git push; fi
      - name: Wait and verify Admin API route
        run: |
          sleep 55
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' 'https://wisequotesworld.com/api/admin/topics')
          cat /tmp/r.json || true
          test "$code" = "401"
